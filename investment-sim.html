<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CAPITAL TERMINAL // 日本株トレードシミュレーション</title>
<style>
/* ==========================================================================
   デザイントークン(維持): Bloomberg端末 × TradingView × moomoo × SBI証券
   ========================================================================== */
:root{
  --bg:#05070A; --panel:#0A0E14; --panel-alt:#0D131C; --line:#1B2430; --line-soft:#141B24;
  --text:#D9E2EA; --muted:#67768A; --muted-2:#3F4C5C;
  --cyan:#00E5FF; --green:#FF3B5C; --red:#00FF9C; --amber:#FFB300; --purple:#C084FC;
  --font: ui-monospace, "SF Mono", "Roboto Mono", "Consolas", "Menlo", monospace;
  --font-wide: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; touch-action:manipulation;}
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); overscroll-behavior:none; user-select:none; font-variant-numeric:tabular-nums; touch-action:manipulation; }
/* スマホでの意図しないズーム(ダブルタップ・連打・ピンチ)を防止する。scroll(pan-y)は許可しつつ、
   ズームジェスチャーだけを無効化する touch-action:manipulation を、連打されやすい操作要素すべてに明示的に適用する */
button, .btn, .icon-btn, .qty-btn, .btn-toggle, .tab-btn, .subtab-btn,
input, select, textarea, a, [onclick], [data-otype], [data-sub] {
  touch-action: manipulation;
}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:540px; margin:0 auto; position:relative; border-left:1px solid var(--line); border-right:1px solid var(--line); touch-action:manipulation;}

#topbar{ flex-shrink:0; background:#060A0F; border-bottom:1px solid var(--line); }
#debug-banner{ display:none; flex-shrink:0; background:var(--red); color:#fff; text-align:center; font-size:10.5px; font-weight:800; letter-spacing:0.1em; padding:3px 0; font-family:var(--font-wide); }
#debug-banner.show{ display:block; }
.topbar-row0{ display:flex; justify-content:space-between; align-items:center; padding:6px 10px 4px; }
.brand{ font-weight:800; letter-spacing:0.02em; font-size:12.5px; color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,0.35); }
.brand small{ color:var(--muted-2); font-weight:500; margin-left:6px; font-size:9px; text-shadow:none; }
.top-controls{ display:flex; gap:5px; }
.icon-btn{ background:var(--panel-alt); border:1px solid var(--line); color:var(--text); width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; }
.icon-btn.active{ background:var(--amber); color:#1a1200; border-color:var(--amber); }
#btn-speed{ width:auto; padding:0 8px; font-weight:700; font-size:11px; }

.idx-grid{ display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line-soft); }
.idx-cell{ padding:5px 8px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
.idx-cell:nth-child(3n){ border-right:none; }
.idx-cell .l{ font-size:8.5px; color:var(--muted-2); letter-spacing:0.05em; }
.idx-cell .v{ font-size:12.5px; font-weight:700; margin-top:1px; }
.idx-cell .v.cyan{ color:var(--cyan); } .idx-cell .v.gain{ color:var(--green); } .idx-cell .v.loss{ color:var(--red); } .idx-cell .v.amber{ color:var(--amber); }
.idx-cell .sv{ font-size:8.5px; color:var(--muted); margin-top:1px; }
.regime-strip{ display:flex; justify-content:space-between; align-items:center; padding:4px 10px; background:#080B10; border-top:1px solid var(--line-soft); font-size:9.5px; }
.regime-badge{ font-weight:800; padding:1px 7px; letter-spacing:0.04em; }
.regime-bull{ color:var(--green); background:rgba(255,59,92,0.1); }
.regime-bear{ color:var(--red); background:rgba(0,255,156,0.1); }
.regime-range{ color:var(--cyan); background:rgba(0,229,255,0.1); }
.regime-bubble{ color:var(--purple); background:rgba(192,132,252,0.12); }
.regime-crash{ color:#fff; background:var(--red); }

#ticker-wrap{ overflow:hidden; background:#050809; border-top:1px solid var(--line-soft); }
#ticker{ display:flex; white-space:nowrap; animation:ticker-scroll 34s linear infinite; padding:4px 0; }
@keyframes ticker-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item{ font-size:10.5px; margin-right:20px; color:var(--muted); flex-shrink:0; }
.ticker-item b{ color:var(--text); font-weight:600; margin-right:4px; }
.ticker-item .up{ color:var(--green); } .ticker-item .down{ color:var(--red); }

#content{ flex:1; overflow-y:auto; padding:0 0 82px; -webkit-overflow-scrolling:touch; }
.sec{ border-bottom:8px solid var(--bg); }
.sec-head{ display:flex; justify-content:space-between; align-items:baseline; padding:8px 12px; background:var(--panel-alt); border-bottom:1px solid var(--line); border-left:3px solid var(--cyan); }
.sec-head h2{ margin:0; font-size:11px; letter-spacing:0.08em; color:var(--text); text-transform:uppercase; font-weight:700; }
.sec-head .sub{ font-size:10px; color:var(--muted); }
.sec-body{ background:var(--panel); padding:10px 12px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-soft); }
.grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line-soft); }
.stat-box{ background:var(--panel); padding:9px 11px; }
.stat-box .l{ font-size:9.5px; color:var(--muted-2); }
.stat-box .v{ font-size:14px; font-weight:700; margin-top:3px; }
.stat-box .v.gain{ color:var(--green); } .stat-box .v.loss{ color:var(--red); } .stat-box .v.amber{ color:var(--amber); }

.hero-num{ font-size:26px; font-weight:800; letter-spacing:-0.01em; transition:color .3s; }
.hero-num.flash-up{ color:var(--green); } .hero-num.flash-down{ color:var(--red); }
.goal-bar-outer{ height:6px; background:#10161f; overflow:hidden; margin-top:8px; border:1px solid var(--line); }
.goal-bar-inner{ height:100%; background:linear-gradient(90deg, #7a5a00, var(--amber)); }
.goal-label{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:5px; }
canvas.chart{ width:100%; display:block; }

.row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
.row:last-child{ border-bottom:none; } .row:active{ background:#0e1420; }
.row-left{ min-width:0; flex:1; } .row-left .nm{ font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-left .sub{ font-size:9.5px; color:var(--muted-2); margin-top:2px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.spark{ width:52px; height:28px; flex-shrink:0; }
.row-right{ text-align:right; flex-shrink:0; } .row-right .px{ font-weight:700; font-size:13.5px; } .row-right .chg{ font-size:10.5px; margin-top:3px; }

.badge{ display:inline-block; padding:1px 5px; font-size:8px; font-weight:700; border:1px solid; line-height:1.5; }
.badge.gain{ color:var(--green); border-color:rgba(255,59,92,0.35); background:rgba(255,59,92,0.08); }
.badge.loss{ color:var(--red); border-color:rgba(0,255,156,0.35); background:rgba(0,255,156,0.08); }
.badge.theme{ color:var(--purple); border-color:rgba(192,132,252,0.4); background:rgba(192,132,252,0.08); }
.badge.warn{ color:var(--amber); border-color:rgba(255,179,0,0.4); background:rgba(255,179,0,0.08); }
.badge.info{ color:var(--cyan); border-color:rgba(0,229,255,0.35); background:rgba(0,229,255,0.08); }
.badge.neutral{ color:var(--muted); border-color:var(--line); background:transparent; }
.badge.stop{ color:#fff; border-color:#FF3B5C; background:#FF3B5C; font-weight:800; } /* ストップ高=上昇イベントのため常に赤(日本式) */
.badge.stopdown{ color:#fff; border-color:var(--muted); background:var(--muted-2); font-weight:800; }

.pill{ display:inline-block; padding:2px 7px; font-size:10.5px; font-weight:700; }
.pill.gain{ background:rgba(255,59,92,0.1); color:var(--green); } .pill.loss{ background:rgba(0,255,156,0.1); color:var(--red); }

.news-row{ padding:9px 12px; border-bottom:1px solid var(--line-soft); }
.news-row:last-child{ border-bottom:none; }
.news-top{ display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap; }
.news-day{ font-size:9px; color:var(--muted-2); }
.stars{ font-size:9.5px; color:var(--amber); letter-spacing:1px; } .stars .dim{ color:#3a3320; }
.news-text{ font-size:12px; line-height:1.55; color:var(--text); font-family:var(--font-wide); }

/* SNSタイムライン風ニュースフィード */
.news-tl-row{ display:flex; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; align-items:flex-start; }
.news-tl-row:last-child{ border-bottom:none; }
.news-tl-row:active{ background:#0e1420; }
.news-tl-avatar{ width:30px; height:30px; flex-shrink:0; border-radius:50%; background:var(--panel-alt); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; }
.news-tl-body{ flex:1; min-width:0; }
.news-tl-headline{ font-size:12.5px; line-height:1.5; color:var(--text); font-weight:600; font-family:var(--font-wide); }
.news-tl-chevron{ color:var(--muted-2); font-size:16px; flex-shrink:0; padding-top:4px; }

.emp-row{ padding:10px 12px; border-bottom:1px solid var(--line-soft); } .emp-row:last-child{ border-bottom:none; }
.emp-top{ display:flex; justify-content:space-between; align-items:center; }
.emp-name{ font-weight:700; font-size:12.5px; }
.role-tag{ font-size:9px; padding:2px 6px; font-weight:700; letter-spacing:0.02em; }
.role-analyst{ background:rgba(0,229,255,0.1); color:var(--cyan); } .role-trader{ background:rgba(255,179,0,0.1); color:var(--amber); }
.stat-line{ display:flex; gap:3px; margin-top:7px; align-items:center; }
.stat-line .k{ font-size:8.5px; color:var(--muted-2); width:32px; flex-shrink:0; }
.mbar-o{ flex:1; height:4px; background:#0e141d; } .mbar-i{ height:100%; background:var(--cyan); }
.emp-sub{ font-size:9.5px; color:var(--muted); margin-top:7px; }

.dept-row{ padding:11px 12px; border-bottom:1px solid var(--line-soft); } .dept-row:last-child{ border-bottom:none; }
.dept-top{ display:flex; justify-content:space-between; align-items:center; }
.dept-name{ font-weight:800; font-size:13px; font-family:var(--font-wide); }
.dept-lv{ font-size:10px; color:var(--cyan); font-weight:700; }
.dept-effects{ font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.7; font-family:var(--font-wide); }
.dept-effects .locked{ color:var(--muted-2); }
.dept-effects .unlocked{ color:var(--text); }

.btn{ border:1px solid transparent; padding:9px 12px; font-weight:700; font-size:12px; cursor:pointer; font-family:var(--font-wide); }
.btn-cyan{ background:var(--cyan); color:#00191d; } .btn-cyan:disabled{ background:#12333a; color:#3a5a60; cursor:not-allowed; }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--text); }
.btn-red{ background:var(--red); color:#2a0006; } .btn-red:disabled{ background:#3a1420; color:#6b4550; cursor:not-allowed; }
.btn-block{ width:100%; } .btn-sm{ padding:6px 10px; font-size:10.5px; }
.btn-toggle{ flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--muted); padding:7px 4px; font-size:10.5px; font-weight:700; cursor:pointer; font-family:var(--font-wide); }
.btn-toggle.active{ background:var(--cyan); color:#00191d; border-color:var(--cyan); }
.toggle-row{ display:flex; gap:4px; }

.empty-state{ text-align:center; padding:26px 10px; color:var(--muted-2); font-size:11.5px; font-family:var(--font-wide); }

#tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; background:#060A0F; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
.tab-btn{ flex:1; background:none; border:none; color:var(--muted-2); padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; min-width:0; }
.tab-btn .ic{ font-size:15px; } .tab-btn .lb{ font-size:8px; font-weight:700; white-space:nowrap; font-family:var(--font-wide); }
.tab-btn.active{ color:var(--cyan); }
.tab-unread{ position:relative; }
.tab-unread::after{ content:attr(data-count); position:absolute; top:-2px; right:calc(50% - 18px); background:var(--red); color:#fff; font-size:8px; font-weight:800; min-width:13px; height:13px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0 2px; }

#modal-overlay{ position:absolute; inset:0; background:rgba(2,3,5,0.8); display:none; align-items:flex-end; z-index:50; }
#modal-overlay.show{ display:flex; }
#modal{ width:100%; max-height:90%; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-bottom:none; padding:14px 14px calc(18px + env(safe-area-inset-bottom)); }
.modal-handle{ width:32px; height:3px; background:var(--line); margin:0 auto 12px; }
.modal-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.modal-title{ font-size:16px; font-weight:800; font-family:var(--font-wide); }
.modal-close{ background:var(--panel-alt); border:1px solid var(--line); color:var(--muted); width:26px; height:26px; font-size:13px; cursor:pointer; }

.subtab-row{ display:flex; gap:0; margin:8px 0 12px; border:1px solid var(--line); }
.subtab-btn{ flex:1; background:var(--panel-alt); border:none; border-right:1px solid var(--line); color:var(--muted); padding:8px 2px; font-size:10.5px; font-weight:700; cursor:pointer; font-family:var(--font-wide); }
.subtab-btn:last-child{ border-right:none; }
.subtab-btn.active{ background:var(--cyan); color:#00191d; }

.dtable{ width:100%; border-collapse:collapse; font-size:11.5px; }
.dtable td{ padding:6px 0; border-bottom:1px solid var(--line-soft); }
.dtable td:first-child{ color:var(--muted); font-family:var(--font-wide); }
.dtable td:last-child{ text-align:right; font-weight:700; }
.dtable tr:last-child td{ border-bottom:none; }

.qty-row{ display:flex; align-items:center; gap:8px; margin:10px 0; }
.qty-row input{ flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); font-family:var(--font); font-size:15px; text-align:center; padding:9px; }
.qty-btn{ width:40px; height:40px; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); font-size:17px; flex-shrink:0; }
.buy-sell-row{ display:flex; gap:8px; margin-top:10px; }
.price-input-row{ display:flex; align-items:center; gap:6px; margin:8px 0; }
.price-input-row label{ font-size:10.5px; color:var(--muted); width:76px; flex-shrink:0; font-family:var(--font-wide); }
.price-input-row input{ flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); font-family:var(--font); font-size:13px; padding:7px 8px; }
.qty-stepper{ flex:1; display:flex; align-items:center; gap:6px; }
.qty-stepper input{ flex:1; min-width:0; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); font-family:var(--font); font-size:15px; text-align:center; padding:9px 4px; }

.forecast-bar-outer{ height:16px; background:#10161f; display:flex; overflow:hidden; border:1px solid var(--line); margin:6px 0 10px; }
.forecast-seg{ height:100%; display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:700; color:#04120a; }

.order-row{ padding:9px 12px; border-bottom:1px solid var(--line-soft); }
.order-row:last-child{ border-bottom:none; }
.order-top{ display:flex; justify-content:space-between; align-items:center; }
.order-cancel{ color:var(--red); font-size:10px; cursor:pointer; font-family:var(--font-wide); }

.toast{ position:absolute; bottom:76px; left:50%; transform:translateX(-50%); background:var(--panel-alt); border:1px solid var(--line); color:var(--text); padding:8px 15px; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap; font-size:11.5px; font-family:var(--font-wide); max-width:90%; overflow:hidden; text-overflow:ellipsis; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">
  <div id="debug-banner">DEBUG MODE</div>
  <div id="topbar">
    <div class="topbar-row0">
      <div class="brand" id="brand-label">CAPITAL TERMINAL<small>—</small></div>
      <div class="top-controls">
        <button class="icon-btn" id="btn-debug-menu" title="開発者メニュー">&#9881;</button>
        <button class="icon-btn" id="btn-help" title="チュートリアル">?</button>
        <button class="icon-btn" id="btn-reset" title="設定・セーブデータ">&#128190;</button>
        <button class="icon-btn" id="btn-speed" title="進行速度">1x</button>
      </div>
    </div>
    <div class="idx-grid" id="idx-grid"></div>
    <div class="regime-strip" id="regime-strip"></div>
    <div id="ticker-wrap"><div id="ticker"></div></div>
  </div>

  <div id="content"></div>
  <div id="modal-overlay"><div id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <div id="tabbar">
    <button class="tab-btn active" data-tab="dashboard"><span class="ic">&#9635;</span><span class="lb">概況</span></button>
    <button class="tab-btn" data-tab="watchlist"><span class="ic">&#9636;</span><span class="lb">銘柄</span></button>
    <button class="tab-btn" data-tab="ipo"><span class="ic" id="ipo-tab-icon">&#9737;</span><span class="lb" id="ipo-tab-label">IPO</span></button>
    <button class="tab-btn" data-tab="portfolio"><span class="ic">&#9638;</span><span class="lb">保有/注文</span></button>
    <button class="tab-btn" data-tab="analysis"><span class="ic">&#9673;</span><span class="lb">分析</span></button>
    <button class="tab-btn" data-tab="company"><span class="ic">&#9632;</span><span class="lb">会社</span></button>
    <button class="tab-btn" data-tab="sports"><span class="ic">&#9917;</span><span class="lb">エンタメ</span></button>
    <button class="tab-btn" data-tab="news"><span class="ic">&#9650;</span><span class="lb">ニュース</span></button>
  </div>
</div>

<script>
/* ==========================================================================
   CAPITAL TERMINAL — 日本株トレードシミュレーション
   モジュール構成:
   1. Utilities        2. Master Data      3. State
   4. Market Engine(日経平均・相場サイクル)   5. Stock Price Engine(値幅制限含む)
   6. Technical Analysis Module           7. Order System Module
   8. Company Departments Module          9. Forecast/Analyst Report Module
   10. Milestone/IPO/Delisting            11. Rendering
   12. Boot
   ========================================================================== */

/* ==========================================================================
   1. UTILITIES
   ========================================================================== */
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function seededPick(arr, rng){ return arr[Math.floor(rng()*arr.length)]; }
const avg = (arr) => arr.reduce((a,b)=>a+b,0)/arr.length;

function fmtYen(n){
  const sign = n < 0 ? "-" : "";
  n = Math.abs(n);
  if(n >= 1e12) return sign + (n/1e12).toFixed(2) + "兆円";
  if(n >= 1e8)  return sign + (n/1e8).toFixed(2) + "億円";
  if(n >= 1e4)  return sign + (n/1e4).toFixed(1) + "万円";
  return sign + "¥" + Math.round(n).toLocaleString();
}
function fmtNum(n, digits=0){ return n.toLocaleString(undefined,{maximumFractionDigits:digits, minimumFractionDigits:digits}); }
function fmtPct(n, digits=1){ const s = n>0?"+":""; return s + n.toFixed(digits) + "%"; }
function starsHtml(n){ let s=""; for(let i=0;i<5;i++) s += i<n ? "★" : '<span class="dim">★</span>'; return `<span class="stars">${s}</span>`; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h>>>0; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function gameDateObj(dayNum){ const base = new Date(state.foundedDateISO); return new Date(base.getTime() + (dayNum-1)*86400000); }
function fmtDateFull(dayNum){ const d=gameDateObj(dayNum); const wd=["日","月","火","水","木","金","土"][d.getDay()]; return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${wd})`; }

   株主マスターデータ(単一の情報源。株価・株主構成・需給・ニュース・掲示板・

// 株主を一度だけ生成し、以後は永続データとして保持する(画面ごとの再生成は行わない)
function initShareholderRegistry(st){
  const rng = mulberry32(hashStr(st.id+"_holders_master"));
  const total = st.shares;
  const holders = [];
  let allocated = 0;
  const genId = ()=> "sh_"+Math.random().toString(36).slice(2,9);

  const instNames = [...HOLDER_NAMES.filter(n=>n.includes("信託")||n.includes("生命")||n.includes("銀行")||n.includes("ファンド"))].sort(()=>rng()-0.5).slice(0,3);
  const instTotalPct = 25+rng()*30;
  instNames.forEach((name,i)=>{
    const pct = instTotalPct * (i===0?0.5:(i===1?0.3:0.2));
    const shares = Math.round(total*pct/100);
    holders.push({id:genId(), name, type:"institutional", shares, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:true, lockup:false, isFloat:false, style:"institutional"});
    allocated += shares;
  });

  const foreignPct = 5+rng()*20;
  const foreignShares = Math.round(total*foreignPct/100);
  holders.push({id:genId(), name:"海外投資家(合算)", type:"foreign", shares:foreignShares, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:false, lockup:false, isFloat:true, style:"foreign"});
  allocated += foreignShares;

  const profile = getCompanyProfile(st);
  const mgmtPct = 2+rng()*8;
  const mgmtShares = Math.round(total*mgmtPct/100);
  holders.push({id:genId(), name:profile.ceo+"(経営陣)", type:"individual", shares:mgmtShares, isMajor:false, isManagement:true, isFounder:false, isParent:false, isStable:true, lockup:true, isFloat:false, style:"longterm"});
  allocated += mgmtShares;

  if(rng()<0.4){
    const founderPct = 3+rng()*10;
    const founderShares = Math.round(total*founderPct/100);
    holders.push({id:genId(), name:profile.ceo+"創業家", type:"individual", shares:founderShares, isMajor:false, isManagement:false, isFounder:true, isParent:false, isStable:true, lockup:true, isFloat:false, style:"longterm"});
    allocated += founderShares;
  }

  if(rng()<0.5){
    const treasuryPct = 1+rng()*4;
    const treasuryShares = Math.round(total*treasuryPct/100);
    holders.push({id:genId(), name:"自己株式(会社保有)", type:"company", shares:treasuryShares, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:true, lockup:true, isFloat:false, style:"longterm"});
    allocated += treasuryShares;
  }

  const floatSharesTotal = Math.max(0, total-allocated);
  holders.push({id:"float_pool", name:"個人投資家(市場流通分)", type:"individual", shares:floatSharesTotal, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:false, lockup:false, isFloat:true, style:"mixed"});

  holders.forEach(h=> h.isMajor = (h.shares/total*100)>=5);
  return holders;
}
// プレイヤーの実保有(state.portfolioが唯一の情報源)を、株主登録簿の明示的な1エントリとして常に同期する。
// 通常の売買は市場流通分(float_pool)との間で受け渡しされたものとして扱う。
function syncPlayerShareholderEntry(st){
  const holders = st.shareholders;
  if(!holders) return;
  let player = holders.find(h=>h.id==="player");
  if(!player){
    player = {id:"player", name:"プレイヤー", type:"player", shares:0, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:false, lockup:false, isFloat:true, style:"player"};
    holders.push(player);
  }
  player.name = (state.playerName && state.playerName.trim()) || "プレイヤー";
  const actualShares = state.portfolio[st.id] ? state.portfolio[st.id].shares : 0;
  const delta = actualShares - player.shares;
  if(delta !== 0){
    const floatPool = holders.find(h=>h.id==="float_pool");
    if(floatPool) floatPool.shares = Math.max(0, floatPool.shares-delta);
    player.shares = actualShares;
  }
  player.isMajor = st.shares>0 && (player.shares/st.shares*100)>=5;
}
function ensureShareholderRegistry(st){
  if(!st.shareholders || !st.shareholders.length) st.shareholders = initShareholderRegistry(st);
  syncPlayerShareholderEntry(st);
  return st.shareholders;
}
// 表示用の統合株主リスト(登録簿そのものを保有株数の降順で並べたもの。0株のエントリは除く)
function getUnifiedShareholders(st){
  ensureShareholderRegistry(st);
  return st.shareholders
    .filter(h=>h.shares>0)
    .map(h=> h.id==="float_pool" ? {...h, name:"個人投資家(その他)"} : {...h})
    .sort((a,b)=>b.shares-a.shares);
}
function playerOwnershipPct(st){
  const pos = state.portfolio[st.id];
  const shares = pos ? pos.shares : 0;
  return st.shares>0 ? (shares/st.shares*100) : 0;
}
// 資本異動(増資・分割・自社株買い)の際、株主マスターデータの整合性を保ちながら反映する
// 登録簿の合計が発行済株式数と厳密に一致するよう検算・是正する(安全網)。
// 差異が生じた場合は市場流通分(個人投資家)で吸収する(現実の株式集計でも端数調整に相当する扱い)
function reconcileShareholderRegistry(st){
  const holders = ensureShareholderRegistry(st);
  let sum = holders.reduce((s,h)=>s+h.shares,0);
  let diff = st.shares - sum;
  if(diff === 0) return holders;
  let floatPool = holders.find(h=>h.id==="float_pool");
  if(!floatPool){
    floatPool = {id:"float_pool", name:"個人投資家(市場流通分)", type:"individual", shares:0, isMajor:false, isManagement:false, isFounder:false, isParent:false, isStable:false, lockup:false, isFloat:true, style:"mixed"};
    holders.push(floatPool);
  }
  if(diff>0){
    // 登録簿の合計が発行済株式数に不足している → float_poolへ不足分を追加する
    floatPool.shares += diff;
  } else {
    // 登録簿の合計が発行済株式数を超えている → まずfloat_poolから吸収し、
    // それでも足りない場合は他の保有者から比例的に減らし、必ず一致させる(0でクランプして放置しない)
    const excess = -diff;
    const absorbedByFloat = Math.min(floatPool.shares, excess);
    floatPool.shares -= absorbedByFloat;
    let remainingExcess = excess - absorbedByFloat;
    if(remainingExcess>0){
      const others = holders.filter(h=>h.id!=="float_pool" && h.shares>0);
      const othersTotal = others.reduce((s,h)=>s+h.shares,0);
      if(othersTotal>0){
        others.forEach(h=>{
          const reduction = Math.floor(remainingExcess*(h.shares/othersTotal));
          h.shares = Math.max(0, h.shares-reduction);
        });
      }
      // 端数調整: 比例配分の丸め誤差が残る場合、最大保有者で最終的に一致させる
      sum = holders.reduce((s,h)=>s+h.shares,0);
      diff = st.shares - sum;
      if(diff!==0){
        const largest = holders.reduce((a,b)=> b.shares>a.shares ? b : a, holders[0]);
        largest.shares = Math.max(0, largest.shares+diff);
      }
    }
  }
  return holders;
}
// デバッグモード用: 株主構成データ整合性チェック(10項目)。異常があれば項目・期待値・実際値・計算式を返す
function runShareholderConsistencyCheck(){
  const issues = [];
  state.stocks.forEach(st=>{
    const holders = getUnifiedShareholders(st);
    const sum = holders.reduce((s,h)=>s+h.shares,0);
    if(sum!==st.shares) issues.push({item:"①全株主保有株数合計=発行済株式数", stock:st.name, expected:st.shares, actual:sum, formula:"Σ(株主.保有株数)"});

    const data = getShareholderData(st);
    const totalPct = data.institutional+data.foreign+data.individual;
    if(Math.abs(totalPct-100)>2) issues.push({item:"②個人+機関+外国=100%", stock:st.name, expected:"100%", actual:totalPct+"%", formula:"institutional+foreign+individual"});

    // ③ 大株主保有比率(非流通株式比率)がその定義式どおりに算出されているか
    const nonFloatPctCalc = st.shares>0 ? (100 - (floatShares(st)/st.shares*100)) : 0;
    if(Math.abs(nonFloatPctCalc-parseFloat(data.majorHolderRatio))>1) issues.push({item:"③大株主保有比率が定義式と一致", stock:st.name, expected:nonFloatPctCalc.toFixed(1)+"%", actual:data.majorHolderRatio+"%", formula:"100-(流通株式数/発行済株式数×100)"});

    const pos = state.portfolio[st.id];
    const playerShares = pos?pos.shares:0;
    const playerPctCalc = playerOwnershipPct(st);
    if(Math.abs(playerPctCalc-parseFloat(data.playerPct))>0.5) issues.push({item:"④プレイヤー保有株数と保有比率が一致", stock:st.name, expected:playerPctCalc.toFixed(2)+"%", actual:data.playerPct+"%", formula:"プレイヤー保有株数/発行済株式数"});

    const floatCalc = floatShares(st);
    if(floatCalc!==data.floatShareCount) issues.push({item:"⑤流通株式数と流通株式比率が一致", stock:st.name, expected:floatCalc, actual:data.floatShareCount, formula:"発行済株式数×floatRatio"});

    if(Math.round(st.marginBuyOutstanding)!==data.marginBuy) issues.push({item:"⑥信用買い残=実際の信用買い建玉", stock:st.name, expected:Math.round(st.marginBuyOutstanding), actual:data.marginBuy, formula:"st.marginBuyOutstanding"});
    if(Math.round(st.marginSellOutstanding)!==data.marginSell) issues.push({item:"⑦信用売り残=実際の信用売り建玉", stock:st.name, expected:Math.round(st.marginSellOutstanding), actual:data.marginSell, formula:"st.marginSellOutstanding"});

    const majorList = holders.filter(h=>h.isMajor);
    const sortedCheck = [...majorList].sort((a,b)=>b.shares-a.shares);
    const isSorted = majorList.every((h,i)=>h.id===sortedCheck[i].id);
    if(!isSorted) issues.push({item:"⑧大株主ランキングが保有株数順", stock:st.name, expected:"保有株数の降順", actual:"順序不一致", formula:"holders.sort((a,b)=>b.shares-a.shares)"});
  });

  if(state.activeTob && !state.activeTob.resolved){
    const st = state.stocks.find(s=>s.id===state.activeTob.stockId);
    const namedApplied = (state.activeTob.appliedHolderIds||[]).length;
    if(state.activeTob.appliedShares<0) issues.push({item:"⑨TOB応募株数と株主データが一致", stock:st?st.name:"?", expected:"0以上", actual:state.activeTob.appliedShares, formula:"tob.appliedShares"});
  }

  state.ventures.filter(v=>v.stage==="listed").forEach(v=>{
    const st = state.stocks.find(s=>s.id===v.listedStockId);
    if(!st) issues.push({item:"⑩買収後の企業グループと企業データが一致", stock:v.name, expected:"対応する銘柄が存在する", actual:"銘柄が見つからない", formula:"venture.listedStockId → state.stocks"});
  });

  return issues;
}
function adjustShareholderRegistryForCapitalEvent(st, type, amount){
  const holders = ensureShareholderRegistry(st);
  const floatPool = holders.find(h=>h.id==="float_pool");
  if(!floatPool) return;
  if(type==="増資"){
    floatPool.shares += amount; // 新株は市場流通分に追加され、既存株主の比率が希薄化する
  } else if(type==="株式分割"){
    holders.forEach(h=> h.shares = Math.round(h.shares*amount));
  } else if(type==="自社株買い"){
    floatPool.shares = Math.max(0, floatPool.shares-amount); // 市場流通分から買い戻す
  }
  holders.forEach(h=> h.isMajor = (h.shares/st.shares*100)>=5);
}

// 銘柄ごとの市場心理スコア(ファンダメンタルズ・直近の値動き・緩やかに漂うムードから算出)
function computeStockSentiment(st){
  const per = st.profit>0 ? st.price/(st.profit/st.shares) : 999;
  let score = 0;
  score += clamp((st.growth-10)/40, -0.3, 0.4);
  score += clamp((30-per)/60, -0.3, 0.3);
  const recentReturn = st.history.length>=10 ? (st.price/st.history[st.history.length-10].c - 1) : 0;
  score += clamp(recentReturn*0.6, -0.35, 0.35);
  score += (st.moodDrift||0);
  return clamp(score, -1, 1);
}
function sentimentLabel(score){
  if(score>0.35) return "強気";
  if(score>0.12) return "やや強気";
  if(score<-0.35) return "弱気";
  if(score<-0.12) return "やや弱気";
  return "中立";
}
function pickBoardCategory(sentimentScore, persona){
  const personalBias = sentimentScore + (persona.bias||0) + rand(-0.4,0.4);
  return personalBias>0.15 ? "bullish" : (personalBias<-0.15 ? "bearish" : "neutral");
}

function triggerNewsBoardBurst(st, isPositive, stars){
  if(!st.boardPosts) st.boardPosts=[];
  const burstSize = stars>=5 ? randInt(18,30) : (stars>=4 ? randInt(10,18) : randInt(4,8));
  const bullRatio = isPositive ? 0.62 : 0.28; // 好材料でも懐疑派は残り、悪材料でも押し目狙いの強気派はいる
  for(let i=0;i<burstSize;i++){
    const persona = pick(BOARD_PERSONAS);
    const roll = Math.random();
    const category = roll<bullRatio ? "bull" : (roll<bullRatio+0.25 ? "neutral" : "bear");
    const bucket = category==="bull" ? NEWS_REACTION_IMMEDIATE.bull : (category==="bear" ? NEWS_REACTION_IMMEDIATE.bear : NEWS_REACTION_IMMEDIATE.neutral);
    const text = pick(bucket)(st);
    st.boardPosts.unshift({persona: persona.name, text, category: category==="bull"?"bullish":(category==="bear"?"bearish":"neutral"), day: state.day});
  }
  if(st.boardPosts.length>60) st.boardPosts.length = 60;
  // 翌日・数日後の時間差反応をキューに登録しておく
  state.pendingBoardReactions = state.pendingBoardReactions || [];
  state.pendingBoardReactions.push({stockId:st.id, isPositive, dueDay: state.day+1, wave:"nextday"});
  state.pendingBoardReactions.push({stockId:st.id, isPositive, dueDay: state.day+randInt(2,4), wave:"hindsight"});
}
function processQueuedNewsReactions(){

    const count = randInt(3,7);

  });
}

let state = null;
const STORAGE_KEY = "capital-terminal-save-v3";
const DEBUG_STORAGE_KEY = "capital-terminal-save-v3-debug";
const BACKUP_STORAGE_KEY = "capital-terminal-save-v3-backup"; // 直近世代のバックアップ(既存キーはそのまま維持し、新規キーとして追加する)
const CURRENT_SAVE_VERSION = 1; // セーブデータのバージョン管理をここから導入する(既存セーブはversion未定義=旧データとして安全に扱う)
let isDebugMode = false; // デバッグモード(通常モードのセーブデータとは完全に分離する)
function currentStorageKey(){ return isDebugMode ? DEBUG_STORAGE_KEY : STORAGE_KEY; }

// ストレージ抽象化層: Claude Artifacts環境ではwindow.storageを、それ以外(GitHub Pagesなどでの単体公開)では
// ブラウザのlocalStorageを自動的に使う。window.storageが存在しない環境でも確実にセーブデータが永続化される。
const hasArtifactStorage = (typeof window!=="undefined") && !!window.storage && typeof window.storage.get==="function";
async function storageGet(key){
  if(hasArtifactStorage){
    try{ const res = await window.storage.get(key, false); return (res && res.value!=null) ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return (typeof localStorage!=="undefined") ? localStorage.getItem(key) : null; }
  catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasArtifactStorage){
    try{ const res = await window.storage.set(key, value, false); return !!res; }
    catch(e){ return false; }
  }
  try{ if(typeof localStorage!=="undefined"){ localStorage.setItem(key, value); return true; } return false; }
  catch(e){ return false; }
}
async function storageDelete(key){
  if(hasArtifactStorage){
    try{ await window.storage.delete(key, false); return true; } catch(e){ return false; }
  }
  try{ if(typeof localStorage!=="undefined"){ localStorage.removeItem(key); return true; } return false; }
  catch(e){ return false; }
}

// セーブデータとして最低限成立しているかどうかを検証する(壊れたJSONやNaN汚染などを検出する。正常なデータは一切変更しない)
function validateSaveDataShape(data){
  if(!data || typeof data!=="object") return false;
  if(typeof data.cash!=="number" || !isFinite(data.cash)) return false;
  if(typeof data.day!=="number" || !isFinite(data.day) || data.day<1) return false;
  if(!Array.isArray(data.stocks) || data.stocks.length===0) return false;
  if(typeof data.portfolio!=="object" || data.portfolio===null) return false;
  return true;
}

// セーブデータのバージョン別マイグレーション。今後の構造変更はここに追記していく(古いデータを壊さず新形式へ変換する)。
// 例: SAVE_MIGRATIONS[1] = (s)=>{ if(s.newField===undefined) s.newField = defaultValue; };
const SAVE_MIGRATIONS = {
  // v1時点では新規追加された構造上の変換は無い(既存の項目追加はすべてmigrateState内の「存在しなければ追加」方式で吸収する)
};
function runSaveVersionMigrations(){
  if(state.saveDataVersion===undefined) state.saveDataVersion = 1; // バージョン管理導入前の既存セーブはv1として扱う(データは一切変更しない)
  let v = state.saveDataVersion;
  while(v<CURRENT_SAVE_VERSION){
    if(SAVE_MIGRATIONS[v]) SAVE_MIGRATIONS[v](state);
    v += 1;
    state.saveDataVersion = v;
  }
  state.saveDataVersion = CURRENT_SAVE_VERSION;
}
let periodicAutosaveTimer = null;
function startPeriodicAutosave(){
  if(periodicAutosaveTimer) clearInterval(periodicAutosaveTimer);
  periodicAutosaveTimer = setInterval(()=>{ saveState(); }, 45000); // 45秒ごとの定期バックアップ保存(イベント駆動の自動保存に加えた保険)
}
let lastBackupTime = 0;
let suppressAutoSave = false; // オフライン・キャッチアップ中に毎日の自動保存を抑制し、最後に1回だけ保存するためのフラグ
async function saveState(){
  if(suppressAutoSave) return;
  try{
    if(state.saveDataVersion===undefined) state.saveDataVersion = CURRENT_SAVE_VERSION;
    state.lastSavedAt = new Date().toISOString();
    state.lastWallClockTime = new Date().toISOString(); // オフライン・キャッチアップ計算の基準時刻。プレイ中は保存のたびに更新し、閉じた瞬間の時刻に近づける
    const json = JSON.stringify(state);
    const ok = await storageSet(currentStorageKey(), json);
    if(!ok) console.warn("保存に失敗しました");
    // バックアップ世代を一定間隔で更新する(書き込み頻度を抑えつつ、直前の正常な状態を保持する)
    if(!isDebugMode){
      const now = Date.now();
      if(now-lastBackupTime>60000){
        lastBackupTime = now;
        await storageSet(BACKUP_STORAGE_KEY, json);
      }
    }
  } catch(e){ console.error("保存エラー:", e); }
}
async function loadState(){
  let hadRawData = false;
  // ① まず通常のセーブデータを試す
  try{
    const raw = await storageGet(currentStorageKey());
    if(raw){
      hadRawData = true;
      const parsed = JSON.parse(raw);
      if(validateSaveDataShape(parsed)) return {ok:true, data:parsed};
      console.warn("セーブデータの検証に失敗しました。バックアップの確認を試みます。");
    }
  } catch(e){ console.warn("セーブデータの読み込みに失敗しました:", e); }
  // ② メインが読めない/壊れている場合のみ、バックアップ世代から復元を試みる(デバッグモードは対象外)
  if(!isDebugMode){
    try{
      const rawBackup = await storageGet(BACKUP_STORAGE_KEY);
      if(rawBackup){
        hadRawData = true;
        const parsedBackup = JSON.parse(rawBackup);
        if(validateSaveDataShape(parsedBackup)){
          console.warn("メインのセーブデータが利用できなかったため、バックアップから復元しました。");
          return {ok:true, data:parsedBackup, restoredFromBackup:true};
        }
      }
    } catch(e){ /* バックアップも失敗した場合はここで終える */ }
  }
  return {ok:false, data:null, hadRawData};
}

function makeCandidate(role){
  const family = roleDef(role).family;
  const isAnalystFamily = family==="analyst";
  const isTrader = family==="trader";
  const cand = {
    id:"e"+Date.now()+randInt(0,9999), name:pick(SURNAMES)+pick(GIVEN), role, level:1, exp:0,
    stats:{ analysis: isAnalystFamily?randInt(45,80):randInt(15,45), judgement:randInt(30,65), trading: isTrader?randInt(45,80):randInt(15,45), risk:randInt(25,60), ai:randInt(10,45) },
    salary:0,
  };
  if(role==="theme"){ cand.specialtyTag = pick(Object.keys(TAG_LABELS)); cand.specialtyStars = randInt(2,5); }
  return cand;
}
function salaryFor(emp){ const total=Object.values(emp.stats).reduce((a,b)=>a+b,0); return Math.round(total*380*(1+(emp.level-1)*0.35)); }
function freshCandidates(){
  const list=[];
  for(let i=0;i<5;i++) list.push(makeCandidate(pick(ROLE_KEYS_HIRABLE)));
  list.forEach(c=> c.salary=salaryFor(c));
  return list;
}
function pickInitialTheme(){ const t=pick(THEME_DEFS); const totalDays=randInt(18,30); return {key:t.key, name:t.name, tags:t.tags, flowPct:randInt(40,120), daysLeft:totalDays, totalDays}; }

function makeRuntimeStock(def, listedDay){
  const targetROE = rand(0.08,0.16);
  return {
    ...def, price:def.basePrice, prevPrice:def.basePrice,
    history:[{o:def.basePrice, h:def.basePrice, l:def.basePrice, c:def.basePrice, day:listedDay, v:Math.round(def.shares*0.002)}],
    revenue:def.baseRevenue, profit:def.baseProfit,
    equity: def.baseProfit/targetROE,
    equityRatio: rand(0.30,0.70), // 自己資本比率(企業ごとに固定)
    daysUntilEarnings: randInt(6, def.ecMax), earningsCycle: randInt(def.ecMin, def.ecMax),
    smaPrevDiff:null, crossLog:[], listedDay,
    pendingMomentumPct:0, stopStreak:0, attentionBoostDays:0,
    earningsLog:[], // 四半期業績の履歴(直近8件)
    disclosures:[], // 適時開示(IR)の履歴(直近60件)
    declineStage:0, declineDayAtStage:0, // 段階的上場廃止パイプライン

    floatRatio: rand(0.35,0.75), // 発行済株式数に対する流通株式数の割合(残りは大株主保有分)

}

function isThemeMatch(st){ return st.themeTags.some(t => state.theme.tags.includes(t)); }
function feeRate(){
  const traders = state.employees.filter(e=>roleDef(e.role).family==="trader").length;
  const deptCut = state.departments.trading.level*0.0003;
  return clamp(0.005 - traders*0.0005 - deptCut, 0.0005, 0.005);
}
function analystCount(){ return state.employees.filter(e=>roleDef(e.role).family==="analyst").length; }
function bestAnalystLevel(){ const l=state.employees.filter(e=>roleDef(e.role).family==="analyst").map(e=>e.level); return l.length?Math.max(...l):0; }
function effectiveAnalystLevel(){ return bestAnalystLevel() + state.departments.research.level; }
function bestFundManagerLevel(){ const l=state.employees.filter(e=>roleDef(e.role).family==="fund").map(e=>e.level); return l.length?Math.max(...l):0; }
function bestRiskLevel(){ const l=state.employees.filter(e=>roleDef(e.role).family==="risk").map(e=>e.level); return l.length?Math.max(...l):0; }
function themeAnalystBonus(st){
  return state.employees.filter(e=>e.role==="theme" && e.specialtyTag && st.themeTags.includes(e.specialtyTag))
    .reduce((s,e)=>s+e.specialtyStars*0.008, 0);
}
function totalHoldingsValue(){
  let v=0;
  for(const id in state.portfolio){ const st=state.stocks.find(s=>s.id===id); if(st) v += st.price*state.portfolio[id].shares; }
  return v;
}
function netWorth(){ return state.cash + totalHoldingsValue(); }
function totalManagedAssets(){ return netWorth() + state.fund.aum; }
function availableCash(){ return state.cash - state.reservedCash; }
function pendingSellQty(stockId){ return state.pendingOrders.filter(o=>o.stockId===stockId && o.side==="sell" && o.status==="pending").reduce((s,o)=>s+o.qty,0); }
function availableShares(stockId){ const pos=state.portfolio[stockId]; if(!pos) return 0; return Math.max(0, pos.shares - pendingSellQty(stockId)); }
function todayCandle(st){ return st.history[st.history.length-1]; }
function pushNews(text, opts={}){
  const {stars=3, kind="confirmed", category="general", stockId=null, type="flavor", impactPct=null} = opts;
  state.news.unshift({day:state.day, text, stars, kind, category, stockId, type, impactPct});
  if(state.news.length>150) state.news.pop();
}
// 適時開示(IR)を該当銘柄のdisclosuresログに記録する。ニュースフィードとは別に、
// 銘柄詳細の「適時開示」タブで企業ごとの公式情報として閲覧できるようにする
function pushDisclosure(st, opts={}){
  if(!st) return;
  if(!st.disclosures) st.disclosures=[];
  const {label="開示", text, impactPct=null, type="flavor", stars=3, internalCategory="material"} = opts;
  st.disclosures.unshift({day:state.day, label, text, impactPct, type, stars, internalCategory});
  if(st.disclosures.length>60) st.disclosures.pop();
}

const CATEGORY_META = {
  theme:{icon:"🎯", label:"市場テーマ"}, earnings:{icon:"📊", label:"決算"},
  rumor:{icon:"💬", label:"市場の噂"}, "rumor-resolution":{icon:"✅", label:"噂の真相"},
  institutional:{icon:"🏦", label:"機関投資家動向"}, technical:{icon:"📈", label:"テクニカル"},
  material:{icon:"📰", label:"材料"}, macro:{icon:"🌐", label:"マクロ経済"},
  ipo:{icon:"🆕", label:"新規上場"}, delisting:{icon:"⚠️", label:"上場廃止"},
  milestone:{icon:"🏆", label:"マイルストーン"}, company:{icon:"🏢", label:"会社"},
  stop:{icon:"🛑", label:"値幅制限"}, order:{icon:"✔️", label:"約定"}, general:{icon:"📄", label:"ニュース"},
  venture:{icon:"🏗️", label:"企業買収・育成"},
};
function generateNewsDetail(n){
  const st = n.stockId ? state.stocks.find(s=>s.id===n.stockId) : null;
  const meta = CATEGORY_META[n.category] || CATEGORY_META.general;
  const name = st ? st.name : "当該銘柄";

  let body;
  switch(n.category){
    case "material":
      body = n.type==="good"
        ? `${name}に関する好材料が明らかになった。市場では今後の業績拡大への期待が高まっており、関連情報を精査する動きが強まっている。`
        : `${name}に関する悪材料が明らかになった。投資家心理の悪化により、当面は様子見姿勢が強まる可能性がある。`;
      break;
    case "earnings":
      body = (n.impactPct!=null && n.impactPct>0.01) ? `決算内容は市場予想を上回り、売上・利益ともに拡大した。今後の上方修正への思惑も出ている。`
        : (n.impactPct!=null && n.impactPct<-0.01) ? `決算内容は市場予想を下回った。今期の見通しについて慎重な見方が広がっている。`
        : `決算内容はおおむね市場予想通りで、株価への影響は限定的とみられる。`;
      break;
    case "rumor":
      body = `情報の出所は明らかになっていないが、SNSや一部メディアを通じて拡散している。真偽については数日以内に判明する見込みで、確定情報が出るまでは値動きが荒くなりやすい。`;
      break;
    case "rumor-resolution":
      body = `先に伝えられていた噂について、続報が入った。真偽不明の段階で先回りして売買していた投資家の思惑が的中/外れた形となった。`;
      break;
    case "institutional":
      body = `大口投資家の売買動向が観測された。ポジションの背景は明らかになっていないが、短期的な需給に影響を与える可能性がある。`;
      break;
    case "technical":
      body = `チャート上のシグナルが検出された。テクニカル分析を重視する投資家の間で注目が集まりやすい局面。`;
      break;
    case "theme":
      body = `市場のテーマ性が変化し、関連セクターへの資金シフトが進んでいる。個別銘柄の材料が乏しい局面でも、テーマ性だけで物色が広がることがある。`;
      break;
    case "macro":
      body = `マクロ経済環境に変化が生じている。金利・為替・海外市場の動向は幅広い銘柄のセンチメントに影響を与える。`;
      break;
    case "ipo":
      body = `新規上場により、市場の選択肢が広がった。上場直後は値動きが荒くなりやすく、初期の値付けには注意が必要。`;
      break;
    case "delisting":
      body = `上場廃止に関する情報。該当銘柄を保有していた場合は強制決済されるため、ポートフォリオへの影響を確認しておきたい。`;
      break;
    case "milestone":
      body = `会社の成長ステージが1段階進んだ。次の目標に向けて、事業規模の拡大を続けていきたい。`;
      break;
    case "company":
      body = `社内の体制強化に関するニュース。人材・部署への投資は中長期的な運用力の向上につながる。`;
      break;
    case "stop":
      body = n.type==="good"
        ? `買い注文が殺到し、値幅制限の上限まで株価が上昇した。売り注文が少なく、比例配分待ちの状態が続いている。`
        : `売り注文が殺到し、値幅制限の下限まで株価が下落した。買い手が少なく、値が付きにくい状態が続いている。`;
      break;
    case "venture":
      body = n.type==="good"
        ? `買収・出資先の非上場企業に関する動き。企業育成への投資が実を結びつつある。`
        : `買収・出資先の非上場企業に関する動き。企業育成が思うように進んでいない局面。`;
      break;
    default:
      body = `市場関係者の間で話題となっているニュース。`;
  }

  let changeRangeText, impactText;
  if(n.impactPct!=null){
    changeRangeText = fmtPct(n.impactPct*100);
    const mag = Math.abs(n.impactPct);
    impactText = mag>=0.08 ? "非常に大きい" : (mag>=0.03 ? "大きい" : "小〜中程度");
  } else {
    const rangeMap = {5:"±15%以上", 4:"±5〜15%", 3:"±2〜5%", 2:"±1〜2%", 1:"軽微"};
    changeRangeText = rangeMap[n.stars] || "軽微";
    impactText = n.stars>=4 ? "大きい" : (n.stars===3 ? "中程度" : "軽微");
  }

  let stopProb = null;
  if(n.impactPct!=null && Math.abs(n.impactPct)>=0.06 && st){
    const band = getPriceLimitBand(st.price);
    const bandPct = band/st.price;
    stopProb = clamp(Math.round(Math.abs(n.impactPct)/bandPct*35 + rand(-8,8)), 5, 95);
  }

  let analystComment = "アナリストのカバレッジがありません。";
  if(st){
    const rating = analystRatingLabel(st);
    if(rating){
      const fc = computeForecast(st);
      analystComment = `現時点の分析では${st.name}への見方は「${rating.label}」(上昇確率${Math.round(fc.prob*100)}%の見立て)。${n.type==='good'?'追い風材料として好感される可能性がある。':(n.type==='event'?'逆風材料として警戒感が強まる可能性がある。':'材料としては中立的とみられる。')}`;
    } else {
      analystComment = "アナリストを採用するか調査部を設立すると、コメントの精度が高まります。";
    }
  }

  return { meta, body, impactText, changeRangeText, stopProb, analystComment, st };
}

/* ==========================================================================
   4. マーケットエンジン(日経平均・相場サイクル)
   ========================================================================== */
function pickNextRegime(current){
  const options = REGIME_TRANSITIONS[current];
  let r = Math.random();
  for(const [key,w] of options){ if(r<w) return key; r-=w; }
  return options[0][0];
}
function rotateRegime(){
  const next = pickNextRegime(state.marketRegime);
  const [lo,hi] = REGIME_DURATION[next];
  state.marketRegime = next;
  state.regimeDaysLeft = randInt(lo,hi);
  pushNews(`相場の局面が「${REGIME_LABELS[next]}」に転換した。`, {stars:4, kind:"confirmed", category:"macro", type: (next==="bull"||next==="bubble")?"good":(next==="crash"?"event":"flavor")});
}
function updateMacroAndNikkei(){
  const m = state.macro;
  m.economy   = clamp(m.economy + rand(-1.0,1.0), 0, 100);
  m.rate      = clamp(m.rate + rand(-0.05,0.05), 0, 10);
  m.inflation = clamp(m.inflation + rand(-0.12,0.12), -2, 12);
  m.overseas  = clamp(m.overseas*0.9 + rand(-3,3), -100, 100);
  m.fx        = clamp((m.fx||0)*0.92 + rand(-2.5,2.5), -100, 100); // 為替(プラス=円安方向)
  m.sentiment = clamp(m.sentiment*0.95 + rand(-3,3) + (m.economy-55)*0.12 + m.overseas*0.05, -100, 100);

  state.regimeDaysLeft -= 1;
  if(state.regimeDaysLeft<=0) rotateRegime();

  // 市場アナリスト在籍時: 過熱局面(上昇・バブル相場)の終盤に反落・調整への警戒を通知する
  if(bestMarketAnalystLevel()>0 && (state.marketRegime==="bull"||state.marketRegime==="bubble") && state.regimeDaysLeft<=6 && Math.random()<0.3){
    pushNews("【市場アナリストの警告】相場の過熱感が高まっている。反落や調整局面への警戒が必要かもしれない。", {stars:3, kind:"confirmed", category:"macro", type:"event"});
  }

  // 日経平均の基準値は、日本経済の長期成長を反映してごくゆるやかに上昇する(年率+1.5%程度)
  if(!state.nikkeiBaseline) state.nikkeiBaseline = 65000;
  state.nikkeiBaseline *= 1.00004;

  const meanReversion = (state.nikkeiBaseline - state.nikkei)/state.nikkeiBaseline;
  const belowPressure = state.nikkei < state.nikkeiBaseline*0.80 ? 0.012 : 0;  // 下振れが大きい時の押し目買い
  const aboveEasing   = state.nikkei > state.nikkeiBaseline*1.20 ? -0.006 : 0; // 上振れが大きい時の緩やかな利益確定(強い上限ではない)
  const regimeDrift = REGIME_DRIFT[state.marketRegime];
  const macroFactor = (m.sentiment/100)*0.001 + (m.economy-55)/100*0.0008 - (m.rate-1)/10*0.0006 - (m.inflation-1.5)/10*0.0004 + (m.overseas/100)*0.0008 + (m.fx/100)*0.0004;
  const noise = (Math.random()+Math.random()-1)*0.006;
  const pct = meanReversion*0.015 + belowPressure + aboveEasing + regimeDrift + macroFactor + noise;

  // 日経平均もOHLC(始値・高値・安値・終値)のローソク足として記録する
  const nikkeiOpen = state.nikkei;
  const nikkeiClose = clamp(nikkeiOpen*(1+pct), 20000, 500000);
  const nikkeiBody = Math.abs(nikkeiClose-nikkeiOpen);
  const nikkeiWick = nikkeiOpen*0.004*rand(0.3,1.2) + nikkeiBody*rand(0.2,0.6);
  const nikkeiHigh = Math.max(nikkeiOpen,nikkeiClose) + nikkeiWick*Math.random();
  const nikkeiLow = Math.max(1, Math.min(nikkeiOpen,nikkeiClose) - nikkeiWick*Math.random());
  state.nikkei = nikkeiClose;
  state.nikkeiHistory.push({o:nikkeiOpen, h:nikkeiHigh, l:nikkeiLow, c:nikkeiClose, day:state.day+1});
  if(state.nikkeiHistory.length>760) state.nikkeiHistory.shift(); // 月足・週足の生成に十分な期間を保持する

  const nasdaqPct = regimeDrift*0.7 + (m.overseas/100)*0.002 + (Math.random()+Math.random()-1)*0.007;
  state.nasdaq = clamp(state.nasdaq*(1+nasdaqPct), 5000, 100000);
  state.nasdaqHistory.push(state.nasdaq);
  if(state.nasdaqHistory.length>120) state.nasdaqHistory.shift();

  return pct; // 本日の日経平均騰落率(株価エンジンで使用)
}
function spawnMacroNews(){

/* ==========================================================================
   6. テクニカル分析モジュール
   ========================================================================== */
function ema(values, period){
  const k = 2/(period+1);
  let out = [values[0]];
  for(let i=1;i<values.length;i++) out.push(values[i]*k + out[i-1]*(1-k));
  return out;
}
function computeSMA(closes, period){ if(closes.length<period) return null; return avg(closes.slice(-period)); }
function computeBollinger(closes, period=20, mult=2){
  if(closes.length<period) return null;
  const slice = closes.slice(-period);
  const m = avg(slice);
  const variance = avg(slice.map(v=>(v-m)*(v-m)));
  const sd = Math.sqrt(variance);
  return {mid:m, upper:m+mult*sd, lower:m-mult*sd};
}
function computeRSI(closes, period=14){
  if(closes.length<period+1) return null;
  const slice = closes.slice(-(period+1));
  let gains=0, losses=0;
  for(let i=1;i<slice.length;i++){ const d=slice[i]-slice[i-1]; if(d>=0) gains+=d; else losses-=d; }
  const avgGain=gains/period, avgLoss=losses/period;
  if(avgLoss===0) return 100;
  const rs = avgGain/avgLoss;
  return 100 - (100/(1+rs));
}
function computeMACD(closes, fast=12, slow=26, signal=9){
  if(closes.length<slow+signal) return null;
  const emaFast = ema(closes, fast);
  const emaSlow = ema(closes, slow);
  const macdLine = closes.map((_,i)=>emaFast[i]-emaSlow[i]);
  const signalLine = ema(macdLine.slice(-Math.max(signal*3,slow)), signal);
  const macd = macdLine[macdLine.length-1];
  const sig = signalLine[signalLine.length-1];
  return {macd, signal:sig, histogram: macd-sig};
}
function computeVWAP(candles, period=20){
  const slice = candles.slice(-period);
  if(!slice.length) return null;
  let pv=0, v=0;
  slice.forEach(c=>{ const typical=(c.h+c.l+c.c)/3; pv += typical*(c.v||1); v += (c.v||1); });
  return v>0 ? pv/v : null;
}
function computeVolumeProfile(candles, period=30, bins=10){
  const slice = candles.slice(-period);
  if(!slice.length) return [];
  const min = Math.min(...slice.map(c=>c.l));
  const max = Math.max(...slice.map(c=>c.h));
  const range = (max-min)||1;
  const buckets = Array.from({length:bins}, (_,i)=>({ lo:min+range*i/bins, hi:min+range*(i+1)/bins, vol:0 }));
  slice.forEach(c=>{
    let idx = Math.floor(((c.c-min)/range)*bins);
    idx = clamp(idx,0,bins-1);
    buckets[idx].vol += (c.v||0);
  });
  return buckets;
}
function detectDoubleBottom(history){
  const data = history.slice(-20);
  if(data.length<10) return false;
  const lows = data.map(c=>c.l);
  let m1i=0; for(let i=1;i<lows.length;i++) if(lows[i]<lows[m1i]) m1i=i;
  let m2i=-1;
  for(let i=0;i<lows.length;i++){ if(Math.abs(i-m1i)>=4 && Math.abs(lows[i]-lows[m1i])/lows[m1i]<0.045){ if(m2i===-1||Math.abs(lows[i]-lows[m1i])<Math.abs(lows[m2i]-lows[m1i])) m2i=i; } }
  if(m2i===-1) return false;
  const lo=Math.min(m1i,m2i), hi=Math.max(m1i,m2i);
  const peak = Math.max(...data.slice(lo,hi+1).map(c=>c.h));
  const riseOk = (peak-lows[m1i])/lows[m1i] > 0.035;
  return riseOk && data[data.length-1].c > peak*0.97;
}
function detectDoubleTop(history){
  const data = history.slice(-20);
  if(data.length<10) return false;
  const highs = data.map(c=>c.h);
  let m1i=0; for(let i=1;i<highs.length;i++) if(highs[i]>highs[m1i]) m1i=i;
  let m2i=-1;
  for(let i=0;i<highs.length;i++){ if(Math.abs(i-m1i)>=4 && Math.abs(highs[i]-highs[m1i])/highs[m1i]<0.045){ if(m2i===-1||Math.abs(highs[i]-highs[m1i])<Math.abs(highs[m2i]-highs[m1i])) m2i=i; } }
  if(m2i===-1) return false;
  const lo=Math.min(m1i,m2i), hi=Math.max(m1i,m2i);
  const trough = Math.min(...data.slice(lo,hi+1).map(c=>c.l));
  const dropOk = (highs[m1i]-trough)/highs[m1i] > 0.035;
  return dropOk && data[data.length-1].c < trough*1.03;
}
function detectTriangle(history){
  const data = history.slice(-16);
  if(data.length<16) return false;
  const firstHalf = data.slice(0,8), secondHalf = data.slice(8);
  const rangeOf = (arr)=> avg(arr.map(c=>c.h-c.l));
  const r1 = rangeOf(firstHalf), r2 = rangeOf(secondHalf);
  const highsTrend = secondHalf[secondHalf.length-1].h - firstHalf[0].h;
  const lowsTrend = secondHalf[secondHalf.length-1].l - firstHalf[0].l;
  return r2 < r1*0.72 && highsTrend<=0 && lowsTrend>=0;
}

// 日足ベースの値動き調整: 支持線・抵抗線での反発/反落、ブレイクアウト、押し目買い・利確売り
// 企業価値(EPS×PER)に基づく「理論株価」。株価はこの水準へゆるやかに収束しようとする力を受ける。
// これにより、業績を伴わない指数関数的な株価上昇(異常インフレ)を防ぐ。
function fairValuePrice(st){
  const eps = st.profit / st.shares;
  const growthPremium = clamp(st.growth/100, -0.15, 0.65); // 成長率が高いほど許容PERが上がる
  const qualityPremium = (st.quality-0.5)*0.6;
  const themePremium = isThemeMatch(st) ? 0.15 : 0;
  const basePER = 16;
  const per = clamp(basePER * (1+growthPremium+qualityPremium+themePremium), 4, 55);
  return Math.max(10, eps*per);
}
// 理論株価からの乖離を是正する力(バブル的な割高はより強く是正し、割安は緩やかに見直す)
function applyFundamentalReversion(st, dayOpen, changePct){
  const fv = fairValuePrice(st);
  const gapPct = (fv - dayOpen)/dayOpen; // 正=割安、負=割高
  let reversionPull;
  if(gapPct < 0) reversionPull = clamp(gapPct*0.05, -0.18, 0);
  else reversionPull = clamp(gapPct*0.018, 0, 0.05);
  return changePct + reversionPull;
}
// 定期的な調整局面(過熱後の利益確定売り)。軽い/通常/大幅/暴落をランダムに発生させる
function checkStockCorrection(st){
  const hist = st.history;
  if(hist.length<20) return 0;
  const past = hist.slice(-20);
  const retn = past[past.length-1].c/past[0].c - 1;
  if(retn <= 0.30) return 0; // 過熱していなければ調整は起きない
  if(Math.random() >= 0.05) return 0; // 過熱時でも毎日は起きない(低確率)
  const r = Math.random();
  let mag;
  if(r<0.45) mag = rand(0.05,0.15);       // 軽い調整
  else if(r<0.80) mag = rand(0.15,0.30);  // 通常の調整
  else if(r<0.96) mag = rand(0.30,0.50);  // 大幅調整
  else mag = rand(0.50,0.70);             // 暴落
  return -mag;
}

function applySupportResistance(st, dayOpen, changePct){
  const hist = st.history;
  if(hist.length<15) return changePct;
  const lookback = hist.slice(-25);
  const support = Math.min(...lookback.map(c=>c.l));
  const resistance = Math.max(...lookback.map(c=>c.h));
  const range = Math.max(resistance-support, dayOpen*0.01);
  const nearSupport = (dayOpen-support)/range < 0.08;
  const nearResistance = (resistance-dayOpen)/range < 0.08;
  const roll = mulberry32(hashStr(st.id+"_sr_"+state.day))();

  if(nearSupport && changePct<0){
    changePct *= (roll<0.62) ? 0.35 : 1.25; // 反発 or ブレイクアウトで下落加速
  }
  if(nearResistance && changePct>0){
    changePct *= (roll<0.62) ? 0.35 : 1.25; // 反落 or ブレイクアウトで上昇加速
  }

  const closes = hist.map(c=>c.c);
  if(closes.length>=20){
    const sma20 = avg(closes.slice(-20));
    const deviation = (dayOpen-sma20)/sma20;
    if(deviation>0.12 && changePct>0) changePct *= 0.7;   // 上がりすぎ→利確売り圧力
    if(deviation<-0.12 && changePct<0) changePct *= 0.7;  // 下がりすぎ→押し目買い圧力
  }
  return changePct;
}

function detectTechnicalSignals(st){
  const out=[];
  const closes = st.history.map(c=>c.c);
  if(closes.length>=20){
    const sma5=avg(closes.slice(-5)), sma20=avg(closes.slice(-20));
    const diff=sma5-sma20;
    if(st.smaPrevDiff!=null){
      if(st.smaPrevDiff<=0 && diff>0){ st.crossLog.push({day:state.day,type:"golden"}); out.push({text:`ゴールデンクロス発生:${st.name}(短期線が長期線を上抜け)`, opts:{stars:4,kind:"confirmed",category:"technical",stockId:st.id,type:"good"}}); }
      else if(st.smaPrevDiff>=0 && diff<0){ st.crossLog.push({day:state.day,type:"dead"}); out.push({text:`デッドクロス発生:${st.name}(短期線が長期線を下抜け)`, opts:{stars:4,kind:"confirmed",category:"technical",stockId:st.id,type:"event"}}); }
    }
    st.smaPrevDiff = diff;
    if(st.crossLog.length>20) st.crossLog.shift();
  }
  const vols = st.history.map(c=>c.v);
  if(vols.length>=6 && state.departments.info.level>=1){
    const base = avg(vols.slice(-6,-1));
    const todayVol = vols[vols.length-1];
    const spike = todayVol > base*1.8;
    st.history[st.history.length-1].volumeSpike = spike;
    const chgPct = Math.abs((st.price/st.prevPrice-1)*100);
    if(spike && chgPct>2.5) out.push({text:`出来高急増:${st.name}(平均比+${Math.round((todayVol/base-1)*100)}%)`, opts:{stars:3,kind:"confirmed",category:"technical",stockId:st.id,type:"flavor"}});
  }
  return out;
}

/* ==========================================================================
   9. 予測/期待値・アナリストレポート
   ========================================================================== */
function computeForecast(st){
  const seed = hashStr(st.id+"_"+state.day);
  const rng = mulberry32(seed);
  let score = 0;
  if(isThemeMatch(st)) score += (state.theme.flowPct/100)*1.1;
  score += (st.growth-8)/8*0.55;
  if(st.smaPrevDiff!=null) score += st.smaPrevDiff>0 ? 0.35 : -0.2;
  if(st.daysUntilEarnings<=3) score += (st.quality-0.5)*1.4;
  score += (state.macro.sentiment/100)*0.45;
  score += st.pendingMomentumPct*3;
  const rumor = state.pendingRumors.find(r=>r.stockId===st.id);
  if(rumor) score += (rumor.direction==="up"?0.3:-0.3);

  let trueProb = 1/(1+Math.exp(-score));
  trueProb = clamp(0.5 + (trueProb-0.5)*0.9, 0.1, 0.9);

  const noiseAmp = clamp(0.22 - bestAnalystLevel()*0.015 - state.ai.level*0.01 - state.departments.research.level*0.02 - themeAnalystBonus(st) + themeSpecializationModifier(st), 0.03, 0.24);
  const noise = (rng()-0.5)*2*noiseAmp;
  const displayProb = clamp(trueProb+noise, 0.05, 0.95);

  const bigUpPct = Math.round(15+st.volatility*3);
  const smallUpPct = Math.round(6+st.volatility*1.5);
  const smallDownPct = Math.round(5+st.volatility*1.2);
  const bigDownPct = Math.round(12+st.volatility*2.5);
  const up = Math.round(displayProb*100);
  const down = 100-up;
  const scenarios = [
    {label:`+${bigUpPct}%`, w:Math.round(up*0.42)},
    {label:`+${smallUpPct}%`, w:Math.round(up*0.58)},
    {label:`-${smallDownPct}%`, w:Math.round(down*0.55)},
    {label:`-${bigDownPct}%`, w:Math.round(down*0.45)},
  ];
  return {prob:displayProb, scenarios};
}
function aiRecommendations(n=3){ return [...state.stocks].map(st=>({st, fc:computeForecast(st)})).sort((a,b)=>b.fc.prob-a.fc.prob).slice(0,n); }
function generateAnalystReports(){
  const level = effectiveAnalystLevel();
  if(level<=0) return {locked:true};
  const rng = mulberry32(hashStr("report_"+state.day));
  const reports = [];
  const tag = state.theme.tags[0];
  const label = TAG_LABELS[tag]||tag;
  const t1 = [`${label}関連に資金が流入しています。`, `${label}セクターへの市場の関心が高まっています。`, `${label}関連銘柄の出来高が増加傾向にあります。`];
  reports.push({tier:1, text:t1[Math.floor(rng()*t1.length)]});
  if(level>=5){
    const lo=15+Math.floor(rng()*10), hi=lo+5+Math.floor(rng()*8), days=2+Math.floor(rng()*4);
    reports.push({tier:2, text:`${days}日以内に${label}セクターが${lo}〜${hi}%上昇する可能性があります。`});
  }
  if(level>=10){
    const top = aiRecommendations(1)[0];
    reports.push({tier:3, text:`${top.st.name}が最も有望です(上昇確率${Math.round(top.fc.prob*100)}%)。`});
  }
  return {locked:false, level, reports};
}
// 企業分類タグ(大型/中型/小型・グロース・バリュー・高配当・テーマ・新興)
function classifyStock(st){
  const tags = [];
  const marketCap = st.price*st.shares;
  if(marketCap>500e8) tags.push("大型株");
  else if(marketCap>100e8) tags.push("中型株");
  else tags.push("小型株");
  if(st.growth>=15) tags.push("グロース株");
  const per = st.price/(st.profit/st.shares);
  if(per>0 && per<12 && st.quality>=0.5) tags.push("バリュー株");
  const divYield = (st.profit*0.3/st.shares)/st.price*100;
  if(divYield>=3.5) tags.push("高配当株");
  if(isThemeMatch(st)) tags.push("テーマ株");
  if(state.day-(st.listedDay||1)<200) tags.push("新興企業");
  return tags;
}
function analystRatingLabel(st){
  if(state.departments.research.level<1 && bestAnalystLevel()<1) return null;
  const fc = computeForecast(st);
  if(fc.prob>=0.62) return {label:"強気", cls:"gain"};
  if(fc.prob<=0.42) return {label:"弱気", cls:"loss"};
  return {label:"中立", cls:"neutral"};
}
function getAnalystDistribution(st){
  const rng = mulberry32(hashStr(st.id+"_analysts_"+Math.floor(state.day/7)));
  const fc = computeForecast(st);
  const total = 5+Math.floor(rng()*6); // 5〜10人のカバレッジ想定
  const bullShare = clamp(fc.prob + (rng()-0.5)*0.15, 0.05, 0.95);
  const bull = Math.round(total*bullShare);
  const bear = Math.round(total*(1-bullShare)*0.5);
  const neutral = Math.max(0, total-bull-bear);
  return {total, bull, neutral, bear};
}

// 市場区分(実在の東証区分とは異なる、ゲーム独自の名称・コード体系)
const SEGMENT_DEFS = [
  {key:"premium",  label:"プレミアム市場",   prefix:"P"},
  {key:"standard", label:"スタンダード市場", prefix:"S"},
  {key:"growth",   label:"グロース市場",     prefix:"G"},
  {key:"frontier", label:"フロンティア市場", prefix:"F"},
];
function getCompanyProfile(st){
  const rng = mulberry32(hashStr(st.id+"_profile"));
  let segDef;
  if(st.quality>0.60) segDef = SEGMENT_DEFS[0];
  else if(st.quality>0.45) segDef = SEGMENT_DEFS[1];

  const avgAge = 33 + Math.floor(rng()*10);
  const avgSalary = 420 + Math.floor(rng()*550); // 万円
  const ceo = seededPick(SURNAMES, rng) + seededPick(GIVEN, rng);
  return {code, segment:segDef.label, hq, founded, employees, avgAge, avgSalary, ceo};
