/* ---------- キャンバスチャート ---------- */
function drawLineChart(canvas, data, color){
  if(!canvas || data.length<2) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max-min)||1;
  const pad=4;
  const step=(w-pad*2)/(data.length-1);
  drawGridLines(ctx,w,h,pad);
  ctx.beginPath();
  data.forEach((v,i)=>{ const x=pad+i*step; const y=h-pad-((v-min)/range)*(h-pad*2); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,color+"40"); grad.addColorStop(1,color+"00");
  ctx.lineTo(w-pad,h); ctx.lineTo(pad,h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  data.forEach((v,i)=>{ const x=pad+i*step; const y=h-pad-((v-min)/range)*(h-pad*2); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.stroke();
}
// 日足のOHLCデータを週足・月足へ正しく集計する(単純な折れ線変換ではない)
// 週足=直近5営業日分、月足=直近21営業日分を1本の実際の高値/安値/始値/終値に集計する
function resampleCandles(dailyCandles, unit){
  const out = [];
  for(let i=0;i<dailyCandles.length;i+=unit){
    const chunk = dailyCandles.slice(i, i+unit);
    if(!chunk.length) continue;
    out.push({
      o: chunk[0].o,
      c: chunk[chunk.length-1].c,
      h: Math.max(...chunk.map(c=>c.h)),
      l: Math.min(...chunk.map(c=>c.l)),
      day: chunk[chunk.length-1].day,
    });
  }
  return out;
}
// 直近の値幅から支持線・抵抗線の目安を算出する
function computeSupportResistance(candles, lookback=25){
  const recent = candles.slice(-lookback);
  if(!recent.length) return {support:null, resistance:null};
  return { support: Math.min(...recent.map(c=>c.l)), resistance: Math.max(...recent.map(c=>c.h)) };
}
function drawGridLines(ctx,w,h,pad,lines=3){
  ctx.save(); ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
  for(let i=0;i<=lines;i++){ const y=pad+((h-pad*2)/lines)*i; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
  ctx.restore();
}
// シンプルな棒グラフ(四季報の3年推移などに使用)
function drawBarChart(canvas, values, labels, color){
  if(!canvas || !values.length) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const padTop=6, padBottom=16, padSide=8;
  const max = Math.max(...values, 1);
  const plotH = h-padTop-padBottom;
  const colW = (w-padSide*2)/values.length;
  const barW = colW*0.5;
  drawGridLines(ctx, w, h-padBottom, padTop, 2);
  ctx.font = "9px " + getComputedStyle(document.body).getPropertyValue('--font');
  values.forEach((v,i)=>{
    const cx = padSide+colW*i+colW/2;
    const barH = Math.max(2, (v/max)*plotH);
    ctx.fillStyle = color;
    ctx.fillRect(cx-barW/2, h-padBottom-barH, barW, barH);
    if(labels && labels[i]){
      ctx.fillStyle = "rgba(217,226,234,0.55)";
      ctx.textAlign = "center";
      ctx.fillText(labels[i], cx, h-4);
    }
  });
}
function drawCandlestickChart(canvas, candles, options={}){
  if(!canvas || !candles || candles.length<1) return;
  const upColor = options.upColor || "#FF3B5C"; // 日本式:上昇(陽線)は赤
  const downColor = options.downColor || "#00FF9C"; // 日本式:下降(陰線)は緑
  const showLabels = options.labels!==false;
  const showVolume = !!options.showVolume;
  const showSMA = !!options.showSMA;
  const showBB = !!options.showBB;
  const crossLog = options.crossLog || [];
  const maxCandles = options.maxCandles || 34;
  const data = candles.slice(-maxCandles);

  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const padTop = showLabels ? 16 : 4;
  const volH = showVolume ? Math.round(h*0.18) : 0;
  const padBottom = (showLabels?14:4) + volH;
  const padSide = 4;
  const min = Math.min(...data.map(c=>c.l));
  const max = Math.max(...data.map(c=>c.h));
  const range = (max-min)||1;
  const plotH = h-padTop-padBottom;
  const colW = (w-padSide*2)/data.length;
  const bodyW = Math.max(2, colW*0.56);

  drawGridLines(ctx, w, h-padBottom, padTop, 3);
  const toY = (v)=> padTop + plotH - ((v-min)/range)*plotH;

  if(options.supportLevel!=null || options.resistanceLevel!=null){
    ctx.save(); ctx.setLineDash([4,3]); ctx.lineWidth=1;
    if(options.supportLevel!=null){
      ctx.strokeStyle = "#00FF9C"; const y=toY(options.supportLevel);
      ctx.beginPath(); ctx.moveTo(padSide,y); ctx.lineTo(w-padSide,y); ctx.stroke();
    }
    if(options.resistanceLevel!=null){
      ctx.strokeStyle = "#FF3B5C"; const y=toY(options.resistanceLevel);
      ctx.beginPath(); ctx.moveTo(padSide,y); ctx.lineTo(w-padSide,y); ctx.stroke();
    }
    ctx.restore();
  }

  if(showBB){
    const closes = candles.map(c=>c.c);
    const startIdx = candles.length-data.length;
    ctx.save(); ctx.globalAlpha=0.12; ctx.fillStyle="#00E5FF";
    ctx.beginPath();
    let started=false;
    data.forEach((c,i)=>{ const bb=computeBollinger(closes.slice(0,startIdx+i+1)); if(!bb) return; const x=padSide+colW*i+colW/2; const y=toY(bb.upper); if(!started){ctx.moveTo(x,y); started=true;} else ctx.lineTo(x,y); });
    for(let i=data.length-1;i>=0;i--){ const bb=computeBollinger(closes.slice(0,startIdx+i+1)); if(!bb) continue; const x=padSide+colW*i+colW/2; const y=toY(bb.lower); ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  if(showVolume){
    const maxVol = Math.max(...data.map(c=>c.v||0),1);
    data.forEach((c,i)=>{
      const cx = padSide+colW*i+colW/2;
      const up = c.c>=c.o;
      const barH = ((c.v||0)/maxVol)*(volH-6);
      ctx.fillStyle = (up?upColor:downColor)+"55";
      ctx.fillRect(cx-bodyW/2, h-barH-2, bodyW, barH);
    });
  }

  data.forEach((c,i)=>{
    const cx = padSide+colW*i+colW/2;
    const up = c.c>=c.o;
    let color = up?upColor:downColor;
    if(c.stopHigh) color = "#FF3B5C";
    if(c.stopLow) color = "#67768A";
    ctx.strokeStyle=color; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,toY(c.h)); ctx.lineTo(cx,toY(c.l)); ctx.stroke();
    const yO=toY(c.o), yC=toY(c.c);
    const bodyTop=Math.min(yO,yC);
    const bodyH=Math.max(1.4, Math.abs(yO-yC));
    ctx.fillStyle=color;
    ctx.fillRect(cx-bodyW/2, bodyTop, bodyW, bodyH);
  });

  if(showSMA){
    const closes = candles.map(c=>c.c);
    const sma5all=[], sma20all=[];
    for(let i=0;i<closes.length;i++){ sma5all.push(i>=4?avg(closes.slice(i-4,i+1)):null); sma20all.push(i>=19?avg(closes.slice(i-19,i+1)):null); }
    const startIdx = candles.length-data.length;
    const drawSMA = (arr,color)=>{
      ctx.beginPath(); let started=false;
      data.forEach((c,i)=>{ const v=arr[startIdx+i]; if(v==null) return; const x=padSide+colW*i+colW/2; const y=toY(v); if(!started){ctx.moveTo(x,y); started=true;} else ctx.lineTo(x,y); });
      ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.stroke();
    };
    drawSMA(sma5all, "#00E5FF"); drawSMA(sma20all, "#FFB300");
    crossLog.forEach(cr=>{
      const idx = data.findIndex(c=>c.day===cr.day);
      if(idx<0) return;
      const x = padSide+colW*idx+colW/2;
      const y = cr.type==="golden" ? toY(min)+2 : toY(max)-2;
      ctx.fillStyle = cr.type==="golden" ? upColor : downColor;
      ctx.beginPath();
      if(cr.type==="golden"){ ctx.moveTo(x-4,y+6); ctx.lineTo(x+4,y+6); ctx.lineTo(x,y-2); } else { ctx.moveTo(x-4,y-6); ctx.lineTo(x+4,y-6); ctx.lineTo(x,y+2); }
      ctx.closePath(); ctx.fill();
    });
  }

  if(showLabels){
    ctx.font = "10px " + getComputedStyle(document.body).getPropertyValue('--font');
    ctx.fillStyle = "rgba(217,226,234,0.55)";
    ctx.textBaseline = "bottom";
    ctx.fillText("¥"+fmtNum(max), padSide, padTop-4);
    ctx.textAlign="right"; ctx.textBaseline="top";
    ctx.fillText("¥"+fmtNum(min), w-padSide, h-padBottom+1);
    ctx.textAlign="left";
  }
}

// 日経平均の現在値・前日比・騰落率を表示する(最小限の情報のみ)
function renderNikkeiPriceHeader(){
  const hist = state.nikkeiHistory;
  const latest = hist[hist.length-1];
  const prev = hist[hist.length-2];
  if(!latest) return;
  const priceEl = document.getElementById('nikkei-price');
  const changeEl = document.getElementById('nikkei-change');
  if(priceEl) priceEl.textContent = fmtNum(latest.c,0)+"円";
  if(changeEl && prev){
    const changeAbs = latest.c-prev.c;
    const changePct = (latest.c/prev.c-1)*100;
    changeEl.style.color = changeAbs>=0 ? "var(--green)" : "var(--red)";
    changeEl.textContent = `${changeAbs>=0?'+':''}${fmtNum(Math.round(changeAbs),0)}円(${fmtPct(changePct)})`;
  }
}
// 選択中の時間軸(月足/週足/日足)で日経平均のローソク足チャートを描画する
function drawNikkeiChart(){
  const canvas = document.getElementById('nikkei-chart');
  if(!canvas) return;
  let candles;
  if(nikkeiTimeframe==="1mo") candles = resampleCandles(state.nikkeiHistory, 21);
  else if(nikkeiTimeframe==="1wk") candles = resampleCandles(state.nikkeiHistory, 5);
  else candles = state.nikkeiHistory;
  const sr = computeSupportResistance(candles, 25);
  drawCandlestickChart(canvas, candles, {labels:true, maxCandles:34, showVolume:false, showSMA:false, supportLevel:sr.support, resistanceLevel:sr.resistance});
}

    wrap.querySelectorAll('[data-venture]').forEach(elm=>{ elm.style.cursor='pointer'; elm.onclick=()=>openVentureModal(elm.dataset.venture); });
    wrap.querySelectorAll('[data-launch-fund]').forEach(elm=>{ elm.style.cursor='pointer'; elm.onclick=()=>{ const r=launchThemeFund(elm.dataset.launchFund); toast(r.msg); render(); }; });
    const pb=document.getElementById('btn-open-profile'); if(pb) pb.onclick=openProfileModal;
    const rb=document.getElementById('btn-open-rankings'); if(rb) rb.onclick=openRankingsModal;
  },0);

  return wrap;
}


/* ---------- スポーツタブ ---------- */
let sportsSubTab = "all"; // all | baseball | soccer | basketball | esports | ranking
function getAllPlayerTeams(){
  const teams = [];
  state.ventures.forEach(v=>{
    if(v.stage!=="private" && v.stage!=="listed") return;
    (v.sportsTeams||[]).filter(t=>t.status==="active").forEach(t=> teams.push(Object.assign(t, {ventureId:v.id, ventureName:v.name})));
  });
  return teams;
}
function computeTeamValue(team){
  const strength = computeTeamStrength(team);
  const rosterValue = (team.roster||[]).reduce((s,p)=>s+p.marketValue,0);
  const revenueMultiple = (team.revenue||0)*3;
  const profitMultiple = Math.max(0,(team.profit||0))*8;
  const fanValue = team.fanbase*1e8;
  const facilityValue = ((team.facilities.stadium||0)+(team.facilities.training||0)+(team.facilities.youth||0))*2e8;
  return Math.round(rosterValue*0.3 + revenueMultiple + profitMultiple + fanValue + facilityValue + strength*1e8);
}
function getManageableVentures(){ return state.ventures.filter(v=>v.stage==="private"||v.stage==="listed"); }
function renderSportsTab(){
  const wrap = document.createElement('div');
  const teams = getAllPlayerTeams();

  const totalProfit = teams.reduce((s,t)=>s+(t.profit||0),0);
  const totalFans = teams.reduce((s,t)=>s+t.fanbase,0);
  const totalSponsor = teams.reduce((s,t)=>s+(t.sponsors||[]).reduce((a,b)=>a+b.amount,0),0);
  const prevTotalRevenue = teams.reduce((s,t)=>s+(t.prevSeasonRevenue||0),0);
  const growthPct = prevTotalRevenue>0 ? (totalRevenue/prevTotalRevenue-1)*100 : null;

  wrap.appendChild(el(`
    <div class="sec">
      <div class="sec-head"><h2>スポーツ事業ダッシュボード</h2>${growthPct!==null?`<span class="sub ${growthPct>=0?'gain':'loss'}">${fmtPct(growthPct)}</span>`:''}</div>
      <div class="grid-2">
        <div class="stat-box"><div class="l">スポーツ事業価値</div><div class="v">${fmtYen(totalValue)}</div></div>
        <div class="stat-box"><div class="l">年間売上</div><div class="v">${fmtYen(totalRevenue)}</div></div>
        <div class="stat-box"><div class="l">年間利益</div><div class="v ${totalProfit>=0?'gain':'loss'}">${totalProfit>=0?'+':''}${fmtYen(totalProfit)}</div></div>
        <div class="stat-box"><div class="l">ファン総数(万人)</div><div class="v">${totalFans.toFixed(0)}</div></div>
        <div class="stat-box"><div class="l">保有チーム</div><div class="v">${teams.length}チーム</div></div>
        <div class="stat-box"><div class="l">スポンサー収入</div><div class="v">${fmtYen(totalSponsor)}</div></div>
      </div>
    </div>
  `));
  const subtabRow = el(`
    <div class="subtab-row">
      <button class="subtab-btn ${sportsSubTab==='all'?'active':''}" data-sports-sub="all">全体</button>
      <button class="subtab-btn ${sportsSubTab==='baseball'?'active':''}" data-sports-sub="baseball">野球</button>

      <button class="subtab-btn ${sportsSubTab==='basketball'?'active':''}" data-sports-sub="basketball">バスケ</button>
      <button class="subtab-btn ${sportsSubTab==='esports'?'active':''}" data-sports-sub="esports">eスポーツ</button>

  `);

  body.id = 'sports-subbody';
  wrap.appendChild(body);

  if(sportsSubTab==="ranking"){
    const ranking = computeSportsEmpireRanking();
    body.innerHTML = `
      <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>世界スポーツ企業ランキング</h2></div>
      ${ranking.slice(0,20).map((r,i)=>`
        <div class="row" style="cursor:default;">
          <div class="row-left"><div class="nm">${i+1}位 ${r.name}${r.isPlayer?' <span class="badge gain">自社</span>':''}</div><div class="sub">保有${r.teams}チーム ・ ファン${r.fans}万人</div></div>
          <div class="row-right"><div class="px">${fmtYen(r.revenue)}</div></div>
        </div>
      `).join("")}
    `;
  } else {
    const filtered = sportsSubTab==="all" ? teams : teams.filter(t=>t.sport===sportsSubTab);
    const grouped = {};
    filtered.forEach(t=>{ (grouped[t.sport]=grouped[t.sport]||[]).push(t); });

    Object.entries(grouped).forEach(([sport, list])=>{
      html += `<div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>${SPORT_TYPES[sport].emoji||''} ${SPORT_TYPES[sport].label}</h2></div>`;
      list.forEach(team=>{
        const strength = computeTeamStrength(team);
        const titleLabel = team.esportsTitle ? (state.esportsTitles.find(t=>t.key===team.esportsTitle)||{}).label : null;
        html += `
          <div class="row" data-open-team="${team.ventureId}:${team.id}" style="cursor:pointer; flex-direction:column; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <div class="nm" style="font-size:12.5px; font-weight:800;">${team.name}${titleLabel?` <span class="badge info">${titleLabel}</span>`:''}</div>
              <span style="font-size:10px; color:var(--muted);">${team.ventureName}</span>
            </div>
            <div class="sub" style="margin-top:2px;">総合力${strength.toFixed(0)} ・ 順位${team.standing||'-'} ・ ファン${team.fanbase.toFixed(0)}万人</div>
            <div class="sub">年間利益 <span style="color:${(team.profit||0)>=0?'var(--green)':'var(--red)'};">${(team.profit||0)>=0?'+':''}${fmtYen(team.profit||0)}</span> ・ チーム価値 ${fmtYen(computeTeamValue(team))}</div>
          </div>
        `;
      });
    });
    if(!filtered.length) html += `<div class="empty-state">${sportsSubTab==='all'?'まだチームを保有していません':`まだ${SPORT_TYPES[sportsSubTab].label}に参入していません`}</div>`;

    const manageable = getManageableVentures();
    html += `
      <div style="height:14px;"></div>
      <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>新規チーム設立・買収</h2></div>
      <div class="sec-body" style="padding:10px 0;">
        ${!manageable.length ? `<div class="empty-state">先に会社を創業・買収してください</div>` : `

          ${Object.entries(SPORT_TYPES).map(([k,d])=>`<option value="${k}">${d.label}(設立目安${fmtYen(d.foundCost)} / 買収目安${fmtYen((d.acquireRange[0]+d.acquireRange[1])/2)})</option>`).join("")}

        </div>
        `}

  setTimeout(()=>{
    document.querySelectorAll('[data-sports-sub]').forEach(b=>{ b.onclick=()=>{ sportsSubTab=b.dataset.sportsSub; render(); }; });
    document.querySelectorAll('[data-open-team]').forEach(elm=>{
      elm.onclick = ()=>{ const [ventureId,teamId]=elm.dataset.openTeam.split(":"); openTeamDetailModal(ventureId, teamId); };
    });
    const manageable = getManageableVentures();
    const foundBtn = document.getElementById('btn-found-team');
    if(foundBtn) foundBtn.onclick = ()=>{
      const vId = manageable.length>1 ? document.getElementById('sports-venture-select').value : manageable[0].id;
      const sport = document.getElementById('sport-type-select').value;
      const r = foundSportsTeam(vId, sport);
      toast(r.msg); render();
    };
    const acquireBtn = document.getElementById('btn-acquire-team');
    if(acquireBtn) acquireBtn.onclick = ()=>{
      const vId = manageable.length>1 ? document.getElementById('sports-venture-select').value : manageable[0].id;

      if(!confirm(`${SPORT_TYPES[sport].label}チームの買収を検討します。よろしいですか?`)) return;

  return wrap;

// チーム詳細画面(独立モーダル): 常時表示のヘッダー・競技成績/経営成績の分離・ゲージ・前期比較・ロスター・経営履歴
function openTeamDetailModal(ventureId, teamId){ showModal(); renderTeamDetailModal(ventureId, teamId); }
function renderTeamDetailModal(ventureId, teamId){
  const v = state.ventures.find(x=>x.id===ventureId);
  const modal = document.getElementById('modal');
  if(!v){ modal.innerHTML = `<div class="modal-handle"></div><div class="empty-state">企業が見つかりません</div>`; return; }
  const team = (v.sportsTeams||[]).find(t=>t.id===teamId);
  if(!team){ modal.innerHTML = `<div class="modal-handle"></div><div class="empty-state">チームが見つかりません</div>`; return; }
  const strength = computeTeamStrength(team);
  const value = computeTeamValue(team);
  const titleObj = team.esportsTitle ? state.esportsTitles.find(t=>t.key===team.esportsTitle) : null;
  const salaryCost = (team.roster||[]).reduce((s,p)=>s+p.salary,0);
  const facilityCost = ((team.facilities.stadium||0)+(team.facilities.training||0)+(team.facilities.youth||0))*5_000_000;
  const sponsorTotal = (team.sponsors||[]).reduce((s,sp)=>s+sp.amount,0);
  const gauge = (val)=> `<div style="height:6px; background:var(--panel-alt); border-radius:3px; overflow:hidden; margin-top:2px;"><div style="height:100%; width:${clamp(val,0,100)}%; background:var(--cyan);"></div></div>`;
  const yoy = (cur, prev)=> prev ? `<span style="font-size:9.5px; color:${cur>=prev?'var(--green)':'var(--red)'}; margin-left:4px;">(${cur>=prev?'+':''}${((cur/prev-1)*100).toFixed(0)}%)</span>` : '';

  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div style="background:var(--panel-alt); margin:0 -14px 10px; padding:14px; border-bottom:1px solid var(--line);">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:15px; font-weight:800;">${team.name}</div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div style="font-size:10px; color:var(--muted); margin-top:2px; font-family:var(--font-wide);">${SPORT_TYPES[team.sport].label}${titleObj?`・${titleObj.label}`:''} ・ ${team.ventureName||v.name}</div>
      <div style="display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;">
        <div><div style="font-size:9px; color:var(--muted);">総合力</div><div style="font-size:16px; font-weight:800;">${strength.toFixed(0)}</div></div>
        <div><div style="font-size:9px; color:var(--muted);">${team.sport==='esports'?'世界ランキング':'順位'}</div><div style="font-size:16px; font-weight:800;">${team.standing||'-'}位</div></div>
        <div><div style="font-size:9px; color:var(--muted);">ファン</div><div style="font-size:16px; font-weight:800;">${team.fanbase.toFixed(0)}万人</div></div>
        <div><div style="font-size:9px; color:var(--muted);">チーム価値</div><div style="font-size:16px; font-weight:800;">${fmtYen(value)}</div></div>
      </div>
    </div>

    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>競技成績</h2></div>
    <div style="padding:8px 0;">
      <div style="margin-bottom:6px;"><div style="display:flex; justify-content:space-between; font-size:11px;"><span>人気</span><span>${team.fanbase.toFixed(0)}</span></div>${gauge(team.fanbase)}</div>
      <div style="margin-bottom:6px;"><div style="display:flex; justify-content:space-between; font-size:11px;"><span>ロイヤルティ</span><span>${team.loyalty.toFixed(0)}</span></div>${gauge(team.loyalty)}</div>
      <div style="margin-bottom:6px;"><div style="display:flex; justify-content:space-between; font-size:11px;"><span>スタジアム</span><span>${(team.facilities.stadium||0).toFixed(0)}</span></div>${gauge(team.facilities.stadium||0)}</div>
      <div style="margin-bottom:6px;"><div style="display:flex; justify-content:space-between; font-size:11px;"><span>練習施設</span><span>${(team.facilities.training||0).toFixed(0)}</span></div>${gauge(team.facilities.training||0)}</div>
      ${team.facilities.youth!==undefined ? `<div style="margin-bottom:6px;"><div style="display:flex; justify-content:space-between; font-size:11px;"><span>ユースアカデミー</span><span>${team.facilities.youth.toFixed(0)}</span></div>${gauge(team.facilities.youth)}</div>` : ''}
    </div>

    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>経営成績</h2></div>
    <table class="dtable">
      <tr><td>年間売上</td><td>${fmtYen(team.revenue||0)}${yoy(team.revenue||0, team.prevSeasonRevenue)}</td></tr>

      <tr><td>選手年俸(合計)</td><td>${fmtYen(salaryCost)}</td></tr>
      <tr><td>施設維持費</td><td>${fmtYen(facilityCost)}</td></tr>
      <tr><td>スポンサー収入</td><td>${fmtYen(sponsorTotal)}(${(team.sponsors||[]).length}社)</td></tr>
      ${team.namingRights ? `<tr><td>命名権</td><td>${team.namingRights.name}</td></tr>` : ''}
    </table>

    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>ロスター(${(team.roster||[]).length}名)</h2></div>
    <div style="max-height:220px; overflow-y:auto;">
      ${(team.roster||[]).sort((a,b)=>b.skill-a.skill).map(p=>`
        <div class="row" style="cursor:default;">
          <div class="row-left"><div class="nm" style="font-size:11.5px;">${p.name} <span style="color:var(--muted); font-size:9.5px;">${p.age}歳・${p.careerStage==='rookie'?'新人':p.careerStage==='prime'?'全盛期':'ベテラン'}</span></div>

          <div class="row-right"><button class="btn btn-ghost btn-sm" data-release-player="${p.id}">放出</button></div>
        </div>
      `).join("")}
    </div>

    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>選手市場(FA)</h2></div>
    <div id="fa-market-body" style="max-height:200px; overflow-y:auto;"></div>

    <div style="height:14px;"></div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>経営履歴</h2></div>
    <div style="padding:8px 0; font-size:11px; color:var(--muted); line-height:1.9; font-family:var(--font-wide);">
      ${(team.history||[]).slice().reverse().slice(0,15).map(h=>`${fmtDateShort(h.day)} ${h.text}`).join("<br>")}
    </div>

    <div style="height:14px;"></div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>経営</h2></div>
    <div class="buy-sell-row" style="margin-top:8px;">
      <button class="btn btn-ghost btn-block btn-sm" data-team-facility="${team.id}:stadium">スタジアム投資</button>
      <button class="btn btn-ghost btn-block btn-sm" data-team-facility="${team.id}:training">練習施設投資</button>
    </div>
    ${team.facilities.youth!==undefined ? `<button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px;" data-team-facility="${team.id}:youth">ユースアカデミー投資</button>` : ''}
    <div class="buy-sell-row" style="margin-top:8px;">
      <button class="btn btn-cyan btn-block btn-sm" data-team-sponsor="${team.id}">スポンサー営業</button>
      ${team.sport!=="esports" ? `<button class="btn btn-ghost btn-block btn-sm" data-team-naming="${team.id}">命名権売却</button>` : ''}
    </div>
    <button class="btn btn-red btn-block btn-sm" style="margin-top:8px;" data-team-sell="${team.id}">チームを売却する</button>
  `;
  modal.querySelector('#modal-close').onclick = closeModal;

  const faMarket = getFreeAgentMarket(team.sport);
  document.getElementById('fa-market-body').innerHTML = faMarket.map((p,i)=>`
    <div class="row" style="cursor:default;">
      <div class="row-left"><div class="nm" style="font-size:11.5px;">${p.name} <span style="color:var(--muted); font-size:9.5px;">${p.age}歳</span></div>
        <div class="sub">総合${p.skill.toFixed(0)} ・ 契約金目安${fmtYen(Math.round(p.marketValue*0.15))} ・ 年俸${fmtYen(p.salary)}</div></div>
      <div class="row-right"><button class="btn btn-cyan btn-sm" data-sign-fa="${i}">契約</button></div>
    </div>
  `).join("");
  modal.querySelectorAll('[data-sign-fa]').forEach(b=>{
    b.onclick = ()=>{
      const player = faMarket[parseInt(b.dataset.signFa)];
      const r = signFreeAgent(v.id, team.id, player);
      toast(r.msg); renderTeamDetailModal(ventureId, teamId);
    };
  });
  modal.querySelectorAll('[data-release-player]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('この選手を放出しますか?')) return;
      const r = releasePlayer(v.id, team.id, b.dataset.releasePlayer);
      toast(r.msg); renderTeamDetailModal(ventureId, teamId);
    };
  });
  modal.querySelectorAll('[data-team-facility]').forEach(b=>{
    b.onclick = ()=>{
      const [, facilityKey] = b.dataset.teamFacility.split(":");

      const r = investInTeamFacility(v.id, team.id, facilityKey, amount);

      toast(r.msg); closeModal(); render();
    };
  });
}


/* ---------- ニュースタブ ---------- */
function renderNews(){
  const wrap = document.createElement('div');
  const secBody = document.createElement('div');
  secBody.style.padding = "0";
  if(!state.news.length){
    secBody.innerHTML = `<div class="empty-state">まだニュースはありません</div>`;
  } else {
    state.news.forEach(n=>{
      const meta = CATEGORY_META[n.category] || CATEGORY_META.general;
      const kindBadge = n.kind==="rumor" ? '<span class="badge warn">市場の噂</span>' : '<span class="badge info">確定情報</span>';
      const st = n.stockId ? state.stocks.find(s=>s.id===n.stockId) : null;
      const row = el(`
        <div class="news-tl-row">
          <div class="news-tl-avatar">${meta.icon}</div>
          <div class="news-tl-body">
            <div class="news-tl-headline">${n.text}</div>
            <div class="news-top" style="margin:5px 0 0;">
              <span class="news-day">${fmtDateShort(n.day)}</span>${starsHtml(n.stars)}${kindBadge}
              ${st?`<span class="badge theme">${st.name}</span>`:''}
            </div>
          </div>
          <div class="news-tl-chevron">›</div>
        </div>
      `);
      row.addEventListener('click', ()=> openNewsDetail(n));
      secBody.appendChild(row);
    });
  }
  wrap.appendChild(el(`<div class="sec"><div class="sec-head"><h2>ニュースフィード</h2><span class="sub">タップで詳細記事</span></div></div>`));
  wrap.lastChild.appendChild(secBody);
  return wrap;
}

function openStockModal(stockId){

  const pos = state.portfolio[st.id];
  const owned = pos ? pos.shares : 0;
  const availShares = availableShares(st.id);
  const pct = (st.price/st.prevPrice-1)*100;
  const today = todayCandle(st);

  const themeBadge = isThemeMatch(st) ? `<span class="badge theme">◆テーマ「${state.theme.name}」適合</span>` : "";
  const rumor = state.pendingRumors.find(r=>r.stockId===st.id);
  const rumorBadge = rumor ? `<span class="badge warn">噂:${rumor.direction==='up'?'好材料':'悪材料'}(${rumor.magKey})</span>` : "";
  const stopBadge = today.stopHigh ? `<span class="badge stop">ストップ高</span>` : (today.stopLow ? `<span class="badge stopdown">ストップ安</span>` : "");
  const linkedVenture = state.ventures.find(v=>v.listedStockId===st.id && v.stage==="listed");
  const ventureBadge = linkedVenture ? `<span class="badge gain">あなたが育てた企業</span>` : "";
  const healthStatus = computeCompanyHealthStatus(st);
  const healthBadge = healthStatus.level!=="stable" ? `<span class="badge ${healthStatus.level==='declining'?'neutral':(healthStatus.level==='distressed'?'warn':'stop')}">${healthStatus.emoji} ${healthStatus.label}</span>` : "";
  const playerVotingPct = pos ? (pos.shares/st.shares*100) : 0;
  const showTakeoverEntry = !linkedVenture && playerVotingPct>=5 && canUnlockAcquisitions();
  const influenceTier = playerVotingPct>0 ? computeShareholderInfluenceTier(playerVotingPct) : null;

  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div><div class="modal-title">${st.name}</div><div style="font-size:10.5px; color:var(--muted); margin-top:2px;">${st.sector}</div></div>

    </div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:6px;">
      <div id="stock-modal-price" style="font-size:25px; font-weight:800;">¥${fmtNum(st.price)}</div>
      <span id="stock-modal-pct" class="pill ${pct>=0?'gain':'loss'}" style="font-size:12px;">${fmtPct(pct)}</span>
    </div>
    <div id="stock-modal-badges" style="margin-bottom:4px; display:flex; gap:5px; flex-wrap:wrap;">${themeBadge}${rumorBadge}${stopBadge}${ventureBadge}${healthBadge}${influenceTier?`<span class="badge info">${influenceTier.label}(${playerVotingPct.toFixed(1)}%)</span>`:''}</div>
    <button class="btn btn-cyan btn-block" id="btn-open-order-menu" style="margin-bottom:8px; font-weight:800;">注文</button>
    ${linkedVenture ? `<button class="btn btn-ghost btn-block btn-sm" id="btn-manage-venture" style="margin-bottom:8px;">この企業を経営する →</button>` : ''}
    ${showDirectControl ? `<button class="btn btn-cyan btn-block btn-sm" id="btn-take-direct-control" style="margin-bottom:8px;">経営権を取得する(議決権${playerVotingPct.toFixed(1)}%)</button>` : ''}
    ${showTakeoverEntry ? `<button class="btn btn-red btn-block btn-sm" id="btn-open-takeover" style="margin-bottom:8px;">M&A:敵対的買収を検討する(保有${playerVotingPct.toFixed(1)}%)</button>` : ''}

    <div class="subtab-row">
      <button class="subtab-btn ${modalSubtab==='chart'?'active':''}" data-sub="chart">チャート</button>
      <button class="subtab-btn ${modalSubtab==='kaishaho'?'active':''}" data-sub="kaishaho">四季報</button>
      <button class="subtab-btn ${modalSubtab==='disclosure'?'active':''}" data-sub="disclosure">適時開示</button>
      <button class="subtab-btn ${modalSubtab==='technical'?'active':''}" data-sub="technical">分析</button>
      <button class="subtab-btn ${modalSubtab==='board'?'active':''}" data-sub="board">掲示板</button>
    </div>
    <div id="modal-subbody"></div>
  `;

  modal.querySelector('#modal-close').onclick = closeModal;
  modal.querySelectorAll('[data-sub]').forEach(b=>{ b.onclick = ()=>{ switchModalSubtab(b.dataset.sub); }; });
  const orderMenuBtn = modal.querySelector('#btn-open-order-menu');
  if(orderMenuBtn) orderMenuBtn.onclick = ()=>{ openOrderMenuModal(st.id); };
  const manageBtn = modal.querySelector('#btn-manage-venture');
  if(manageBtn) manageBtn.onclick = ()=>{ openVentureModal(linkedVenture.id); };
  const takeoverBtn = modal.querySelector('#btn-open-takeover');
  if(takeoverBtn) takeoverBtn.onclick = ()=>{ openTakeoverModal(st.id); };
  const directControlBtn = modal.querySelector('#btn-take-direct-control');
  if(directControlBtn) directControlBtn.onclick = ()=>{
    if(!confirm(`${st.name}の経営権を取得しますか?保有株式はそのままこの企業の経営権として扱われます。`)) return;
    const r = takeDirectManagementControl(st.id);
    toast(r.msg);
    if(r.ok){ render(); openVentureModal(r.ventureId); }
  };

  renderModalSubbody(st);
}

// サブタブ切替: #modal-subbody だけを差し替える。ヘッダーや注文フォーム(入力中の値)には一切触れない
function switchModalSubtab(sub){
  modalSubtab = sub;
  const st = state.stocks.find(s=>s.id===modalStockId);
  if(!st) return;
  document.querySelectorAll('.subtab-row [data-sub]').forEach(b=>{ b.classList.toggle('active', b.dataset.sub===sub); });
  renderModalSubbody(st);
}
function renderModalSubbody(st){
  const subbody = document.getElementById('modal-subbody');
  if(!subbody) return;
  let bodyHtml = "";
  if(modalSubtab==="chart") bodyHtml = renderModalChartTab(st);
  else if(modalSubtab==="kaishaho") bodyHtml = renderModalKaishahoTab(st);
  else if(modalSubtab==="disclosure") bodyHtml = renderModalDisclosureTab(st);
  else if(modalSubtab==="technical") bodyHtml = renderModalTechnicalTab(st);
  else if(modalSubtab==="board") bodyHtml = renderModalBoardTab(st);
  subbody.innerHTML = bodyHtml;

  if(modalSubtab==="disclosure") setTimeout(()=>{
    document.querySelectorAll('[data-disc]').forEach(row=>{
      row.style.cursor='pointer';
      row.onclick = ()=>{ openDisclosureDetail(st, st.disclosures[parseInt(row.dataset.disc)]); };
    });
  },0);

  if(modalSubtab==="chart"){
    document.querySelectorAll('[data-stock-tf]').forEach(b=>{
      b.onclick = ()=>{ stockChartTimeframe = b.dataset.stockTf; renderModalSubbody(st); };
    });
    setTimeout(()=>drawStockDetailChart(st),0);
  }
  if(modalSubtab==="kaishaho") setTimeout(()=>{
    const hook = document.getElementById('kaishaho-chart-hook');
    if(!hook || !hook.dataset || !hook.dataset.rev || !hook.dataset.prof) return;
    const rev = hook.dataset.rev.split(',').map(Number);
    const prof = hook.dataset.prof.split(',').map(Number);
    drawBarChart(document.getElementById('trend-revenue-chart'), rev, ["3期前","2期前","直近"], "#00E5FF");
    drawBarChart(document.getElementById('trend-profit-chart'), prof, ["3期前","2期前","直近"], "#FFB300");
  },0);
}

// 市場データ更新時の軽量リフレッシュ(1日進んだ時など)。入力中のフォームやサブタブ選択には一切触れない
function refreshStockModalLive(){
  const st = state.stocks.find(s=>s.id===modalStockId);
  if(!st) return;
  const priceEl = document.getElementById('stock-modal-price');
  const pctEl = document.getElementById('stock-modal-pct');
  if(priceEl && pctEl){
    const pct = (st.price/st.prevPrice-1)*100;
    priceEl.textContent = `¥${fmtNum(st.price)}`;
    pctEl.textContent = fmtPct(pct);
    pctEl.classList.toggle('gain', pct>=0);
    pctEl.classList.toggle('loss', pct<0);
  }
  const badgesEl = document.getElementById('stock-modal-badges');
  if(badgesEl){
    const today = todayCandle(st);
    const themeBadge = isThemeMatch(st) ? `<span class="badge theme">◆テーマ「${state.theme.name}」適合</span>` : "";
    const rumor = state.pendingRumors.find(r=>r.stockId===st.id);
    const rumorBadge = rumor ? `<span class="badge warn">噂:${rumor.direction==='up'?'好材料':'悪材料'}(${rumor.magKey})</span>` : "";
    const stopBadge = today.stopHigh ? `<span class="badge stop">ストップ高</span>` : (today.stopLow ? `<span class="badge stopdown">ストップ安</span>` : "");
    const healthStatus = computeCompanyHealthStatus(st);
    const healthBadge = healthStatus.level!=="stable" ? `<span class="badge ${healthStatus.level==='declining'?'neutral':(healthStatus.level==='distressed'?'warn':'stop')}">${healthStatus.emoji} ${healthStatus.label}</span>` : "";
    badgesEl.innerHTML = themeBadge+rumorBadge+stopBadge+healthBadge;
  }
  if(modalSubtab==="chart"){
    drawStockDetailChart(st);
  }
}

// 選択中の時間軸(月足/週足/日足)に応じてローソク足を再構成する。SMA5/20・ボリンジャーバンドは
// この再構成後のデータから計算されるため、週足なら5週/20週、月足なら5ヶ月/20ヶ月の値になる
function getStockChartCandles(st){
  if(stockChartTimeframe==="1mo") return resampleCandles(st.history, 21);
  if(stockChartTimeframe==="1wk") return resampleCandles(st.history, 5);
  return st.history;
}
function drawStockDetailChart(st){
  const canvas = document.getElementById('detail-chart');
  if(!canvas) return;
  const candles = getStockChartCandles(st);
  const maxCandles = stockChartTimeframe==="1d" ? 34 : (stockChartTimeframe==="1wk" ? 30 : 24);
  drawCandlestickChart(canvas, candles, {labels:true, maxCandles, showVolume:stockChartTimeframe==="1d", showSMA:true, showBB:true, crossLog:stockChartTimeframe==="1d"?st.crossLog:[]});
}

// IPO詳細モーダル(企業情報・価格形成の流れ・人気度・抽選申込)
function ipoExpectedFirstPriceRange(def, ipo){
  const base = ipo.publicPrice || ipo.assumedPrice;
  const center = (def.quality-0.5)*0.4 + (ipo.popularity-0.5)*0.3 + (def.growth-10)/100;
  // IPOアナリスト在籍時は予想レンジが狭くなる(初値予想の精度が上がる)
  const spread = bestIpoAnalystLevel()>0 ? 0.13 : 0.25;
  const lo = Math.max(10, Math.round(base*(1+center-spread)));
  const hi = Math.max(lo+10, Math.round(base*(1+center+spread)));
  return {lo, hi};
}
// IPOの状態表示ヘルパー(タブ・スケジュール・カウントダウン・専用通知で共有)
function ipoStatusLabel(ipo){
  if(ipo.phase==="announced") return (state.day-ipo.announceDay<=1) ? "情報公開中" : "申し込み受付中";
  if(ipo.phase==="priced") return "公開価格決定・上場待ち";
  return "";
}
function ipoCountdownDays(ipo){
  return Math.max(0, (ipo.phase==="announced" ? ipo.priceDecisionDay : ipo.listDay) - state.day);
}
function renderIpoScheduleTimeline(ipo){
  const stages = [
    {day:ipo.announceDay, label:"情報公開・購入予約開始"},
    {day:ipo.priceDecisionDay, label:"公開価格決定・抽選結果発表"},
    {day:ipo.listDay, label:"上場・初値形成"},
  ];
  return stages.map(s=>`
    <div class="row" style="cursor:default;">
      <div class="row-left"><div class="nm" style="font-size:12px;">${fmtDateFull(s.day)}</div><div class="sub">${s.label}</div></div>
      <div class="row-right">${state.day>=s.day?'<span class="badge gain">完了</span>':'<span class="badge neutral">予定</span>'}</div>
    </div>
  `).join("");
}

    const allianceType = modal.querySelector('#alliance-type-select').value;
    const ownStake = parseInt(modal.querySelector('#alliance-stake-input').value)||50;
    const exclusive = modal.querySelector('#alliance-exclusive-check').checked;
    const r = proposeAlliance(v.id, partnerId, allianceType, {ownStake, exclusive});
    toast(r.msg); renderVentureModal(ventureId); render();
  };
  modal.querySelectorAll('[data-dissolve-alliance]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('この提携を解消しますか?')) return;
      const r = dissolveAlliance(v.id, b.dataset.dissolveAlliance);
      toast(r.msg); renderVentureModal(ventureId); render();
    };
  });
  const gotoSportsBtn = modal.querySelector('#btn-goto-sports-tab');
  if(gotoSportsBtn) gotoSportsBtn.onclick = ()=>{ closeModal(); switchTab('sports'); };
  modal.querySelectorAll('[data-hire-exec]').forEach(b=>{
    b.onclick = ()=>{ const [pos,subtype]=b.dataset.hireExec.split(":"); const r=hireExecutive(v.id,pos,subtype); toast(r.msg); renderVentureModal(ventureId); render(); };
  });
  modal.querySelectorAll('[data-rd-theme]').forEach(b=>{
    b.onclick = ()=>{ setVentureRdTheme(v.id, b.dataset.rdTheme); renderVentureModal(ventureId); };
  });
  const startProdBtn = modal.querySelector('#btn-start-product');
  if(startProdBtn) startProdBtn.onclick = ()=>{ const r=startNewProduct(v.id); toast(r.msg); renderVentureModal(ventureId); render(); };
  modal.querySelectorAll('[data-expand-overseas]').forEach(b=>{
    b.onclick = ()=>{ const r=expandOverseas(v.id, b.dataset.expandOverseas); toast(r.msg||''); renderVentureModal(ventureId); render(); };
  });
  modal.querySelectorAll('[data-board-decision]').forEach(b=>{
    b.onclick = ()=>{ const [decId,choice]=b.dataset.boardDecision.split(":"); resolveBoardDecision(decId, choice); renderVentureModal(ventureId); render(); };
  });
  const ipoBtn = modal.querySelector('#btn-apply-venture-ipo');
  if(ipoBtn) ipoBtn.onclick = ()=>{ const r=attemptVentureIPO(v.id); if(r&&!r.ok) toast(r.msg); renderVentureModal(ventureId); render(); };
  const viewStockBtn = modal.querySelector('#btn-view-listed-stock');
  if(viewStockBtn) viewStockBtn.onclick = ()=>{ openStockModal(v.listedStockId); };
  modal.querySelectorAll('[data-offer-respond]').forEach(b=>{
    b.onclick = ()=>{
      const accept = b.dataset.offerRespond==='accept';
      if(accept && !confirm('この提案を受け入れて会社を売却しますか?')) return;
      const r = respondToIncomingOffer(v.id, accept);
      toast(r.msg);
      render();
      if(v.stage==='failed') closeModal(); else renderVentureModal(ventureId);
    };
  });
  modal.querySelectorAll('[data-defense]').forEach(b=>{
    b.onclick = ()=>{
      const r = defendAgainstIncomingTob(v.id, b.dataset.defense);
      toast(r.msg);
      renderVentureModal(ventureId); render();
    };
  });
}

// 投資家掲示板タブ: 市場参加者の意見と市場センチメントを表示する
// 信用取引タブ: 口座開設・信用買い/空売り注文・この銘柄の建玉一覧・保証金維持率を表示する
/* ==========================================================================
   注文メニュー・注文画面(独立タブ)・注文管理(証券アプリ型の注文フロー)
   ========================================================================== */
let orderEntryDraft = {}; // stockId+mode ごとの下書き(数量・価格・注文方法を維持する)
const ORDER_MODE_LABELS = {spot_buy:"現物買", spot_sell:"現物売", margin_buy:"信用新規買", margin_sell:"信用新規売(空売り)", margin_close_sell:"信用返済売", margin_close_buy:"信用返済買"};

// 注文メニュー(銘柄詳細から開く。現物/信用/返済のどれを行うかを選ぶ入口)
function openOrderMenuModal(stockId){ showModal(); renderOrderMenuModal(stockId); }
function renderOrderMenuModal(stockId){
  const st = state.stocks.find(s=>s.id===stockId);
  const modal = document.getElementById('modal');
  if(!st){ modal.innerHTML = `<div class="modal-handle"></div><div class="empty-state">銘柄が見つかりません</div>`; return; }
  const pos = state.portfolio[stockId];
  const longPos = state.marginPositions.find(p=>p.stockId===stockId && p.side==='long');
  const shortPos = state.marginPositions.find(p=>p.stockId===stockId && p.side==='short');
  const marginOpen = state.marginAccount && state.marginAccount.opened;
  const pct = (st.price/st.prevPrice-1)*100;
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div style="text-align:center; padding:10px 0 14px;">
      <div style="font-size:11px; color:var(--muted); font-family:var(--font-wide);">(${st.id}) ${st.name}</div>
      <div style="display:flex; justify-content:center; align-items:baseline; gap:8px; margin-top:4px;">
        <div style="font-size:24px; font-weight:800;">¥${fmtNum(st.price)}</div>
        <span class="pill ${pct>=0?'gain':'loss'}">${fmtPct(pct)}</span>
      </div>
    </div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>現物取引</h2></div>
    <div class="buy-sell-row">
      <button class="btn btn-cyan btn-block" data-order-menu="spot_buy">現物買</button>
      <button class="btn btn-ghost btn-block" data-order-menu="spot_sell" ${pos?'':'disabled'}>現物売</button>
    </div>
    <div style="height:12px;"></div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>信用取引</h2><span class="sub">${marginOpen?'':'口座未開設'}</span></div>
    ${marginOpen ? `
    <div class="buy-sell-row">
      <button class="btn btn-cyan btn-block" data-order-menu="margin_buy" ${isMarginEligible(st)?'':'disabled'}>信用新規買</button>
      <button class="btn btn-ghost btn-block" data-order-menu="margin_sell" ${isShortSellEligible(st)?'':'disabled'}>信用新規売</button>
    </div>
    <div class="buy-sell-row" style="margin-top:8px;">
      <button class="btn btn-ghost btn-block" data-order-menu="margin_close_sell" ${longPos?'':'disabled'}>信用返済売</button>
      <button class="btn btn-ghost btn-block" data-order-menu="margin_close_buy" ${shortPos?'':'disabled'}>信用返済買</button>

    <div class="sec-body" style="padding:8px 0;">
      <div style="font-size:10.5px; color:var(--muted); line-height:1.7; margin-bottom:8px; font-family:var(--font-wide);">信用取引口座を開設すると、信用買い・空売りが利用できるようになります。</div>
      ${(()=>{ const chk=canOpenMarginAccount(); return chk.ok ? `<button class="btn btn-red btn-block btn-sm" id="btn-open-margin-account-from-menu">信用取引口座を開設する</button>` : `<div style="font-size:10.5px; color:var(--red); line-height:1.8; font-family:var(--font-wide);">開設条件を満たしていません:<br>${chk.reasons.map(r=>`・${r}`).join("<br>")}</div>`; })()}

  });

// 注文画面(独立タブ)。参考画像の構成(現在値・注文種別・株数・価格・執行条件・発注)を、既存UIに合わせて実装する
function openOrderEntryModal(stockId, mode){ showModal(); renderOrderEntryModal(stockId, mode); }
function renderOrderEntryModal(stockId, mode){
  const st = state.stocks.find(s=>s.id===stockId);
  const modal = document.getElementById('modal');
  if(!st) return;
  const isBuy = mode==="spot_buy" || mode==="margin_buy" || mode==="margin_close_buy";
  const isMargin = mode.startsWith("margin");
  const isClose = mode.includes("close");
  const isSpotSell = mode==="spot_sell";
  const pct = (st.price/st.prevPrice-1)*100;
  const band = getPriceLimitBand(st.price);

  let targetPositions = [];
  if(isClose){
    const side = mode==="margin_close_sell" ? "long" : "short";
    targetPositions = state.marginPositions.filter(p=>p.stockId===stockId && p.side===side);
  }

  const draftKey = stockId+"_"+mode;
  if(!orderEntryDraft[draftKey]) orderEntryDraft[draftKey] = {orderType:"market", qty:"100", limitPrice:String(Math.round(st.price)), stopPrice:String(Math.round(st.price)), ocoLimitPrice:String(Math.round(st.price*1.1)), ocoStopPrice:String(Math.round(st.price*0.9)), positionId: targetPositions[0]?targetPositions[0].id:null, skipConfirm:false};
  const draft = orderEntryDraft[draftKey];

  const availableTypes = ["market"];
  if(canUseLimitOrders()) availableTypes.push("limit");
  if(canUseStopOrders()) availableTypes.push("stop");
  if(canUseOCOOrders() && isSpotSell) availableTypes.push("oco");
  if(!availableTypes.includes(draft.orderType)) draft.orderType="market";

  let infoRows = "";
  if(mode==="spot_buy"){
    infoRows = `<tr><td>買付可能額</td><td>${fmtYen(availableCash())}</td></tr>`;
  } else if(mode==="spot_sell"){
    const pos = state.portfolio[stockId];
    infoRows = `<tr><td>保有株数</td><td>${fmtNum(pos?pos.shares:0)}株</td></tr><tr><td>売却可能株数</td><td>${fmtNum(availableShares(stockId))}株</td></tr>`;
  } else if(mode==="margin_buy"){
    infoRows = `<tr><td>信用余力</td><td>${fmtYen(availableCash())}</td></tr>`;
  } else if(mode==="margin_sell"){
    infoRows = `<tr><td>空売り可能株数(目安)</td><td>${fmtNum(floatShares(st))}株</td></tr><tr><td>信用余力</td><td>${fmtYen(availableCash())}</td></tr>`;
  } else if(isClose){
    const p = targetPositions.find(x=>x.id===draft.positionId) || targetPositions[0];
    if(p){
      const pl = p.side==="long" ? (st.price-p.entryPrice)*p.qty : (p.entryPrice-st.price)*p.qty;
      infoRows = `
        <tr><td>建玉数量</td><td>${fmtNum(p.qty)}株</td></tr>
        <tr><td>平均取得価格</td><td>¥${fmtNum(p.entryPrice)}</td></tr>
        <tr><td>保有日数</td><td>${state.day-p.entryDay}日</td></tr>
        <tr><td>評価損益</td><td style="color:${pl>=0?'var(--green)':'var(--red)'};">${pl>=0?'+':''}${fmtYen(pl)}</td></tr>
        <tr><td>${p.side==='long'?'金利':'貸株料'}</td><td>${fmtYen(p.side==='long'?p.accruedInterest:p.accruedBorrowFee)}</td></tr>
      `;
    } else {
      infoRows = `<tr><td colspan="2">対象の建玉がありません</td></tr>`;
    }
  }

  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">(${st.id}) ${st.name}</div><button class="modal-close" id="modal-close">✕</button></div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
      <div style="font-size:10px; color:var(--muted); font-family:var(--font-wide);">現在値</div>
      <div style="display:flex; align-items:baseline; gap:8px;">
        <div id="order-entry-price" style="font-size:24px; font-weight:800;">¥${fmtNum(st.price)}</div>
        <span id="order-entry-pct" class="pill ${pct>=0?'gain':'loss'}">${fmtPct(pct)}</span>
      </div>
    </div>
    <div class="${isBuy?'btn-cyan':'btn-red'}" style="text-align:center; padding:10px; font-weight:800; font-size:13px; color:#fff; background:${isBuy?'var(--cyan)':'var(--red)'};">${ORDER_MODE_LABELS[mode]}(注文入力)</div>

    ${isClose && targetPositions.length>1 ? `
      <div class="price-input-row" style="margin-top:10px;"><label>対象建玉</label>
        <select id="order-position-select" style="flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); padding:8px; font-family:var(--font);">
          ${targetPositions.map(p=>`<option value="${p.id}" ${p.id===draft.positionId?'selected':''}>${fmtNum(p.qty)}株 @¥${fmtNum(p.entryPrice)}</option>`).join("")}
        </select>
      </div>
    ` : ''}

    <table class="dtable" style="margin-top:10px;">${infoRows}</table>

    <div style="height:12px;"></div>
    <div style="font-size:9.5px; color:var(--muted-2); margin-bottom:4px; font-family:var(--font-wide);">注文方法</div>
    <div class="toggle-row">
      ${availableTypes.map(t=>`<button class="btn-toggle ${draft.orderType===t?'active':''}" data-otype="${t}">${ORDER_TYPE_LABELS[t]}</button>`).join("")}
    </div>

    <div class="price-input-row" style="margin-top:10px;">
      <label>株数</label>
      <div class="qty-stepper">
        <button class="qty-btn" id="oe-qty-minus">−</button>
        <input type="number" id="oe-qty-input" value="${draft.qty}" min="100" step="100">
        <button class="qty-btn" id="oe-qty-plus">+</button>
      </div>
    </div>

    ${draft.orderType==="market" ? `
      <div class="price-input-row"><label>価格</label><div style="flex:1; padding:7px 8px; color:var(--muted); font-family:var(--font);">成行(現在値 ¥${fmtNum(st.price)})</div></div>
    ` : draft.orderType==="limit" ? `
      <div class="price-input-row"><label>指値価格</label><input type="number" id="oe-limit-price" value="${draft.limitPrice}"></div>
      <div style="font-size:9.5px; color:var(--muted-2); margin:-2px 0 6px; font-family:var(--font-wide);">制限値幅目安: ¥${fmtNum(st.price-band)}〜¥${fmtNum(st.price+band)}</div>
    ` : draft.orderType==="stop" ? `
      <div class="price-input-row"><label>逆指値トリガー</label><input type="number" id="oe-stop-price" value="${draft.stopPrice}"></div>
      <div style="font-size:9.5px; color:var(--muted-2); margin:-2px 0 6px; font-family:var(--font-wide);">トリガー到達後、成行で発注されます</div>
    ` : draft.orderType==="oco" ? `
      <div class="price-input-row"><label>利確価格</label><input type="number" id="oe-oco-limit" value="${draft.ocoLimitPrice}"></div>
      <div class="price-input-row"><label>損切価格</label><input type="number" id="oe-oco-stop" value="${draft.ocoStopPrice}"></div>
    ` : ''}

    ${!isBuy && isMargin && !isClose ? `<div style="font-size:9.5px; color:var(--amber); margin:6px 0; font-family:var(--font-wide);">※空売りは株価が上昇すると損失、下落すると利益になります。理論上、損失は無限大になり得ます。</div>` : ''}

    <table class="dtable" style="margin-top:10px;">
      <tr><td>注文金額(目安)</td><td id="oe-amount-preview">-</td></tr>
      <tr><td>${isMargin && !isClose ? '必要保証金(目安)' : '必要資金(目安)'}</td><td id="oe-required-preview">-</td></tr>
      ${isMargin && !isClose ? `<tr><td>発注後の想定維持率</td><td id="oe-ratio-preview">-</td></tr>` : ''}
    </table>

    <div style="display:flex; align-items:center; gap:6px; margin-top:10px;">
      <input type="checkbox" id="oe-skip-confirm" ${draft.skipConfirm?'checked':''}>
      <label for="oe-skip-confirm" style="font-size:10.5px; color:var(--muted); font-family:var(--font-wide);">確認画面を省略する</label>
    </div>

    <div class="buy-sell-row" style="margin-top:14px;">
      <button class="btn btn-ghost btn-block" id="btn-order-back">戻る</button>
      <button class="btn ${isBuy?'btn-cyan':'btn-red'} btn-block" id="btn-order-submit">発注</button>
    </div>
  `;
  modal.querySelector('#modal-close').onclick = closeModal;
  modal.querySelector('#btn-order-back').onclick = ()=>{ openOrderMenuModal(stockId); };

  const typeButtons = modal.querySelectorAll('[data-otype]');
  typeButtons.forEach(b=>{ b.onclick = ()=>{ draft.orderType=b.dataset.otype; renderOrderEntryModal(stockId, mode); }; });

  const posSelect = modal.querySelector('#order-position-select');
  if(posSelect) posSelect.addEventListener('change', ()=>{ draft.positionId=posSelect.value; renderOrderEntryModal(stockId, mode); });

  const qtyInput = modal.querySelector('#oe-qty-input');
  const updatePreview = ()=>{
    const qty = Math.max(TRADING_UNIT, parseInt(qtyInput.value)||TRADING_UNIT);
    draft.qty = String(qty);
    let refPrice = st.price;
    if(draft.orderType==="limit"){ const el=modal.querySelector('#oe-limit-price'); if(el){ refPrice=parseFloat(el.value)||st.price; draft.limitPrice=el.value; } }
    if(draft.orderType==="stop"){ const el=modal.querySelector('#oe-stop-price'); if(el){ refPrice=parseFloat(el.value)||st.price; draft.stopPrice=el.value; } }
    if(draft.orderType==="oco"){
      const el1=modal.querySelector('#oe-oco-limit'); if(el1) draft.ocoLimitPrice=el1.value;
      const el2=modal.querySelector('#oe-oco-stop'); if(el2) draft.ocoStopPrice=el2.value;
    }
    const amount = refPrice*qty;
    const requiredAmount = isMargin && !isClose ? amount*MARGIN_REQUIREMENT_RATE : (isBuy && !isClose ? amount*(1+feeRate()) : amount);
    modal.querySelector('#oe-amount-preview').textContent = fmtYen(amount);
    const reqEl = modal.querySelector('#oe-required-preview');
    if(reqEl) reqEl.textContent = fmtYen(requiredAmount);
    const ratioEl = modal.querySelector('#oe-ratio-preview');
    if(ratioEl){
      const existing = computeMaintenanceRatio();
      const existingMargin = existing?existing.totalMargin:0;
      const existingValue = existing?existing.totalPositionValue:0;
      const newRatio = (existingMargin+requiredAmount)/(existingValue+amount)*100;
      ratioEl.textContent = (existingValue+amount)>0 ? newRatio.toFixed(1)+"%" : "-";
    }
  };
  qtyInput.addEventListener('input', updatePreview);
  modal.querySelectorAll('#oe-limit-price,#oe-stop-price,#oe-oco-limit,#oe-oco-stop').forEach(inp=> inp && inp.addEventListener('input', updatePreview));
  modal.querySelector('#oe-qty-minus').onclick = ()=>{ qtyInput.value=Math.max(TRADING_UNIT,(parseInt(qtyInput.value)||TRADING_UNIT)-TRADING_UNIT); updatePreview(); };
  modal.querySelector('#oe-qty-plus').onclick = ()=>{ qtyInput.value=(parseInt(qtyInput.value)||0)+TRADING_UNIT; updatePreview(); };
  updatePreview();

  const skipConfirmBox = modal.querySelector('#oe-skip-confirm');
  skipConfirmBox.addEventListener('change', ()=>{ draft.skipConfirm=skipConfirmBox.checked; });

  modal.querySelector('#btn-order-submit').onclick = ()=>{
    if(draft.skipConfirm) submitOrderEntry(stockId, mode, draft);
    else openOrderConfirmModal(stockId, mode, draft);
  };
}
function buildOrderParams(stockId, mode, draft){
  const isBuy = mode==="spot_buy" || mode==="margin_buy" || mode==="margin_close_buy";
  const isMargin = mode.startsWith("margin");
  const isClose = mode.includes("close");
  const qty = Math.max(TRADING_UNIT, parseInt(draft.qty)||TRADING_UNIT);
  return {
    stockId, side: isBuy?"buy":"sell", orderType: draft.orderType, qty,
    limitPrice: parseFloat(draft.limitPrice)||undefined, stopPrice: parseFloat(draft.stopPrice)||undefined,
    ocoLimitPrice: parseFloat(draft.ocoLimitPrice)||undefined, ocoStopPrice: parseFloat(draft.ocoStopPrice)||undefined,
    validityDays: 30, tradeCategory: isMargin?"margin":"spot", marginAction: isMargin?(isClose?"close":"open"):null, positionId: isClose?draft.positionId:null,
  };
}
function submitOrderEntry(stockId, mode, draft){
  const params = buildOrderParams(stockId, mode, draft);
  let r;
  if(draft.orderType==="market"){
    if(params.tradeCategory==="spot") r = params.side==="buy" ? buyStock(stockId, params.qty) : sellStock(stockId, params.qty);
    else if(params.marginAction==="open") r = params.side==="buy" ? marginBuy(stockId, params.qty) : shortSell(stockId, params.qty);
    else { const pos = state.marginPositions.find(p=>p.id===draft.positionId); r = pos ? closeMarginPosition(pos.id, Math.min(params.qty,pos.qty)) : {ok:false, msg:"対象の建玉が見つかりません"}; }
  } else {
    r = placeOrder(params);
  }
  toast(r.msg);
  if(r.ok){ delete orderEntryDraft[stockId+"_"+mode]; closeModal(); render(); }
}
function openOrderConfirmModal(stockId, mode, draft){
  const st = state.stocks.find(s=>s.id===stockId);
  const modal = document.getElementById('modal');
  const params = buildOrderParams(stockId, mode, draft);
  const refPrice = draft.orderType==="market" ? st.price : (draft.orderType==="limit" ? params.limitPrice : (draft.orderType==="stop" ? params.stopPrice : params.ocoLimitPrice));
  const isMargin = mode.startsWith("margin");
  const isClose = mode.includes("close");
  const amount = refPrice*params.qty;
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">注文内容の確認</div><button class="modal-close" id="modal-close">✕</button></div>
    <table class="dtable">
      <tr><td>銘柄</td><td>(${st.id}) ${st.name}</td></tr>
      <tr><td>取引区分</td><td>${ORDER_MODE_LABELS[mode]}</td></tr>
      <tr><td>注文方法</td><td>${ORDER_TYPE_LABELS[draft.orderType]}</td></tr>
      <tr><td>株数</td><td>${fmtNum(params.qty)}株</td></tr>
      <tr><td>価格</td><td>${draft.orderType==="market"?"成行":`¥${fmtNum(refPrice)}`}</td></tr>
      <tr><td>注文金額(目安)</td><td>${fmtYen(amount)}</td></tr>
      ${isMargin && !isClose ? `<tr><td>必要保証金(目安)</td><td>${fmtYen(amount*MARGIN_REQUIREMENT_RATE)}</td></tr>` : ''}
    </table>
    <div class="buy-sell-row" style="margin-top:14px;">
      <button class="btn btn-ghost btn-block" id="btn-confirm-back">修正する</button>
      <button class="btn btn-cyan btn-block" id="btn-confirm-submit">注文を確定する</button>
    </div>
  `;
  modal.querySelector('#modal-close').onclick = ()=>{ renderOrderEntryModal(stockId, mode); };
  modal.querySelector('#btn-confirm-back').onclick = ()=>{ renderOrderEntryModal(stockId, mode); };
  let submitted = false;
  modal.querySelector('#btn-confirm-submit').onclick = ()=>{

// 注文管理画面: 未約定・一部約定・約定済み・取消済み・失効の注文を一覧表示し、指値変更・取消ができる
function openOrderManagementModal(){ showModal(); renderOrderManagementModal(); }
function renderOrderManagementModal(){
  const modal = document.getElementById('modal');
  const orders = [...state.pendingOrders].sort((a,b)=>b.createdDay-a.createdDay);
  const statusLabel = (o)=>{
    if(o.status==="cancelled") return "取消済み";
    if(o.status==="expired") return "失効";
    if(o.status==="filled") return "約定済み";
    if((o.filledQty||0)>0) return "一部約定";
    return "未約定";
  };
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">注文管理</div><button class="modal-close" id="modal-close">✕</button></div>
    ${orders.length ? orders.map(o=>{
      const st = state.stocks.find(s=>s.id===o.stockId);
      const label = statusLabel(o);
      const badgeCls = label==="約定済み" ? "gain" : (label==="取消済み"||label==="失効" ? "loss" : "info");
      return `
      <div class="row" style="cursor:default; align-items:flex-start; flex-direction:column; padding:10px 0; border-bottom:1px solid var(--line);">
        <div style="display:flex; justify-content:space-between; width:100%;">
          <div class="nm" style="font-size:12px;">${st?st.name:'(廃止銘柄)'} ・ ${o.tradeCategory==='margin'?(o.marginAction==='open'?(o.side==='buy'?'信用新規買':'信用新規売'):(o.side==='buy'?'信用返済買':'信用返済売')):(o.side==='buy'?'現物買':'現物売')}</div>
          <span class="badge ${badgeCls}">${label}</span>
        </div>
        <div class="sub" style="margin-top:4px;">${ORDER_TYPE_LABELS[o.orderType]} ・ 注文${fmtNum(o.qty)}株 ・ 約定${fmtNum(o.filledQty||0)}株 ・ 未約定${fmtNum(o.qty-(o.filledQty||0))}株</div>
        <div class="sub">${o.orderType==='limit'?`指値¥${fmtNum(o.limitPrice)}`:(o.orderType==='stop'?`逆指値¥${fmtNum(o.stopPrice)}`:(o.orderType==='oco'?`利確¥${fmtNum(o.limitPrice)}/損切¥${fmtNum(o.stopPrice)}`:'成行'))} ${st?`・ 現在値¥${fmtNum(st.price)}`:''}</div>
        <div class="sub">発注日:${fmtDateShort(o.createdDay)} ・ 有効期限:${fmtDateShort(o.createdDay+o.validityDays)}</div>
        ${o.status==='pending' ? `
          <div class="buy-sell-row" style="margin-top:8px; width:100%;">
            ${o.orderType!=='market' ? `<button class="btn btn-ghost btn-block btn-sm" data-modify-order="${o.id}">注文変更</button>` : ''}
            <button class="btn btn-red btn-block btn-sm" data-cancel-order="${o.id}">取消</button>
          </div>
        ` : ''}
      </div>
    `;}).join("") : `<div class="empty-state">注文はまだありません</div>`}
  `;
  modal.querySelector('#modal-close').onclick = closeModal;
  modal.querySelectorAll('[data-cancel-order]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('この注文を取り消しますか?')) return;
      const r = cancelOrder(b.dataset.cancelOrder);
      toast(r.msg); renderOrderManagementModal(); render();
    };
  });
  modal.querySelectorAll('[data-modify-order]').forEach(b=>{
    b.onclick = ()=>{ openOrderModifyModal(b.dataset.modifyOrder); };
  });
}
function openOrderModifyModal(orderId){ showModal(); renderOrderModifyModal(orderId); }
function renderOrderModifyModal(orderId){
  const order = state.pendingOrders.find(o=>o.id===orderId);
  const modal = document.getElementById('modal');
  if(!order || order.status!=='pending'){ modal.innerHTML=`<div class="modal-handle"></div><div class="empty-state">この注文は変更できません</div>`; return; }
  const st = state.stocks.find(s=>s.id===order.stockId);
  const remaining = order.qty-(order.filledQty||0);
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">注文変更</div><button class="modal-close" id="modal-close">✕</button></div>
    <div style="font-size:11px; color:var(--muted); margin-bottom:8px; font-family:var(--font-wide);">${st?st.name:''} ・ 現在値 ¥${fmtNum(st?st.price:0)}</div>
    <table class="dtable" style="margin-bottom:10px;">
      <tr><td>現在の注文</td><td>${order.orderType==='limit'?`¥${fmtNum(order.limitPrice)}`:(order.orderType==='stop'?`¥${fmtNum(order.stopPrice)}`:'-')} × ${fmtNum(remaining)}株</td></tr>
    </table>
    <div class="price-input-row"><label>数量</label>
      <div class="qty-stepper">
        <button class="qty-btn" id="mod-qty-minus">−</button>
        <input type="number" id="mod-qty-input" value="${remaining}" min="100" step="100">
        <button class="qty-btn" id="mod-qty-plus">+</button>
      </div>
    </div>
    ${order.orderType==='limit' ? `<div class="price-input-row"><label>指値価格</label><input type="number" id="mod-price-input" value="${order.limitPrice}"></div>` : ''}
    ${order.orderType==='stop' ? `<div class="price-input-row"><label>逆指値価格</label><input type="number" id="mod-price-input" value="${order.stopPrice}"></div>` : ''}
    <div id="mod-compare" style="font-size:11px; color:var(--muted); margin-top:10px; line-height:1.8; font-family:var(--font-wide);"></div>
    <div class="buy-sell-row" style="margin-top:14px;">
      <button class="btn btn-ghost btn-block" id="btn-modify-back">戻る</button>
      <button class="btn btn-cyan btn-block" id="btn-modify-submit">変更を確定</button>
    </div>
  `;
  modal.querySelector('#modal-close').onclick = ()=>{ openOrderManagementModal(); };
  modal.querySelector('#btn-modify-back').onclick = ()=>{ openOrderManagementModal(); };
  const qtyInput = modal.querySelector('#mod-qty-input');
  const priceInput = modal.querySelector('#mod-price-input');
  const compareEl = modal.querySelector('#mod-compare');
  const updateCompare = ()=>{
    const newQty = parseInt(qtyInput.value)||remaining;
    const newPrice = priceInput ? (parseFloat(priceInput.value)||(order.orderType==='limit'?order.limitPrice:order.stopPrice)) : null;
    const oldLabel = `${order.orderType==='limit'?`¥${fmtNum(order.limitPrice)}`:(order.orderType==='stop'?`¥${fmtNum(order.stopPrice)}`:'成行')} × ${fmtNum(remaining)}株`;
    const newLabel = `${newPrice!==null?`¥${fmtNum(newPrice)}`:'成行'} × ${fmtNum(newQty)}株`;
    compareEl.innerHTML = `現在<br><b style="color:var(--text);">${oldLabel}</b><br><br>変更後<br><b style="color:var(--cyan);">${newLabel}</b>`;
  };
  qtyInput.addEventListener('input', updateCompare);
  if(priceInput) priceInput.addEventListener('input', updateCompare);
  modal.querySelector('#mod-qty-minus').onclick = ()=>{ qtyInput.value=Math.max(TRADING_UNIT,(parseInt(qtyInput.value)||TRADING_UNIT)-TRADING_UNIT); updateCompare(); };
  modal.querySelector('#mod-qty-plus').onclick = ()=>{ qtyInput.value=(parseInt(qtyInput.value)||0)+TRADING_UNIT; updateCompare(); };
  updateCompare();
  modal.querySelector('#btn-modify-submit').onclick = ()=>{
    const changes = {qty: (order.filledQty||0)+(parseInt(qtyInput.value)||remaining)};
    if(priceInput){ if(order.orderType==='limit') changes.limitPrice=parseFloat(priceInput.value); if(order.orderType==='stop') changes.stopPrice=parseFloat(priceInput.value); }
    const r = modifyOrder(orderId, changes);
    toast(r.msg);
    if(r.ok){ openOrderManagementModal(); render(); }
  };
}

function renderModalTechnicalTab(st){
  const closes = st.history.map(c=>c.c);
  const rsi = computeRSI(closes);
  const macd = computeMACD(closes);
  const bb = computeBollinger(closes);
  const vwap = computeVWAP(st.history);
  const volProfile = computeVolumeProfile(st.history);
  const maxVol = Math.max(...volProfile.map(b=>b.vol),1);

  const rsiLabel = rsi==null ? "データ不足" : (rsi>=70 ? `${rsi.toFixed(0)}(買われすぎ)` : (rsi<=30 ? `${rsi.toFixed(0)}(売られすぎ)` : rsi.toFixed(0)));
  const macdLabel = macd==null ? "データ不足" : `${macd.macd.toFixed(1)} / シグナル${macd.signal.toFixed(1)} (${macd.histogram>=0?'強気':'弱気'})`;

  return `
    <table class="dtable">
      <tr><td>RSI(14)</td><td style="color:${rsi>=70?'var(--red)':(rsi<=30?'var(--green)':'var(--text)')}">${rsiLabel}</td></tr>
      <tr><td>MACD</td><td>${macdLabel}</td></tr>
      <tr><td>ボリンジャーバンド</td><td>${bb?`上${fmtNum(bb.upper)}/中${fmtNum(bb.mid)}/下${fmtNum(bb.lower)}`:"データ不足"}</td></tr>
      <tr><td>VWAP(20日)</td><td>${vwap?`¥${fmtNum(vwap)}(価格${st.price>=vwap?'上':'下'})`:"データ不足"}</td></tr>
      <tr><td>SMA5/SMA20</td><td>${st.smaPrevDiff==null?"データ不足":(st.smaPrevDiff>0?"ゴールデンクロス状態":"デッドクロス状態")}</td></tr>
    </table>
    <div style="height:12px;"></div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>価格帯別出来高</h2></div>
    <div style="padding:10px 0 0;">
      ${volProfile.slice().reverse().map(b=>`
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">
          <div style="width:64px; font-size:9px; color:var(--muted); font-family:var(--font); text-align:right;">¥${fmtNum(b.lo)}</div>
          <div style="flex:1; background:#10161f; height:10px;"><div style="height:100%; width:${(b.vol/maxVol*100).toFixed(0)}%; background:var(--cyan);"></div></div>
        </div>
      `).join("")}
    </div>
  `;
}

function showModal(){ document.getElementById('modal-overlay').classList.add('show'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); modalStockId=null; }
document.getElementById('modal-overlay').addEventListener('click',(e)=>{ if(e.target.id==='modal-overlay' && !blockModalDismiss) closeModal(); });

// スマホでの意図しないズームを防止する(viewport設定・CSSのtouch-actionに加えた保険)。
// gesturestart/change/end はSafari独自のピンチズームジェスチャーイベントで、click/touchendには一切影響しないため、
// ボタンのタップ・連打などゲーム操作を阻害することなく、ピンチズームだけを確実に無効化できる。
["gesturestart","gesturechange","gestureend"].forEach(evt=>{
  document.addEventListener(evt, (e)=>{ e.preventDefault(); }, {passive:false});
});

let toastTimer=null;
function toast(msg){
  if(!msg) return;
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2400);
}

function openTutorial(){ tutorialStep=0; renderTutorialStep(); showModal(); }
function renderTutorialStep(){
  const modal=document.getElementById('modal');
  const step=TUTORIAL_STEPS[tutorialStep];
  const isLast=tutorialStep===TUTORIAL_STEPS.length-1;
  const isFirst=tutorialStep===0;
  modal.innerHTML = `
    <div class="modal-handle"></div>

  modal.querySelector('#modal-close').onclick = closeTutorial;

  modal.querySelector('#tut-next').onclick = ()=>{ if(isLast) closeTutorial(); else { tutorialStep++; renderTutorialStep(); } };
}

/* ---------- 常時進行するゲームループ ---------- */
const BASE_INTERVAL = 10000; // 1x時、1日=10秒
let gameTimer=null;
function startGameLoop(){
  clearInterval(gameTimer);
  gameTimer = setInterval(()=>{
    advanceDay();
    const modalIsOpen = document.getElementById('modal-overlay').classList.contains('show');
    // 市場データの更新と画面の更新を分離する: モーダルが開いていても全体を再構築せず、
    // 価格など市場データに紐づく表示だけを軽量に更新し、入力中のフォームには一切触れない
    if(modalStockId && modalIsOpen){ refreshStockModalLive(); }
    // IPO新規発表時は、他のモーダルが開いていなければ専用ポップアップで知らせる
    if(state.ipoJustAnnounced && !document.getElementById('modal-overlay').classList.contains('show')){
      state.ipoJustAnnounced = false;
      openIpoAnnouncePopup();
    } else if(state.ipoJustAnnounced){
      state.ipoJustAnnounced = false; // 他の操作中だった場合はポップアップを見送り、タブの未読バッジのみで知らせる
    }
    // 脳汁演出(テンバガー達成・市場の伝説など)も、他のモーダルが開いていなければ専用ポップアップで知らせる
    if(state.pendingCelebrations && state.pendingCelebrations.length && !document.getElementById('modal-overlay').classList.contains('show')){
      openCelebrationModal();
    }
    render();
  }, BASE_INTERVAL/state.speed);
}
document.getElementById('btn-speed').addEventListener('click', ()=>{
  state.speed = state.speed===1?2:(state.speed===2?4:1);
  startGameLoop(); saveState(); renderTopbar();
});
document.getElementById('btn-help').addEventListener('click', ()=> openTutorial());
document.getElementById('btn-reset').addEventListener('click', ()=>{ openSettingsModal(); });

   デバッグモード(開発・検証専用。通常モードのセーブデータとは完全に分離される)
   ========================================================================== */
function applyDebugDefaults(){
  state.cash = 100_000_000_000_000; // 100兆円
  state.reservedCash = 0;
  state.investorLevel = 100;
  state.investorXP = xpForLevel(100);
  state.companyFounded = true;
  state.brokerage.unlocked = true;
  state.brokerage.customers = 1000;
  state.brokerage.brokerageAUM = 50_000_000_000;
  state.brokerage.reputation = 90;
  state.fund.active = true;
  state.fund.aum = 10_000_000_000;
  state.fund.reputation = 90;
  state.departments.research.level = DEPT_DEFS.research.maxLevel;
  state.departments.trading.level = DEPT_DEFS.trading.maxLevel;
  state.departments.info.level = DEPT_DEFS.info.maxLevel;
  state.ai.unlocked = true;
  state.ai.level = 10;
  if(!state.investmentTheme) state.investmentTheme = "diversified";
  if(!state.discoveries.length) state.discoveries.push({name:"デバッグ初期実績", multiple:"5.0", day:state.day, type:"5x"});
  if(!state.stats.fiveBaggers) state.stats.fiveBaggers = 1;
  pushNews("デバッグモードが有効化されました。すべての機能が解放されています。", {stars:1, kind:"confirmed", category:"company", type:"good"});
}
async function enableDebugMode(){
  isDebugMode = true;
  const result = await loadState(); // isDebugMode切替後なので、デバッグ専用のセーブ領域(別キー)を参照する
  if(result.ok){
    state = result.data; // 既存のデバッグセーブがあれば、それを再開する(再起動時などに毎回リセットしない)
  } else {
    state = initState();
    applyDebugDefaults(); // デバッグセーブが存在しない場合のみ、初回のデバッグ用初期値を適用する
  }
  migrateState();
  await saveState();
  closeModal();
  render();
  startGameLoop();
}
async function disableDebugMode(){
  isDebugMode = false;
  const result = await loadState(); // 通常モードのセーブ領域に戻る(デバッグ中の変更は一切影響しない)
  state = result.ok ? result.data : initState();
  migrateState();
  closeModal();
  render();
  startGameLoop();
}

function debugSetCash(amount){ state.cash = Math.max(0, amount); saveState(); }
function debugSetLevel(level){ state.investorLevel = clamp(Math.round(level),1,100); state.investorXP = xpForLevel(state.investorLevel); saveState(); }
function debugSkipDays(n){
  for(let i=0;i<n;i++) advanceDay();
  render();
}
function debugForceIPO(){
  if(state.pendingIpo) return {ok:false, msg:"すでに募集中のIPOがあります"};
  state.nextIpoDay = state.day + 14;
  announceIPO();
  return state.pendingIpo ? {ok:true, msg:"IPOイベントを強制発生させました"} : {ok:false, msg:"上場候補が尽きています"};
}
function debugForceNews(){
  const kind = pick(["macro","material","rumor","institutional"]);
  if(kind==="macro") spawnMacroNews();
  else if(kind==="material"){ const ev = buildMaterialNewsEvent(); pushNews(ev.text, {stars:ev.stars, kind:"confirmed", category:"material", stockId:ev.stockId, type:ev.type, impactPct:ev.impactPct}); }
  else if(kind==="rumor") spawnRumor();
  else { const ev = buildInstitutionalEvent(); pushNews(ev.text, ev.opts); }
  return {ok:true, msg:"ニュースイベントを強制発生させました"};
}
function debugSetRegime(regimeKey){
  if(!REGIME_LABELS[regimeKey]) return {ok:false, msg:"不正な市場サイクルです"};
  state.marketRegime = regimeKey;
  const [lo,hi] = REGIME_DURATION[regimeKey];
  state.regimeDaysLeft = randInt(lo,hi);
  saveState();
  return {ok:true, msg:`市場サイクルを「${REGIME_LABELS[regimeKey]}」に変更しました`};
}
function debugSetEconomy(value){ state.macro.economy = clamp(value,0,100); saveState(); return {ok:true, msg:"景気サイクルを変更しました"}; }
function debugAdjustStock(stockId, field, delta){
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  if(field==="revenue") st.revenue = Math.max(1e6, st.revenue*(1+delta));
  if(field==="profit") st.profit = st.profit*(1+delta) + (st.profit===0?delta*1e6:0);
  if(field==="growth") st.growth = clamp(st.growth+delta*100, -20, 80);
  if(field==="quality") st.quality = clamp(st.quality+delta, 0, 1);
  saveState();
  return {ok:true, msg:`${st.name}の企業業績を変更しました`};
}
function debugForceListing(){
  const usedIds = new Set(state.stocks.map(s=>s.id));
  const candidates = IPO_POOL.filter(c=>!usedIds.has(c.id) && !isRecentlyRetired(c.id));
  if(!candidates.length) return {ok:false, msg:"上場可能な候補がありません"};
  const def = pick(candidates);
  const newStock = makeRuntimeStock(def, state.day+1);
  state.stocks.push(newStock);
  pushNews(`[DEBUG] ${newStock.name}を強制上場させました`, {stars:1, kind:"confirmed", category:"ipo", stockId:newStock.id, type:"good"});
  saveState();
  return {ok:true, msg:`${newStock.name}を強制上場させました`};
}
function debugForceDelist(stockId){
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  const name = st.name;
  finalizeDelisting(st);
  return {ok:true, msg:`${name}を強制上場廃止させました`};
}

// セーブデータをJSON形式でダウンロードする(バックアップ)
function exportSaveDataAsJSON(){
  try{
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `stock-game-save-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("セーブデータを書き出しました");
  } catch(e){ toast("バックアップの書き出しに失敗しました"); }
}
// JSONファイルからセーブデータを復元する。形式検証・バージョン確認・マイグレーション・復元前バックアップを行う
async function importSaveDataFromFile(file){
  let text;
  try{ text = await file.text(); } catch(e){ return {ok:false, msg:"ファイルの読み込みに失敗しました"}; }
  let parsed;
  try{ parsed = JSON.parse(text); } catch(e){ return {ok:false, msg:"JSON形式が正しくありません"}; }
  if(!validateSaveDataShape(parsed)) return {ok:false, msg:"セーブデータの形式が不正です。復元を中止しました"};
  // 復元前に、現在のデータを保護するためバックアップを取る(通常モードの共有バックアップ枠をデバッグデータで汚染しないようにする)
  if(!isDebugMode){
    try{ await storageSet(BACKUP_STORAGE_KEY, JSON.stringify(state)); } catch(e){ /* バックアップ失敗は復元自体は続行する */ }
  }
  state = parsed;
  migrateState(); // saveDataVersionの確認・不足フィールドの補完(必要なマイグレーション)
  await saveState();
  return {ok:true, msg:"セーブデータを復元しました"};
}
// セーブデータを削除して新規ゲームを開始する(削除前に自動バックアップを作成する)
async function deleteSaveDataAndRestart(){
  if(!isDebugMode){
    try{ await storageSet(BACKUP_STORAGE_KEY, JSON.stringify(state)); } catch(e){ /* バックアップ失敗しても削除は続行する */ }
  }
  await storageDelete(currentStorageKey());
  state = initState();
  migrateState();
  await saveState();
  render();
  startGameLoop();
  closeModal();
  toast("セーブデータを削除し、新しいゲームを開始しました(削除前のデータはバックアップに保存されています)");
  openTutorial();
}
