// ==========================================================================
// オフライン・キャッチアップシミュレーション
// (「ブラウザを開いていない間も本物のサーバーで処理が動き続ける」ことは、window.storage/localStorage
//  しか持たないこのアーキテクチャでは実現できない。代わりに、実世界の経過時間を最後の保存時刻から算出し、
//  再訪時にその分のゲーム内日数を一括シミュレーションすることで、同等のプレイ体験を実現する)
// ==========================================================================
const OFFLINE_HOURS_PER_GAME_DAY = 1; // 現実の1時間 = ゲーム内1日 に相当する換算レート
const OFFLINE_MAX_CATCHUP_DAYS = 365; // 1回のキャッチアップで詳細シミュレーションする上限日数(処理が重くならないようにする)
function runOfflineCatchup(){
  if(!state.lastWallClockTime){
    state.lastWallClockTime = new Date().toISOString();
    return null; // 初回起動時は経過時間を計算しない
  }
  const lastTime = new Date(state.lastWallClockTime).getTime();
  const now = Date.now();
  const elapsedMs = Math.max(0, now - lastTime);
  const elapsedHours = elapsedMs/1000/60/60;
  if(elapsedHours < 0.05){ // 数分未満の再読み込み等は無視する
    state.lastWallClockTime = new Date().toISOString();
    return null;
  }
  let gameDaysToSimulate = Math.floor(elapsedHours/OFFLINE_HOURS_PER_GAME_DAY);
  let capped = false;
  if(gameDaysToSimulate > OFFLINE_MAX_CATCHUP_DAYS){ gameDaysToSimulate = OFFLINE_MAX_CATCHUP_DAYS; capped = true; }
  if(gameDaysToSimulate<=0){
    state.lastWallClockTime = new Date().toISOString();
    return null;
  }

  const dayBeforeCatchup = state.day;
  const nwBefore = netWorth();
  const nikkeiBefore = state.nikkei;
  const portfolioSnapshot = {};
  Object.keys(state.portfolio).forEach(id=>{ portfolioSnapshot[id]=state.portfolio[id].shares; });
  const priceSnapshot = {};
  state.stocks.forEach(s=>{ priceSnapshot[s.id]=s.price; });
  const marginPositionIdsBefore = new Set(state.marginPositions.map(p=>p.id));
  const marginCallBefore = !!state.marginCall;

  suppressAutoSave = true;

  for(let i=0;i<gameDaysToSimulate;i++){
    try{ advanceDay(); } catch(e){ console.error("オフラインシミュレーション中にエラーが発生しました:", e); break; }
  }
  suppressAutoSave = false;

  state.lastWallClockTime = new Date().toISOString();
  saveState(); // ここで初めて実際に1回だけ保存する

  const nwAfter = netWorth();
  // 経過中に発生したニュースは「日付がキャッチアップ開始日より後」のものとして正確に抽出する(配列の上限による古い記事の消失に影響されない)
  const offlineNews = state.news.filter(n=>n.day>dayBeforeCatchup);
  const holdingIds = new Set(Object.keys(portfolioSnapshot));
  const ventureStockIds = new Set(state.ventures.filter(v=>v.listedStockId).map(v=>v.listedStockId));
  const highlightNews = offlineNews.filter(n=> n.stars>=4 || (n.stockId && (holdingIds.has(n.stockId)||ventureStockIds.has(n.stockId)))).slice(0,15);

  const movers = Object.keys(portfolioSnapshot).map(id=>{
    const st = state.stocks.find(s=>s.id===id);
    if(!st || !priceSnapshot[id]) return null;
    return {name:st.name, pct:(st.price/priceSnapshot[id]-1)*100};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,5);

  const newMarginPositions = state.marginPositions.filter(p=>!marginPositionIdsBefore.has(p.id)).length;
  const marginCallOccurred = !marginCallBefore && (!!state.marginCall || offlineNews.some(n=>n.category==='margin'));

  return {
    elapsedMs, elapsedHours, gameDaysSimulated: gameDaysToSimulate, capped,
    dayBeforeCatchup, dayAfter: state.day,
    nwBefore, nwAfter, nwChange: nwAfter-nwBefore,
    nikkeiBefore, nikkeiAfter: state.nikkei, nikkeiChangePct: nikkeiBefore>0 ? (state.nikkei/nikkeiBefore-1)*100 : 0,
    highlightNews, movers, totalNewsCount: offlineNews.length,
    newMarginPositions, marginCallOccurred,
  };
}
function formatElapsedTime(ms){
  const totalMinutes = Math.floor(ms/1000/60);
  const days = Math.floor(totalMinutes/60/24);
  const hours = Math.floor((totalMinutes/60)%24);
  const minutes = totalMinutes%60;
  if(days>0) return `${days}日${hours}時間${minutes}分`;
  if(hours>0) return `${hours}時間${minutes}分`;
  return `${minutes}分`;
}
function openOfflineSummaryModal(summary){
  showModal();
  const modal = document.getElementById('modal');
  const nwSign = summary.nwChange>=0 ? '+' : '';
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <div style="text-align:center; padding:14px 0 8px;">
      <div style="font-size:15px; font-weight:800; font-family:var(--font-wide);">あなたが不在の間に起きたこと</div>
      <div style="font-size:11px; color:var(--muted); margin-top:6px; font-family:var(--font-wide);">経過時間 ${formatElapsedTime(summary.elapsedMs)} ・ ゲーム内${fmtNum(summary.gameDaysSimulated)}日分をシミュレーションしました</div>
      ${summary.capped ? `<div style="font-size:10px; color:var(--amber); margin-top:4px; font-family:var(--font-wide);">※長期間の不在のため、直近${OFFLINE_MAX_CATCHUP_DAYS}日分のみ詳細にシミュレーションしています</div>` : ''}
    </div>
    <table class="dtable">
      <tr><td>📈 日経平均</td><td style="color:${summary.nikkeiChangePct>=0?'var(--green)':'var(--red)'};">${fmtPct(summary.nikkeiChangePct)}</td></tr>
      <tr><td>💰 あなたの総資産</td><td style="color:${summary.nwChange>=0?'var(--green)':'var(--red)'};">${nwSign}${fmtYen(summary.nwChange)}</td></tr>
      ${summary.movers.map(m=>`<tr><td>${m.pct>=0?'🔥':'⚠'} ${m.name}</td><td style="color:${m.pct>=0?'var(--green)':'var(--red)'};">${fmtPct(m.pct)}</td></tr>`).join("")}
      ${summary.newMarginPositions>0 ? `<tr><td>📋 信用取引</td><td>新規建玉 ${summary.newMarginPositions}件</td></tr>` : ''}
      ${summary.marginCallOccurred ? `<tr><td>⚠ 追証</td><td style="color:var(--red);">発生しています</td></tr>` : ''}
    </table>
    <div style="height:10px;"></div>
    <div class="sec-head" style="margin:0 -14px; padding:8px 14px;"><h2>主なニュース</h2><span class="sub">全${summary.totalNewsCount}件</span></div>
    ${summary.highlightNews.length ? summary.highlightNews.map(n=>`
      <div class="row" style="cursor:default;">
        <div class="row-left"><div class="nm" style="font-size:11.5px; line-height:1.5;">${n.text}</div><div class="sub">${fmtDateShort(n.day)}</div></div>
      </div>
    `).join("") : `<div class="empty-state">大きな出来事はありませんでした</div>`}
    <div style="height:14px;"></div>
    <button class="btn btn-cyan btn-block" id="btn-offline-summary-close">閉じる</button>
  `;
  modal.querySelector('#btn-offline-summary-close').onclick = ()=>{ closeModal(); if(!state.tutorialSeen) openTutorial(); };
}

async function boot(){
  const result = await loadState();
  if(result.ok){
    state = result.data;
    if(result.restoredFromBackup){
      setTimeout(()=>toast("メインのセーブデータが読み込めなかったため、直近のバックアップから復元しました"), 800);
    }
  } else if(result.hadRawData){
    // データは存在したが、メイン・バックアップともに検証に失敗した場合のみユーザーに通知する(いきなり初期化しない)
    state = initState();
    setTimeout(()=>{
      alert("セーブデータの読み込みに失敗しました。データが破損している可能性があります。\n新しいゲームとして開始しますが、元のデータはストレージ上に残っている場合があります。");
    }, 800);
  } else {
    // 本当に初回起動(セーブデータが存在しない)
    state = initState();
  }
  migrateState();
  const offlineSummary = runOfflineCatchup();
  render();
  startGameLoop();
  startPeriodicAutosave();
  if(needsPlayerName()) openPlayerNameModal();
  else if(offlineSummary) openOfflineSummaryModal(offlineSummary);
  else if(!state.tutorialSeen) openTutorial();
}
// 読み込んだセーブデータに不足しているフィールドを補完する(通常モード・デバッグモード共通で利用)
// 既存の値は一切上書きしない。「存在しない項目にだけデフォルト値を設定する」方式を徹底する。
function migrateState(){
  runSaveVersionMigrations();
  if(state.playerName===undefined) state.playerName="";
  if(state.investCompanyName===undefined) state.investCompanyName = state.companyFounded ? `${state.playerName||"プレイヤー"}キャピタル` : null;
  if(state.brokerage && state.brokerage.unlocked && !state.brokerage.name) state.brokerage.name = `${state.playerName||"プレイヤー"}証券`;
  if(!state.orderHistory) state.orderHistory=[];
  if(!state.pendingRumors) state.pendingRumors=[];
  if(!state.pendingOrders) state.pendingOrders=[];
  else state.pendingOrders.forEach(o=>{
    if(o.filledQty===undefined) o.filledQty = o.status==="filled" ? o.qty : 0;
    if(o.tradeCategory===undefined) o.tradeCategory = "spot";
    if(o.marginAction===undefined) o.marginAction = null;
    if(o.positionId===undefined) o.positionId = null;
  });
  if(state.reservedCash===undefined) state.reservedCash=0;
  if(!state.nikkei) state.nikkei=65000;
  if(!state.nikkeiHistory) state.nikkeiHistory=[{o:state.nikkei||65000,h:state.nikkei||65000,l:state.nikkei||65000,c:state.nikkei||65000,day:state.day}];
  if(state.nikkeiHistory.length && typeof state.nikkeiHistory[0]==="number"){
    // 旧形式(終値のみの配列)を簡易的にOHLC形式へ変換する
    state.nikkeiHistory = state.nikkeiHistory.map((v,i,arr)=>{
      const o = i>0 ? arr[i-1] : v;
      return {o, h:Math.max(o,v), l:Math.min(o,v), c:v, day:i+1};
    });
  }
  if(!state.nasdaq) state.nasdaq=15000;
  if(!state.nasdaqHistory) state.nasdaqHistory=[15000];
  if(!state.marketRegime) state.marketRegime="range";
  if(state.regimeDaysLeft===undefined) state.regimeDaysLeft=randInt(25,55);
  if(!state.macro) state.macro={economy:55, rate:1.0, inflation:1.5, sentiment:0, overseas:0};
  if(state.macro.overseas===undefined) state.macro.overseas=0;
  if(state.macro.fx===undefined) state.macro.fx=0;
  if(!state.nikkeiBaseline) state.nikkeiBaseline = state.nikkei || 65000;
  if(!state.departments) state.departments={ research:{level:0}, trading:{level:0}, info:{level:0} };
  if(!state.theme) state.theme=pickInitialTheme();
  if(!state.foundedDateISO) state.foundedDateISO = new Date(Date.now() - (state.day-1)*86400000).toISOString();
  if(!state.candidates || !state.candidates.length) state.candidates=freshCandidates();
  if(state.pendingRealizedPL===undefined) state.pendingRealizedPL=0;
  if(!state.speed) state.speed=1;
  if(state.tutorialSeen===undefined) state.tutorialSeen=false;
  if(state.milestoneIndex===undefined) state.milestoneIndex=0;
  if(state.ipoCounter===undefined) state.ipoCounter=0;
  if(!state.nextIpoDay) state.nextIpoDay = state.day + randInt(280,365);
  if(state.pendingIpo===undefined) state.pendingIpo=null;
  if(state.ipoUnread===undefined) state.ipoUnread=0;
  if(state.ipoJustAnnounced===undefined) state.ipoJustAnnounced=false;
  if(!state.ventures) state.ventures=[];
  if(!state.rivals || !state.rivals.length) state.rivals=generateRivals();
  if(state.activeTob===undefined) state.activeTob=null;
  if(!state.pendingBoardReactions) state.pendingBoardReactions=[];
  if(!state.esportsTitles) state.esportsTitles = ESPORTS_TITLES_INITIAL.map(t=>({...t}));
  if(!state.marginAccount) state.marginAccount={opened:false, openedDay:null};
  if(!state.marginPositions) state.marginPositions=[];
  if(state.marginCall===undefined) state.marginCall=null;
  if(!state.globalCompanies || !state.globalCompanies.length) state.globalCompanies=generateGlobalCompanies();
  else state.globalCompanies.forEach(g=>{
    // 旧バージョン(単純ランダムウォーク方式)のデータを、新しい理論企業価値ベースの構造へ安全に移行する
    if(g.revenue===undefined){
      // 破損・異常値化している可能性のあるcapCurrentではなく、安定した設計時点の値(baseCap)から補完する
      const impliedProfit = Math.max(1e9, (g.baseCap||1e12)/15);
      g.baseRevenue = g.baseRevenue!==undefined ? g.baseRevenue : impliedProfit*6;
      g.baseProfit = g.baseProfit!==undefined ? g.baseProfit : impliedProfit;
      g.revenue = g.baseRevenue;
      g.profit = impliedProfit;
      g.growth = g.growth!==undefined ? g.growth : rand(3,10);
      g.quality = g.quality!==undefined ? g.quality : rand(0.45,0.65);
      g.stage = g.stage||"mature";
      g.bornDay = g.bornDay||1;
      g.deathDay = g.deathDay!==undefined ? g.deathDay : null;
      g.sector = g.sector||"製造業";
      g.id = g.id || ("gc_legacy_"+g.name);
      // 旧データの時価総額が異常値になっている場合は、理論企業価値まで安全に補正する(既存の相対順位はできるだけ尊重する)
      const fv = globalCompanyFairValue(g);
      if(!isFinite(g.capCurrent) || g.capCurrent<=0 || g.capCurrent > fv*50){
        g.capCurrent = fv;
      }
    }
  });
  if(!state.legendaryFeats) state.legendaryFeats={tenbagger:false, oku100:false, oku1000:false, ipoSuccess:false, worldClassCompany:false, marketDominator:false};
  if(!state.pendingCelebrations) state.pendingCelebrations=[];
  state.ventures.forEach(v=>{
    if(v.cashBalance===undefined) v.cashBalance = Math.round((v.investedCapital||0)*0.15);
    if(v.marketShare===undefined) v.marketShare = rand(1,8);
    if(v.brand===undefined) v.brand = rand(20,40);
    if(!v.executives) v.executives = {ceo:null,cfo:null,cto:null,coo:null};
    if(v.rdTheme===undefined) v.rdTheme = null;
    if(v.rdSpend===undefined) v.rdSpend = 0;
    if(!v.productPipeline) v.productPipeline = [];
    if(v.patents===undefined) v.patents = 0;
    if(!v.overseasRegions) v.overseasRegions = [];
    if(v.lastBoardMeetingDay===undefined) v.lastBoardMeetingDay = state.day;
    if(v.lastShareholderMeetingDay===undefined) v.lastShareholderMeetingDay = state.day;
    if(v.isFounded===undefined) v.isFounded = false;
    if(v.founder===undefined) v.founder = state.playerName||"プレイヤー";
    if(v.philosophy===undefined) v.philosophy = "";
    if(v.hq===undefined) v.hq = "東京";
    if(v.incomingOffer===undefined) v.incomingOffer = null;
    if(v.incomingHostileTob===undefined) v.incomingHostileTob = null;
    if(v.dividendPayoutRatio===undefined) v.dividendPayoutRatio = 0.15;
    if(!v.alliances) v.alliances = [];
    if(!v.sportsTeams) v.sportsTeams = [];
    if(!v.newBusinesses) v.newBusinesses = [];
    if(!v.history) v.history = [{day:v.acquireDay||1, text:`${v.name}を${ventureMethodLabel(v)}(投資額${fmtYen(v.investedCapital||0)})`}];
  });
  if(state.acquisitionsUnlockNotified===undefined) state.acquisitionsUnlockNotified=false;
  if(state.pendingIpo && state.pendingIpo.phase===undefined){
    // 旧仕様(単純な予告のみ)のIPO予定はデータ形式が異なるためリセットして組み直す
    state.pendingIpo = null;
    state.nextIpoDay = state.day + randInt(280,365);
  }
  if(!state.retiredStockIds) state.retiredStockIds=[];
  if(state.investorXP===undefined) state.investorXP=0;
  if(state.investorLevel===undefined) state.investorLevel=1;
  if(!state.stats) state.stats={ realizedProfit:0, realizedLoss:0, totalTrades:0, winTrades:0, ipoProfit:0, ipoLoss:0, maxDrawdown:0, peakNetWorth:netWorth(), tenBaggers:0, fiveBaggers:0 };
  if(!state.discoveries) state.discoveries=[];
  if(state.investmentTheme===undefined) state.investmentTheme=null;
  if(!state.scoutReports) state.scoutReports=[];
  if(state.lastScoutDay===undefined) state.lastScoutDay=0;
  if(state.companyFounded===undefined) state.companyFounded=false;
  if(!state.brokerage) state.brokerage={ unlocked:false, customers:0, brokerageAUM:0, feeIncome:0, reputation:50 };
  if(!state.themeFunds) state.themeFunds={};
  if(!state.pendingBoardDecisions) state.pendingBoardDecisions=[];
  state.stocks.forEach(st=>{
    if(st.daysUntilEarnings===undefined) st.daysUntilEarnings=randInt(6,st.ecMax||40);
    if(st.earningsCycle===undefined) st.earningsCycle=randInt(st.ecMin||28,st.ecMax||42);
    if(st.smaPrevDiff===undefined) st.smaPrevDiff=null;
    if(!st.crossLog) st.crossLog=[];
    if(st.quality===undefined) st.quality=0.5;
    if(!st.themeTags) st.themeTags=[];
    if(st.listedDay===undefined) st.listedDay=1;
    if(st.equity===undefined) st.equity=st.profit/0.12;
    if(st.pendingMomentumPct===undefined) st.pendingMomentumPct=0;
    if(st.stopStreak===undefined) st.stopStreak=0;
    if(st.attentionBoostDays===undefined) st.attentionBoostDays=0;
    if(!st.desc) st.desc="";
    if(!st.disclosures) st.disclosures=[];
    if(!st.earningsLog) st.earningsLog=[];
    if(st.equityRatio===undefined) st.equityRatio=rand(0.30,0.70);
    if(st.floatRatio===undefined) st.floatRatio=rand(0.35,0.75);
    if(st.playerNetDemand===undefined) st.playerNetDemand=0;
    if(st.moodDrift===undefined) st.moodDrift=0;
    if(!st.shareholders) st.shareholders = null; // 初回アクセス時に生成される
    if(st.marginBuyOutstanding===undefined) st.marginBuyOutstanding = Math.round(st.shares*0.01);
    if(st.marginSellOutstanding===undefined) st.marginSellOutstanding = Math.round(st.shares*0.005);
    if(!st.boardPosts) st.boardPosts=[];
  });
}
boot();
</script>
