// 参入難易度(0=参入しやすい 〜 1=参入しにくい)。自社の既存テーマとの重なりで判定する
function computeBusinessEntryDifficulty(v, sectorKey){
  const sector = NEW_BUSINESS_SECTORS.find(s=>s.key===sectorKey);
  if(!sector) return 0.7;
  const overlap = (v.themeTags||[]).some(t=>sector.relatedTags.includes(t));
  return overlap ? 0.28 : 0.62;
}
function canStartNewBusiness(v, sectorKey){
  if(!v || (v.stage!=="private" && v.stage!=="listed")) return {ok:false, msg:"この企業では新規事業を開始できません"};
  if(!NEW_BUSINESS_SECTORS.find(s=>s.key===sectorKey)) return {ok:false, msg:"不正な事業分野です"};
  if((v.newBusinesses||[]).some(b=>b.sectorKey===sectorKey && b.stage!=="failed")) return {ok:false, msg:"すでにこの分野に参入しています"};
  return {ok:true};
}
// プレイヤー自身の資金を経営中の企業へ追加出資する(業績不振企業を立て直すための資金注入。企業自身のキャッシュフローに頼らない)
function injectCapitalIntoVenture(ventureId, amount){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || (v.stage!=="private" && v.stage!=="listed")) return {ok:false, msg:"この企業には出資できません"};
  if(!amount || amount<=0) return {ok:false, msg:"金額を入力してください"};
  if(availableCash()<amount) return {ok:false, msg:"資金が不足しています"};
  state.cash -= amount;
  v.cashBalance = (v.cashBalance||0) + amount;
  v.cumulativeInvestment = (v.cumulativeInvestment||0) + amount;
  pushNews(`${state.playerName||"プレイヤー"}が${v.name}へ${fmtYen(amount)}の追加出資を行った。`, {stars:2, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
  saveState();
  return {ok:true, msg:`${fmtYen(amount)}を出資しました`};
}
function startNewBusiness(ventureId, sectorKey, investAmount){
  const v = state.ventures.find(x=>x.id===ventureId);
  const check = canStartNewBusiness(v, sectorKey);
  if(!check.ok) return check;
  if(!investAmount || investAmount<=0) return {ok:false, msg:"投資額を入力してください"};
  if((v.cashBalance||0) < investAmount) return {ok:false, msg:"企業の現金が不足しています"};
  const sector = NEW_BUSINESS_SECTORS.find(s=>s.key===sectorKey);
  v.cashBalance -= investAmount;
  const difficulty = computeBusinessEntryDifficulty(v, sectorKey);
  // 投資額が大きいほど、また自社の地力(quality)が高いほど成功確率が上がる。参入難易度が高い分野ほど下がる
  const successProb = clamp(0.55 - difficulty*0.3 + clamp(investAmount/2e9,0,0.15) + ((v.quality||0.5)-0.5)*0.3, 0.1, 0.85);
  const biz = {
    id:"nb"+Date.now()+randInt(0,999), sectorKey, label:sector.label, stage:"concept",
    investedAmount:investAmount, cumulativeInvestment:investAmount, revenue:0, profit:0,
    successProb, competitorStrength: rand(0.3,0.8), difficulty,
    startDay: state.day, lastUpdateDay: state.day,
  };
  if(!v.newBusinesses) v.newBusinesses=[];
  v.newBusinesses.push(biz);
  if(!v.history) v.history=[];
  v.history.push({day:state.day, text:`${sector.label}分野への新規事業参入を決定(投資額${fmtYen(investAmount)})`});
  pushNews(`${v.name}が${sector.label}分野への新規事業参入を発表した。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
  saveState();
  return {ok:true, msg:"新規事業を開始しました"};
}
// 新規事業への追加投資(成功確率を高める・段階の進行を後押しする)
function investInNewBusiness(ventureId, businessId, amount){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v) return {ok:false, msg:"対象企業が見つかりません"};
  const biz = (v.newBusinesses||[]).find(b=>b.id===businessId);
  if(!biz || biz.stage==="failed" || biz.stage==="mature") return {ok:false, msg:"この事業には追加投資できません"};
  if((v.cashBalance||0) < amount) return {ok:false, msg:"企業の現金が不足しています"};
  v.cashBalance -= amount;
  biz.cumulativeInvestment += amount;
  biz.successProb = clamp(biz.successProb + clamp(amount/3e9,0,0.12), 0.1, 0.9);
  saveState();
  return {ok:true, msg:"追加投資を実施しました(成功確率が向上)"};
}
// 新規事業の段階を進める(構想→研究開発→試験運用→サービス開始→成長期→成熟期、または失敗して撤退)
function updateNewBusinesses(v){
  if(!v.newBusinesses || !v.newBusinesses.length) return;
  const t = ventureTarget(v);
  const stageDuration = {concept:45, rd:120, trial:90, launch:75, growth:180};
  v.newBusinesses.forEach(biz=>{
    if(biz.stage==="failed" || biz.stage==="mature") return;
    const elapsed = state.day - biz.lastUpdateDay;
    if(elapsed < (stageDuration[biz.stage]||999999)){
      if(biz.stage!=="concept"){
        // 育成中は投資額に応じたわずかな維持コストが発生する(赤字を垂れ流す段階)
        v.cashBalance = Math.max(0, (v.cashBalance||0) - biz.investedAmount*0.0008);
      }
      return;
    }
    biz.lastUpdateDay = state.day;
    if(biz.stage==="concept"){ biz.stage="rd"; return; }
    if(biz.stage==="rd"){
      if(Math.random()<biz.successProb){ biz.stage="trial"; }
      else {
        biz.stage="failed";
        if(!v.history) v.history=[];
        v.history.push({day:state.day, text:`${biz.label}事業は研究開発段階で断念した`});
        pushNews(`${v.name}の${biz.label}事業は研究開発段階で断念された。投資額の回収は困難な見通し。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
      }
      return;
    }
    if(biz.stage==="trial"){
      biz.stage="launch";
      biz.revenue = biz.investedAmount*0.05;
      pushNews(`${v.name}の${biz.label}事業がサービスを開始した。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
      return;
    }
    if(biz.stage==="launch"){
      // 競合との競争を経て、成長軌道に乗るか撤退に追い込まれるかが決まる
      const competitionRoll = Math.random();
      if(competitionRoll < (1-biz.competitorStrength)*0.7+0.15){
        biz.stage="growth";
        biz.revenue = biz.investedAmount*0.15;
        biz.profit = biz.revenue*rand(0.05,0.15);
        if(!v.history) v.history=[];
        v.history.push({day:state.day, text:`${biz.label}事業が成長軌道に乗った`});
        pushNews(`【新規事業成功】${v.name}の${biz.label}事業が急成長を始めた。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
        queueCelebration("新規事業成功!", `${v.name}が立ち上げた${biz.label}事業が軌道に乗った。`);
      } else {
        biz.stage="failed";
        if(!v.history) v.history=[];
        v.history.push({day:state.day, text:`${biz.label}事業は競合に敗れ撤退した`});
        pushNews(`${v.name}の${biz.label}事業は競合に敗れ、撤退を余儀なくされた。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
      }
      return;
    }
    if(biz.stage==="growth"){
      biz.revenue *= rand(1.15,1.5);
      biz.profit = biz.revenue*rand(0.05,0.2);
      // 会社全体の業績への影響は、過度に大きくならないよう一部だけを反映する
      t.revenue += biz.revenue*0.3;
      t.profit += biz.profit*0.3;
      if(Math.random()<0.15) biz.stage="mature";
    }
  });
}
// 事業撤退(手動): 育成中・成長中の新規事業から任意のタイミングで撤退する
function divestNewBusiness(ventureId, businessId){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v) return {ok:false, msg:"対象企業が見つかりません"};

  return {ok:true, msg:"事業を撤退しました"};
}

   ========================================================================== */
const ALLIANCE_TYPES = {
  business:  {label:"業務提携", desc:"事業運営面での協力関係を築く"},
  tech:      {label:"技術提携", desc:"技術力・研究開発力を高め合う"},
  capital:   {label:"資本提携", desc:"互いに株式を持ち合い関係を強化する(M&Aへの布石にもなる)"},
  rd:        {label:"共同研究", desc:"新技術・新製品を共同開発する"},
  sales:     {label:"販売提携", desc:"互いの販売網・市場シェアを活用する"},
  overseas:  {label:"海外提携", desc:"海外市場への進出を協力して進める"},
};
// 提携候補企業の一覧(自社が経営していない独立した公開企業から抽出する)
function getAlliancePartnerCandidates(){
  return state.stocks.filter(s=>!state.ventures.some(v=>v.listedStockId===s.id)).map(s=>({
    id:s.id, name:s.name, sector:s.sector,
    techScore: Math.round(s.quality*100), salesScore: Math.round(clamp((s.floatRatio||0.5)*60+s.quality*40,10,95)),
    capitalScore: Math.round(clamp(Math.log10(Math.max(1,s.price*s.shares))*8,10,95)),
    overseasScore: Math.round(clamp(s.growth*3+30,10,90)),
  }));
}
function proposeAlliance(ventureId, partnerId, allianceType, terms){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || (v.stage!=="private" && v.stage!=="listed")) return {ok:false, msg:"この企業は提携を結べません"};
  if(!ALLIANCE_TYPES[allianceType]) return {ok:false, msg:"不正な提携種別です"};
  if(!v.alliances) v.alliances=[];
  if(v.alliances.some(a=>a.partnerId===partnerId && a.active)) return {ok:false, msg:"すでにこの企業と提携しています"};
  const exclusive = !!(terms&&terms.exclusive);
  if(exclusive && v.alliances.some(a=>a.active && a.exclusive)) return {ok:false, msg:"独占提携中は他社との新たな提携を結べません"};
  const partner = state.stocks.find(s=>s.id===partnerId);
  if(!partner) return {ok:false, msg:"提携先が見つかりません"};
  const ownStake = clamp((terms&&terms.ownStake)!==undefined ? terms.ownStake : 50, 10, 90);
  const successProb = clamp(0.55 + (v.quality-0.5)*0.3 + (ownStake>=40&&ownStake<=60?0.05:-0.05), 0.15, 0.85);
  const success = Math.random()<successProb;
  if(!success){
    pushNews(`${v.name}は${partner.name}との${ALLIANCE_TYPES[allianceType].label}交渉が不成立に終わった。`, {stars:2, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
    saveState();
    return {ok:true, msg:"交渉は不成立に終わりました", success:false};
  }
  const alliance = {id:"al"+Date.now()+randInt(0,999), partnerId, partnerName:partner.name, type:allianceType, exclusive, ownStake, startDay:state.day, active:true};
  v.alliances.push(alliance);
  // 提携効果: 相手の強みを一部だけ自社に反映する(即座に全部ではなく、緩やかに)
  const techGain = Math.max(0,(partner.quality-v.quality))*0.4;
  v.quality = clamp(v.quality+techGain, 0.05, 0.97);
  if(allianceType==="sales") v.marketShare = clamp((v.marketShare||5)+rand(1,4), 0, 100);
  if(allianceType==="overseas") v.overseasRegions = [...(v.overseasRegions||[]), `${partner.name}経由の海外市場`];
  if(allianceType==="rd" || allianceType==="tech"){ const t=ventureTarget(v); t.growth = clamp(t.growth+rand(0.5,2), -15, 45); }
  if(!v.history) v.history=[];
  v.history.push({day:state.day, text:`${partner.name}と${ALLIANCE_TYPES[allianceType].label}を締結`});
  pushNews(`${v.name}が${partner.name}と${ALLIANCE_TYPES[allianceType].label}を締結した。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
  saveState();
  return {ok:true, msg:`${partner.name}と${ALLIANCE_TYPES[allianceType].label}を締結しました`, success:true};
}
function dissolveAlliance(ventureId, allianceId){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v) return {ok:false, msg:"対象企業が見つかりません"};
  const alliance = (v.alliances||[]).find(a=>a.id===allianceId && a.active);
  if(!alliance) return {ok:false, msg:"提携が見つかりません"};
  alliance.active = false;
  alliance.endDay = state.day;
  if(!v.history) v.history=[];
  v.history.push({day:state.day, text:`${alliance.partnerName}との提携を解消`});
  pushNews(`${v.name}と${alliance.partnerName}の提携が解消された。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
  saveState();
  return {ok:true, msg:"提携を解消しました"};
}
// 提携先の業績悪化・上場廃止などにより、低確率で提携が自動的に解消される
function updateAlliances(v){
  if(!v.alliances || !v.alliances.length) return;
  v.alliances.forEach(a=>{
    if(!a.active) return;
    const partner = state.stocks.find(s=>s.id===a.partnerId);
    if(!partner){ a.active=false; a.endDay=state.day; return; } // 上場廃止等で消滅
    const health = computeCompanyHealthStatus(partner);
    const dissolveChance = health.level==="crisis" ? 0.0015 : (health.level==="bankruptcy_risk" ? 0.004 : 0.00015);
    if(Math.random()<dissolveChance){
      a.active=false; a.endDay=state.day;
      if(!v.history) v.history=[];
      v.history.push({day:state.day, text:`${a.partnerName}の業績悪化により提携が解消された`});
      pushNews(`${v.name}と${a.partnerName}の提携が、${a.partnerName}の業績悪化を理由に解消された。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
    }
  });
}
// 事業ポートフォリオ(売上構成)を算出する。主力事業+育成中の新規事業のうち、売上を持つものを集計する
function computeBusinessPortfolio(v){
  const t = ventureTarget(v);
  const sportsRevTotal = (v.sportsTeams||[]).reduce((s,team)=> s + (team.status!=="sold"?(team.revenue||0)*0.3:0), 0);
  const items = [{label:v.sector+"(既存事業)", revenue: Math.max(0, t.revenue - (v.newBusinesses||[]).reduce((s,b)=> s + (b.stage!=="failed"?(b.revenue||0)*0.3:0), 0) - sportsRevTotal)}];
  (v.newBusinesses||[]).forEach(b=>{
    if(b.stage!=="failed" && (b.revenue||0)>0){
      const sector = NEW_BUSINESS_SECTORS.find(s=>s.key===b.sectorKey);
      items.push({label:(sector?sector.label:b.label)+"(新規事業)", revenue: b.revenue*0.3});
    }
  });
  (v.sportsTeams||[]).forEach(team=>{
    if(team.status!=="sold" && (team.revenue||0)>0) items.push({label:`${SPORT_TYPES[team.sport].label}:${team.name}`, revenue: team.revenue*0.3});
  });
  const total = items.reduce((s,i)=>s+i.revenue,0)||1;
  return items.map(i=>({...i, pct: i.revenue/total*100})).sort((a,b)=>b.revenue-a.revenue);
}

function computeTeamStrength(team){
  const roster = team.roster||[];
  if(!roster.length) return 30;
  const avgSkill = avg(roster.map(p=>p.skill));
  const facilityBonus = ((team.facilities.training||0) + (team.facilities.stadium||0)*0.3)/3;
  return clamp(avgSkill + facilityBonus, 10, 99);
}

// スポンサー獲得(親会社の業種との相性でスポンサー料が変わる)
const SPONSOR_FIT = {
  "半導体":{esports:1.6, baseball:0.8, soccer:0.9, basketball:0.9}, "IT":{esports:1.5, soccer:1.3, basketball:1.1, baseball:0.9},
  "食品":{baseball:1.4, soccer:1.1, basketball:1.0, esports:0.8}, "自動車":{basketball:1.0, soccer:1.2, baseball:1.0, esports:0.9},
  "金融":{baseball:1.1, soccer:1.1, basketball:1.1, esports:1.0}, "防衛":{baseball:0.9,soccer:0.9,basketball:0.9,esports:0.9},

function seekSponsor(ventureId, teamId){
  const v = state.ventures.find(x=>x.id===ventureId);

    pushNews(`${team.name}のスポンサー獲得交渉がまとまらなかった。`, {stars:2, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});

// シーズン処理: 成績決定→ファン増減→収益計算(チケット・グッズ・スポンサー)→維持費控除→親会社業績への反映
function processTeamSeason(v, team){
  // 前期比較用のスナップショットを保存する(このシーズン処理で上書きされる前の値)
  team.prevSeasonRevenue = team.revenue||0;
  team.prevSeasonProfit = team.profit||0;
  team.prevSeasonFanbase = team.fanbase;
  const strength = computeTeamStrength(team);
  const rivalStrength = clamp(strength + rand(-15,15), 10, 99); // 簡易的なライバルチームとの対戦結果
  const won = strength > rivalStrength;
  team.standing = clamp((team.standing||8) + (won ? -randInt(0,2) : randInt(0,2)), 1, 12);

  // ファンの増減(成績連動だが、ロイヤルティが高いほど下振れを緩和する)
  const perfDelta = won ? rand(1,4) : rand(-4,-0.5);
  team.fanbase = clamp(team.fanbase + perfDelta*(1-team.loyalty/200), 2, 100);
  team.loyalty = clamp(team.loyalty + (won?0.5:-0.2), 10, 95);

  // 収益: チケット・グッズ(ファン規模とチケット単価に依存)+スポンサー収入
  const attendanceFactor = clamp(team.fanbase/100, 0.05, 1) * clamp((team.facilities.stadium||10)/100+0.3, 0.3, 1.2);
  const ticketRevenue = attendanceFactor * (team.ticketPrice||50) * 800_000;
  const goodsRevenue = attendanceFactor * 300_000_000 * (team.fanbase/60);
  const sponsorRevenue = (team.sponsors||[]).reduce((s,sp)=>s+sp.amount,0);
  const namingRevenue = team.namingRights ? team.namingRights.amount*0.1 : 0;
  const esportsTitleFactor = team.sport==="esports" ? (()=>{ ensureEsportsTitles(); const title=state.esportsTitles.find(t=>t.key===team.esportsTitle); return title?title.popularity/60:1; })() : 1;
  team.revenue = Math.round((ticketRevenue+goodsRevenue+sponsorRevenue+namingRevenue) * esportsTitleFactor);

  // 維持費: 選手年俸+施設維持費(現金を大量保有していても無敵にならないようにする)
  const salaryCost = (team.roster||[]).reduce((s,p)=>s+p.salary,0);
  const facilityCost = ((team.facilities.stadium||0)+(team.facilities.training||0)+(team.facilities.youth||0))*5_000_000;
  const totalCost = salaryCost + facilityCost;
  team.profit = team.revenue - totalCost;

  // 親会社の業績への反映(新規事業と同じ0.3ダンピングパターン。固定の株価ボーナスは一切与えない)
  const t = ventureTarget(v);
  t.revenue += team.revenue*0.3;
  t.profit += team.profit*0.3;

  // まれにスキャンダル発生(ファンの信頼・スポンサー評価を損なう)
  if(Math.random()<0.02){
    team.fanbase = clamp(team.fanbase-rand(5,15), 2, 100);
    if(team.sponsors.length && Math.random()<0.4) team.sponsors.pop();
    pushNews(`${team.name}で不祥事が発覚し、ファン・スポンサーからの信頼が損なわれた。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
    if(!team.history) team.history=[]; team.history.push({day:state.day, text:"不祥事が発覚し、信頼が損なわれた"});
  }
  if(won && team.standing<=1 && Math.random()<0.3){
    pushNews(`${team.name}がリーグ優勝を果たした!ファンの熱狂とともに、グッズ・チケット販売が急増している。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
    queueCelebration("優勝!", `${team.name}がリーグ優勝を果たした。`);
    team.fanbase = clamp(team.fanbase+rand(5,12), 2, 100);
    if(!team.history) team.history=[]; team.history.push({day:state.day, text:"リーグ優勝を果たした"});
  }
  team.lastSeasonDay = state.day;
}
// 選手市場(FA): チームごとに簡易的な移籍市場を都度生成する(常時同じ顔ぶれではなく、開くたびに市場感を出す)
function getFreeAgentMarket(sport){
  return Array.from({length:8}, ()=>generatePlayer(sport));

function signFreeAgent(ventureId, teamId, player){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v) return {ok:false, msg:"対象企業が見つかりません"};

// 選手放出(年俸の重い選手を放出して人件費を圧縮する)
function releasePlayer(ventureId, teamId, playerId){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v) return {ok:false, msg:"対象企業が見つかりません"};
  const team = (v.sportsTeams||[]).find(t=>t.id===teamId && t.status==="active");
  if(!team) return {ok:false, msg:"対象チームが見つかりません"};
  const idx = team.roster.findIndex(p=>p.id===playerId);
  if(idx<0) return {ok:false, msg:"対象選手が見つかりません"};
  const [player] = team.roster.splice(idx,1);
  if(!team.history) team.history=[];
  team.history.push({day:state.day, text:`${player.name}選手を放出した`});
  team.roster.push(generatePlayer(team.sport)); // 最低限のロスター人数を維持する
  saveState();
  return {ok:true, msg:`${player.name}選手を放出しました`};
}
function updateSportsTeams(v){
  if(!v.sportsTeams || !v.sportsTeams.length) return;
  v.sportsTeams.forEach(team=>{
    if(team.status!=="active") return;
    const seasonLen = SPORT_TYPES[team.sport].seasonDays;
    if(state.day - team.lastSeasonDay >= seasonLen) processTeamSeason(v, team);
    // 選手の加齢・キャリア進行(シーズンより緩やかな頻度で)
    if((state.day - team.acquireDay) % 365 === 0){
      team.roster = team.roster.map(p=>{
        p.age += 1; p.contractYearsLeft = Math.max(0, p.contractYearsLeft-1);
        const isEsports = team.sport==="esports";
        const primeAge = isEsports ? 20 : 27;
        if(p.age < primeAge-3) p.careerStage="rookie";
        else if(p.age < primeAge+4) p.careerStage="prime";
        else p.careerStage="veteran";
        if(p.careerStage==="prime") p.skill = clamp(p.skill+rand(0,2), 20, 99);
        else if(p.careerStage==="veteran") p.skill = clamp(p.skill-rand(0.5,3), 15, 99);
        p.marketValue = Math.round(p.skill*p.skill*1_000_000*(isEsports?0.3:8)*(p.careerStage==="veteran"?0.6:1));
        return p;
      });
      // 引退・新人補充
      const retireAge = team.sport==="esports" ? 24 : 38;
      const retiring = team.roster.filter(p=>p.age>=retireAge || (p.careerStage==="veteran" && Math.random()<0.15));
      if(retiring.length){
        team.roster = team.roster.filter(p=>!retiring.includes(p));
        retiring.forEach(p=>{ if(!v.history) v.history=[]; v.history.push({day:state.day, text:`${team.name}の${p.name}選手が引退した`}); });
        while(team.roster.length < SPORT_TYPES[team.sport].rosterSize+3) team.roster.push(generatePlayer(team.sport));
      }
    }
  });
}

// 企業規模の安全弁: 個々の施策(研究開発/設備投資/特別イベント等)が散在して業績を掛け算で伸ばすため、
// 個別の乗算箇所すべてを都度ダンピングする代わりに、ここで基準値からの倍率に上限を設ける(通常のプレイでは到達しない極端な暴走だけを防ぐ)
function applyVentureScaleSafety(v){
  const t = ventureTarget(v);
  if(!t) return;
  if(v.baseRevenue===undefined) v.baseRevenue = Math.max(1e8, t.revenue);
  if(v.baseProfit===undefined) v.baseProfit = Math.max(1e7, Math.abs(t.profit)||1e7);
  const maxScale = 8000; // 基準値の8000倍(創業期の中小企業が業界大手へ成長する程度)を上限とする
  const revScale = t.revenue/v.baseRevenue;
  if(revScale>maxScale) t.revenue = v.baseRevenue*maxScale*(1+rand(-0.02,0.02));
  const profitScale = Math.abs(t.profit)/v.baseProfit;
  if(profitScale>maxScale) t.profit = Math.sign(t.profit||1)*v.baseProfit*maxScale*(1+rand(-0.02,0.02));
}
function investInVenture(ventureId, actionKey){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || (v.stage!=="private" && v.stage!=="listed")) return {ok:false, msg:"この企業には投資できません"};
  const action = VENTURE_ACTIONS[actionKey];
  if(!action) return {ok:false, msg:"不正な投資項目です"};
  const cost = Math.max(1_000_000, Math.round(v.investedCapital*action.costRatio*rand(0.85,1.15)));
  if(availableCash()<cost) return {ok:false, msg:"資金が不足しています"};
  state.cash -= cost;
  v.cumulativeInvestment += cost;
  const successProb = clamp(0.45 + (v.management-3)*0.08 + (v.quality-0.5)*0.3, 0.2, 0.85);
  const success = Math.random()<successProb;
  if(success) action.effect(v); else action.failEffect(v);
  const t = ventureTarget(v);
  t.revenue = Math.max(t.revenue, 1e6);
  applyVentureScaleSafety(v);
  pushNews(`${v.name}への${action.label}が${success?"成功した":"期待した成果を上げられなかった"}。`, {stars:2, kind:"confirmed", category:"venture", stockId:v.listedStockId, type: success?"good":"event"});
  saveState();
  return {ok:true, msg: success ? `${action.label}が成功した` : `${action.label}は期待した成果を上げられなかった`};
}

// 成長段階: 創業企業→成長企業→IPO→大型企業→日本を代表する企業→世界的企業→業界トップ企業
// IPOは企業育成のゴールではなく、新しい成長段階の始まりとして扱う(上場後も経営は継続する)
const GROWTH_STAGES_PRE = [
  {key:"founding", label:"創業",           minValue:0},
  {key:"startup",  label:"スタートアップ", minValue:3e8},
  {key:"growth",   label:"成長企業",       minValue:15e8},
  {key:"large",    label:"大型企業",       minValue:60e8},
  {key:"ipo_ready",label:"IPO準備",        minValue:150e8},
];
const GROWTH_STAGES_POST = [
  {key:"ipo",      label:"IPO",               minValue:0},
  {key:"large",    label:"大型企業",           minValue:50e8},
  {key:"national", label:"日本を代表する企業", minValue:300e8},
  {key:"global",   label:"世界的企業",         minValue:1000e8},
  {key:"topclass", label:"業界トップ企業",     minValue:5000e8},
];
// 後方互換用(旧バージョン参照エイリアス)
const GROWTH_STAGES = [...GROWTH_STAGES_PRE, ...GROWTH_STAGES_POST];

// 上場後も経営継続: 上場済みベンチャーの経営操作対象は連動する実際の銘柄データにする
// (非上場の間はベンチャー自身のデータを、上場後は対応する株価エンジン上の銘柄を操作する)
function ventureTarget(v){
  if(v.stage==="listed" && v.listedStockId){
    const st = state.stocks.find(s=>s.id===v.listedStockId);
    if(st) return st;
  }
  return v;
}
function ventureCompanyValue(v){
  if(v.stage==="listed"){
    const st = ventureTarget(v);
    if(st && st.price) return Math.round(st.price*st.shares);
  }
  const base = v.profit>0 ? v.profit*15 : v.revenue*2;
  return Math.max(1e6, Math.round(base * (1+(v.brand||30)/200) * (1+(v.quality-0.5)) * (1+(v.patents||0)*0.05)));
}
// 企業グループ全体の価値(持株会社+子会社の合算)
function ventureGroupValue(v){
  let total = ventureCompanyValue(v);
  (v.subsidiaries||[]).forEach(subId=>{
    const sub = state.ventures.find(x=>x.id===subId);
    if(sub) total += ventureCompanyValue(sub);
  });
  return total;
}
function ventureGrowthStage(v){
  const value = ventureCompanyValue(v);
  const stages = v.stage==="listed" ? GROWTH_STAGES_POST : GROWTH_STAGES_PRE;
  let stage = stages[0];
  for(const s of stages) if(value>=s.minValue) stage=s;
  return stage;
}
// 経営ダッシュボードのKPIをまとめて算出する(上場後は実際の銘柄データを反映する)
function computeVentureKPIs(v){
  const t = ventureTarget(v);
  const readiness = ventureIpoReadiness(v);
  const readyCount = [readiness.revenueOK,readiness.profitOK,readiness.qualityOK,readiness.growthOK].filter(Boolean).length;
  return {
    revenue: t.revenue,
    operatingProfit: t.profit*1.2,
    netProfit: t.profit,
    cashBalance: v.cashBalance||0,
    employees: Math.round((t.revenue/8e8)*100+50),
    marketShare: clamp(v.marketShare||0, 0, 100),
    rdSpend: v.rdSpend||0,
    companyValue: ventureCompanyValue(v),
    groupValue: ventureGroupValue(v),
    ipoAchievement: v.stage==="listed" ? 100 : Math.round(readyCount/4*100),
    brand: clamp(v.brand||0, 0, 100),
  };
}
// 会社の評価(成長性・収益性・財務健全性・技術力・ブランド力・人材力・経営力を100点満点で算出する)
function computeVentureEvaluation(v){
  const t = ventureTarget(v);
  const growth = clamp((t.growth+15)/60*100, 0, 100);
  const margin = t.revenue>0 ? t.profit/t.revenue : 0;
  const profitability = clamp(50+margin*250, 0, 100);
  const financial = clamp(((v.cashBalance||0)/Math.max(1,t.revenue*0.3))*50, 0, 100);
  const tech = clamp((v.techScore||3)*18 + (v.patents||0)*4, 0, 100);
  const brand = clamp(v.brand||30, 0, 100);
  const execCount = Object.values(v.executives||{}).filter(Boolean).length;
  const talent = clamp((v.management||3)*16 + execCount*8, 0, 100);
  const management = clamp((v.competitiveness||3)*14 + t.quality*45, 0, 100);
  const overall = Math.round((growth+profitability+financial+tech+brand+talent+management)/7);
  const toGrade = (score)=> score>=85?"S":score>=70?"A":score>=50?"B":score>=30?"C":"D";
  return {
    growth:Math.round(growth), profitability:Math.round(profitability), financial:Math.round(financial),
    tech:Math.round(tech), brand:Math.round(brand), talent:Math.round(talent), management:Math.round(management),
    overall, grade: toGrade(overall),
  };
}

  const v = state.ventures.find(x=>x.id===ventureId);

function ventureExecBonus(v){
  let growthBonus=0, profitMult=1, qualityBonus=0;
  if(v.executives){
    Object.values(v.executives).forEach(ex=>{
      if(!ex) return;
      if(ex.subtype==="tech") qualityBonus += 0.008;
      if(ex.subtype==="sales") growthBonus += 1.2;
      if(ex.subtype==="finance") profitMult *= 1.025;
      if(ex.subtype==="ops") profitMult *= 1.015;

  }
  return {growthBonus, profitMult, qualityBonus};
}

function startNewProduct(ventureId){

function updateProductPipeline(v){
  if(!v.productPipeline) return;
  v.productPipeline.forEach(p=>{
    if(p.result) return; // 既に成功/失敗判定済み
    if(state.day - p.startDay < 15) return;
    const idx = PRODUCT_STAGES.indexOf(p.stage);
    if(idx>=PRODUCT_STAGES.length-1) return;
    p.stage = PRODUCT_STAGES[idx+1];
    p.startDay = state.day;
    if(p.stage==="launched"){
      const t = ventureTarget(v);
      const successProb = clamp(0.4+(t.quality-0.5)*0.6+(v.techScore-3)*0.06, 0.15, 0.85);
      if(Math.random()<successProb){
        p.result = "success";
        t.revenue *= rand(1.08,1.20);
        if(Math.random()<0.4) v.patents = (v.patents||0)+1;
        v.brand = clamp((v.brand||30)+rand(2,6), 0, 100);

        t.quality = clamp(t.quality-0.04, 0.05, 0.97);

      }
    }
  });
}

  if(availableCash()<cost) return {ok:false, msg:"資金が不足しています"};

  const t = ventureTarget(v);

    t.revenue *= rand(1.10,1.25);

// 経営会議(定期的に二択の経営判断を提示する。放置すると期限切れで消極的な選択が自動適用される)
const BOARD_QUESTIONS = [
  {key:"rd", question:"研究開発に追加投資しますか?", yes:"投資する", no:"投資しない"},
  {key:"overseas", question:"海外進出を行いますか?", yes:"進出する", no:"見送る"},
  {key:"factory", question:"新工場を建設しますか?", yes:"建設する", no:"見送る"},
];
function triggerBoardMeeting(v){
  if(state.pendingBoardDecisions.find(d=>d.ventureId===v.id)) return;
  const q = pick(BOARD_QUESTIONS);
  state.pendingBoardDecisions.push({id:"b"+Date.now()+randInt(0,999), ventureId:v.id, ventureName:v.name, key:q.key, question:q.question, yes:q.yes, no:q.no, createdDay:state.day, deadline:state.day+20});
  pushNews(`${v.name}で経営会議が開催される:「${q.question}」`, {stars:2, kind:"confirmed", category:"venture", type:"flavor"});
}
function resolveBoardDecision(decisionId, choice){
  const idx = state.pendingBoardDecisions.findIndex(d=>d.id===decisionId);
  if(idx<0) return {ok:false, msg:"議題が見つかりません"};
  const d = state.pendingBoardDecisions[idx];
  const v = state.ventures.find(x=>x.id===d.ventureId);
  state.pendingBoardDecisions.splice(idx,1);
  if(v && choice==="yes"){
    if(d.key==="rd") investInVenture(v.id,"research");
    else if(d.key==="overseas"){ const region = pick(OVERSEAS_REGIONS.filter(r=>!(v.overseasRegions||[]).includes(r))||OVERSEAS_REGIONS); if(region) expandOverseas(v.id, region); }
    else if(d.key==="factory") investInVenture(v.id,"capex");
    else if(d.key==="dividend_demand"){
      const t = ventureTarget(v);
      const div = Math.max(0, Math.round(t.profit*0.10*v.stake));
      state.cash += div;
      v.brand = clamp((v.brand||30)+3, 0, 100);
      pushNews(`${v.name}が株主の増配要求に応じ、配当${fmtYen(div)}を追加で還元した。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});

// 株主総会(年1回、配当政策を決定する。上場後も継続開催)
function holdShareholderMeeting(v){
  const t = ventureTarget(v);
  const payoutRatio = v.dividendPayoutRatio!==undefined ? v.dividendPayoutRatio : 0.15;
  if(t.profit>0 && payoutRatio>0){
    const dividend = Math.max(0, Math.round(t.profit*payoutRatio*v.stake));
    state.cash += dividend;
    state.stats.totalDividends = (state.stats.totalDividends||0)+dividend;
    pushNews(`${v.name}の株主総会が開催され、配当${fmtYen(dividend)}を受け取った。`, {stars:2, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
    // 配当を出しすぎると企業の現金が減り、将来の成長力(投資余力)が低下するトレードオフを表現する
    if(payoutRatio>0.35) v.cashBalance = Math.max(0, (v.cashBalance||0) - Math.round(t.profit*(payoutRatio-0.35)*0.5));
  } else {
    pushNews(`${v.name}の株主総会が開催されたが、今期は無配となった。`, {stars:1, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"flavor"});
  }
  v.lastShareholderMeetingDay = state.day;
}
// 配当方針の設定(配当性向0〜60%)。出しすぎると将来の成長投資余力とのトレードオフが生じる
function ventureSetDividendPolicy(ventureId, payoutRatio){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || v.stage!=="listed") return {ok:false, msg:"上場企業のみ配当方針を設定できます"};
  v.dividendPayoutRatio = clamp(payoutRatio, 0, 0.6);
  saveState();
  return {ok:true, msg:`配当性向を${Math.round(v.dividendPayoutRatio*100)}%に設定しました`};
}
// 自社株買い(プレイヤーが経営する上場企業向け)。市場流通株式が減りEPSは改善するが、反応は業績・市場環境次第で変わる
function ventureExecuteBuyback(ventureId, amount){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || v.stage!=="listed") return {ok:false, msg:"上場企業のみ自社株買いを実施できます"};
  const st = ventureTarget(v);
  if(!st) return {ok:false, msg:"対象銘柄が見つかりません"};
  if((v.cashBalance||0) < amount) return {ok:false, msg:"企業の現金が不足しています"};
  const sharesRetired = Math.min(Math.floor(amount/st.price/100)*100, st.shares-100000);
  if(sharesRetired<=0) return {ok:false, msg:"買い戻せる株数がありません"};
  v.cashBalance -= amount;
  st.shares -= sharesRetired;
  adjustShareholderRegistryForCapitalEvent(st, "自社株買い", sharesRetired);
  reconcileShareholderRegistry(st);
  const positiveReaction = Math.random() < clamp(0.4+st.quality*0.3, 0.2, 0.8);
  if(positiveReaction) pushNews(`${v.name}が自社株買いを発表した。EPS改善が期待されている。`, {stars:3, kind:"confirmed", category:"venture", stockId:st.id, type:"good"});
  else pushNews(`${v.name}が自社株買いを発表したが、市場の反応は限定的だった。`, {stars:2, kind:"confirmed", category:"venture", stockId:st.id, type:"flavor"});
  saveState();
  return {ok:true, msg:`自社株買いを実施しました(${fmtNum(sharesRetired)}株)`};
}
// 新株発行による資金調達(プレイヤーが経営する上場企業向け)。資金は得られるが既存株主(プレイヤー含む)の持分比率は希薄化する
function ventureIssueNewShares(ventureId, amount){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || v.stage!=="listed") return {ok:false, msg:"上場企業のみ新株発行による資金調達を実施できます"};
  const st = ventureTarget(v);
  if(!st) return {ok:false, msg:"対象銘柄が見つかりません"};
  const newShares = Math.max(TRADING_UNIT, Math.round(amount/st.price/100)*100);
  const sharesBefore = st.shares;
  st.shares += newShares;
  adjustShareholderRegistryForCapitalEvent(st, "増資", newShares);
  reconcileShareholderRegistry(st);
  v.cashBalance = (v.cashBalance||0) + amount;
  v.stake = v.stake * sharesBefore/st.shares; // プレイヤーの持分比率も他の株主同様に希薄化する
  pushNews(`${v.name}が新株発行により${fmtYen(amount)}の資金調達を実施した。発行済株式数が増加し、既存株主の持分比率は希薄化した。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  saveState();
  return {ok:true, msg:`新株発行により${fmtYen(amount)}を調達しました(持分比率${(v.stake*100).toFixed(1)}%に希薄化)`};
}

const SYNERGY_PAIRS = [
  {tags:["ai","datacenter"], label:"AIサービス強化", revenueMult:1.015, qualityBonus:0.01},
  {tags:["semiconductor","ai"], label:"AI半導体開発", revenueMult:1.02, qualityBonus:0.012},
  {tags:["defense","space"], label:"防衛・宇宙事業拡大", revenueMult:1.015, qualityBonus:0.008},
  {tags:["bio","robot"], label:"医療ロボティクス展開", revenueMult:1.012, qualityBonus:0.01},
  {tags:["energy","materials"], label:"次世代素材・エネルギー融合", revenueMult:1.01, qualityBonus:0.008},
];
function applyGroupSynergy(parent){
  if(!parent.subsidiaries || !parent.subsidiaries.length) return;
  const subs = parent.subsidiaries.map(id=>state.ventures.find(v=>v.id===id)).filter(v=>v && v.stage!=="failed");
  if(!subs.length) return;
  const allTags = new Set([...(parent.themeTags||[])]);
  subs.forEach(s=> (s.themeTags||[]).forEach(t=>allTags.add(t)));
  SYNERGY_PAIRS.forEach(syn=>{
    if(syn.tags.every(t=>allTags.has(t))){
      const pt = ventureTarget(parent);
      pt.revenue *= syn.revenueMult;
      pt.quality = clamp(pt.quality+syn.qualityBonus, 0, 1);
      subs.forEach(s=>{ const st_=ventureTarget(s); st_.revenue *= syn.revenueMult; });
    }
  });
}

const RIVAL_ACQUIRER_NAMES = ["グローバル・ホールディングス","日本電子工業","太陽グループ","フェニックス・キャピタル","北斗インベストメンツ","青山コーポレーション"];
function checkIncomingTakeoverOffer(){
  const candidates = state.ventures.filter(v=>v.stage==="listed" && !v.incomingOffer && !v.incomingHostileTob);
  if(!candidates.length) return;
  if(Math.random()>=0.0004) return; // ごく低確率
  const v = pick(candidates);
  const st = ventureTarget(v);
  if(!st) return;
  const premiumPct = rand(0.15,0.45);
  const offerPrice = Math.round(st.price*(1+premiumPct));
  const acquirer = pick(RIVAL_ACQUIRER_NAMES);
  v.incomingOffer = {acquirer, offerPrice, premiumPct, day: state.day, deadline: state.day+15};
  pushNews(`【買収提案】${acquirer}が${v.name}へTOBを提案した。買付価格¥${fmtNum(offerPrice)}(プレミアム${Math.round(premiumPct*100)}%)。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
}
function respondToIncomingOffer(ventureId, accept){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || !v.incomingOffer) return {ok:false, msg:"対象の提案が見つかりません"};
  const offer = v.incomingOffer;
  const st = ventureTarget(v);
  if(accept){
    const payout = Math.round(offer.offerPrice * (st?st.shares:0) * v.stake);
    state.cash += payout;
    pushNews(`${v.name}は${offer.acquirer}によるTOBを受け入れ、経営権を譲渡した。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
    v.stage = "failed"; v.failureReason = "buyout_accepted";
    v.incomingOffer = null;

    saveState();
    return {ok:true, msg:`売却が完了しました(${fmtYen(payout)}を獲得)`};
  } else {
    pushNews(`${v.name}の経営陣は${offer.acquirer}によるTOB提案を拒否した。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});

    return {ok:true, msg:"提案を拒否しました"};

}

  dividend:  {label:"配当増額で株主に訴える", desc:"株主の支持を得やすくなるが、将来の成長投資余力が下がる"},

function defendAgainstIncomingTob(ventureId, defenseKey){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || !v.incomingHostileTob || v.incomingHostileTob.resolved) return {ok:false, msg:"対象の敵対的TOBが見つかりません"};
  const tob = v.incomingHostileTob;
  if(tob.defenseUsed) return {ok:false, msg:"すでに防衛策を実施済みです"};
  const st = ventureTarget(v);
  if(defenseKey==="newshares"){
    if(!st) return {ok:false, msg:"対象銘柄が見つかりません"};
    ventureIssueNewShares(v.id, Math.round(st.price*st.shares*0.15));
    tob.defenseUsed = "第三者割当増資";
  } else if(defenseKey==="buyback"){
    const amount = Math.min(v.cashBalance||0, st?Math.round(st.price*st.shares*0.05):0);
    if(amount<=0) return {ok:false, msg:"自社株買いを実施する現金がありません"};
    ventureExecuteBuyback(v.id, amount);
    tob.defenseUsed = "自社株買い";
  } else if(defenseKey==="whiteknight"){
    if(Math.random()<0.4){
      tob.defenseUsed = "ホワイトナイト";
      pushNews(`${v.name}にホワイトナイトが現れた。買収防衛への協力が期待できる。`, {stars:4, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
    } else {
      tob.defenseUsed = "ホワイトナイト(失敗)";
      pushNews(`${v.name}はホワイトナイトを探したが、見つからなかった。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
    }
  } else if(defenseKey==="dividend"){
    if(v.stage==="listed") ventureSetDividendPolicy(v.id, 0.5);
    tob.defenseUsed = "配当増額";
  } else if(defenseKey==="explain"){
    v.brand = clamp((v.brand||30)+10, 0, 100);
    tob.defenseUsed = "株主への説明";
  } else {
    return {ok:false, msg:"不正な防衛策です"};
  }
  saveState();
  return {ok:true, msg:`防衛策(${tob.defenseUsed})を実施しました`};
}
function resolveIncomingHostileTob(v){
  const tob = v.incomingHostileTob;
  if(!tob || tob.resolved) return;
  tob.resolved = true;
  const difficulty = 0.3 + (v.stake>0.5?0.3:0) + (tob.defenseUsed && !tob.defenseUsed.includes("失敗") ?0.2:0);
  const successProb = clamp(0.5 - difficulty, 0.05, 0.85); // 買収側(第三者)の成功確率
  const success = Math.random() < successProb;
  const st = ventureTarget(v);
  if(success){
    const payout = Math.round(tob.price * (st?st.shares:0) * v.stake);
    state.cash += payout;
    pushNews(`【TOB成立】${tob.acquirer}が${v.name}の経営権を取得した。保有株式は買付価格で売却された。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
    v.stage = "failed"; v.failureReason = "hostile_taken";
  } else {
    pushNews(`【TOB失敗】${v.name}は${tob.acquirer}のTOBを退けた。独立経営を維持している。`, {stars:5, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
    queueCelebration("買収防衛成功", `${v.name}は${tob.acquirer}の敵対的TOBを退けた。`);
  }
  v.incomingHostileTob = null;
}

function updateVentures(){
  checkIncomingTakeoverOffer();
  updateEsportsTitles();
  state.ventures.forEach(v=>{
    if(v.incomingHostileTob && !v.incomingHostileTob.resolved && state.day>=v.incomingHostileTob.endDay){
      resolveIncomingHostileTob(v);
    }
    if(v.stage!=="private" && v.stage!=="listed") return;
    updateProductPipeline(v);
    updateNewBusinesses(v);
    updateAlliances(v);
    updateSportsTeams(v);
    checkFundraisingNeed(v);
    checkVentureFailureRisk(v);
    if(v.stage!=="private" && v.stage!=="listed") return; // 上記チェックで倒産/停滞した場合はここで処理を終える

    // 経営会議(45〜60日間隔、上場後も継続)
    if(state.day - v.lastBoardMeetingDay >= randInt(45,60)){
      v.lastBoardMeetingDay = state.day;
      if(v.stage==="listed" && Math.random()<0.5) triggerShareholderEvent(v);
      else triggerBoardMeeting(v);
    }
    // 株主総会(年1回、上場後も継続)
    if(state.day - v.lastShareholderMeetingDay >= 365){
      holdShareholderMeeting(v);
    }

    // 独占技術・大型契約(超低確率、上場後も継続)
    if(tryExclusiveTechBreakthrough(v)){ applyVentureScaleSafety(v); }
    else if(tryMegaContract(v)){ applyVentureScaleSafety(v); }

    if(state.day - v.lastEventDay < randInt(28,42)) return;
    v.lastEventDay = state.day;
    if(v.stage==="listed" && v.subsidiaries && v.subsidiaries.length) applyGroupSynergy(v);
    const p = VENTURE_POLICIES[v.policy] || VENTURE_POLICIES.growth;
    const execBonus = ventureExecBonus(v);
    const t = ventureTarget(v);
    // 基準値(初回のみ設定): 公開株と同様に、業績が基準値から大きく外れて拡大するほど、さらなる伸びには
    // 収穫逓減がかかるようにする(成長率にも緩やかな平均回帰を持たせる)。既存セーブのベンチャーにも安全に補完する
    if(v.baseRevenue===undefined) v.baseRevenue = Math.max(1e8, t.revenue);
    if(v.baseProfit===undefined) v.baseProfit = Math.max(1e7, Math.abs(t.profit)||1e7);
    const growthTarget = 8;
    const growthMeanReversion = (t.growth-growthTarget)*-0.15;
    t.growth = clamp(t.growth + rand(p.growthRange[0],p.growthRange[1]) + execBonus.growthBonus + growthMeanReversion, -15, 45);
    const profitScale = Math.abs(t.profit)/v.baseProfit;
    const profitDamping = clamp(1/Math.pow(1+Math.max(0,Math.log10(profitScale)),1.8), 0.02, 1);
    const rawProfitMult = rand(p.profitMultRange[0],p.profitMultRange[1]) * execBonus.profitMult;
    const dampedProfitMult = rawProfitMult>=1 ? 1+(rawProfitMult-1)*profitDamping : rawProfitMult;
    t.profit *= dampedProfitMult;
    const revenueScale = t.revenue/v.baseRevenue;
    const revenueDamping = clamp(1/Math.pow(1+Math.max(0,Math.log10(revenueScale)),1.6), 0.03, 1);
    t.revenue *= (1+(t.growth/100/4)*revenueDamping);
    t.quality = clamp(t.quality + rand(p.qualityRange[0],p.qualityRange[1]) + execBonus.qualityBonus, 0.05, 0.97);
    applyVentureScaleSafety(v);
    v.marketShare = clamp((v.marketShare||5) + rand(-0.5,1.0), 0, 100);
    v.cashBalance = Math.max(0, (v.cashBalance||0) + t.profit*0.3);

    const roll = Math.random();
    if(roll<0.03){
      const ev = pick(VENTURE_SPECIAL_EVENTS);
      ev.effect(v);
      pushNews(ev.text(v.name), {stars: ev.type==="good"?4:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:ev.type});
    } else if(roll<0.18){
      if(Math.random()<0.5){
        t.revenue *= 1.10;
        pushNews(`${v.name}で新技術開発に成功し、事業が拡大している。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"good"});
      } else {
        t.revenue *= 0.92; t.quality = clamp(t.quality-0.03,0.05,0.97);
        pushNews(`${v.name}で新技術開発が失敗し、事業縮小を余儀なくされている。`, {stars:3, kind:"confirmed", category:"venture", stockId:v.listedStockId, type:"event"});
      }
    }
    t.revenue = Math.max(t.revenue, 1e6);
    applyVentureScaleSafety(v);
  });

  // 経営会議の期限切れは消極的選択で自動解決する
  const expired = state.pendingBoardDecisions.filter(d=>state.day>d.deadline);
  expired.forEach(d=> resolveBoardDecision(d.id, "no"));
}
function ventureIpoReadiness(v){
  const revenueOK = v.revenue >= 10e8;
  const profitOK = v.profit > 0;
  const qualityOK = v.quality >= 0.5;
  const growthOK = v.growth >= 8;
  const readyCount = [revenueOK,profitOK,qualityOK,growthOK].filter(Boolean).length;
  return {revenueOK, profitOK, qualityOK, growthOK, ready: readyCount>=3};
}
function attemptVentureIPO(ventureId){
  const v = state.ventures.find(x=>x.id===ventureId);
  if(!v || v.stage!=="private") return {ok:false, msg:"申請できません"};
  const readiness = ventureIpoReadiness(v);
  if(!readiness.ready) return {ok:false, msg:"IPO審査基準を満たしていません(売上・利益・成長率・技術力のうち3項目以上が必要)"};
  const passProb = clamp(0.35 + (v.quality-0.5)*0.7 + (v.growth-15)/120 + (v.management-3)*0.05, 0.15, 0.9);
  if(Math.random() < passProb){
    v.stage = "ipo_queued";
    pushNews(`${v.name}のIPO審査が承認された。上場準備に入る。`, {stars:4, kind:"confirmed", category:"venture", type:"good"});
  } else {
    v.quality = clamp(v.quality-0.05, 0.05, 0.97);
    pushNews(`${v.name}のIPO審査が承認されなかった。引き続き企業育成が必要。`, {stars:3, kind:"confirmed", category:"venture", type:"event"});
  }
  saveState();
  return {ok:true};
}
// IPO審査を通過したベンチャーは、市場に空きができ次第(25銘柄ルールを維持しながら)上場する
function checkVentureListings(){
  const queued = state.ventures.find(v=>v.stage==="ipo_queued");
  if(!queued) return;
  if(state.stocks.length >= MAX_LISTED_STOCKS) return; // 既存の段階的上場廃止パイプラインが自然に枠を空けるのを待つ
  const per = 12 + queued.quality*8;
  const basePrice = Math.max(50, Math.round(Math.max(queued.profit,queued.revenue*0.03) / queued.shares * per));
  const def = {
    id: queued.id, name:queued.name, sector:queued.sector, desc:queued.desc, themeTags:queued.themeTags,
    basePrice, shares:queued.shares, baseRevenue:queued.revenue, baseProfit:Math.max(queued.revenue*0.02, queued.profit),
    growth:queued.growth, volatility:3.2, beta:1.3, quality:queued.quality, ecMin:28, ecMax:42,
  };
  const newStock = makeRuntimeStock(def, state.day+1);
  newStock.ipoHypeDays = 8;
  newStock.moonshotPotential = queued.quality>0.65 && Math.random()<0.15;
  state.stocks.push(newStock);
  if(queued.stake>0){
    const founderShares = Math.max(100, Math.round(newStock.shares*queued.stake*0.15/100)*100);
    const avgCost = Math.max(1, Math.round(queued.cumulativeInvestment/founderShares));
    state.portfolio[newStock.id] = {shares:founderShares, avgCost};
  }
  queued.stage = "listed";
  queued.listedStockId = newStock.id;
  pushDisclosure(newStock, {label:"上場", text:`${newStock.name}が上場した(創業者:プレイヤー)`, impactPct:null, type:"good", stars:5, internalCategory:"ipo"});
  pushNews(`【上場】あなたが育てた${newStock.name}が市場に上場した!`, {stars:5, kind:"confirmed", category:"venture", stockId:newStock.id, type:"good"});
  checkMilestones();
  saveState();
}

/* ==========================================================================
   IPO抽選システム(情報公開→購入予約→抽選→公開価格決定→上場→初値形成)
   市場は常に25銘柄に固定する。新規上場によって25銘柄を超える場合、
   最も業績の悪い企業を「上場廃止候補」とし、業績悪化→下方修正→投資家離れ
   →株価下落→監理銘柄→整理銘柄→上場廃止、という段階を数か月かけて進行させる。
   ========================================================================== */
const IPO_HOT_TAGS = ["ai","semiconductor","space","defense"]; // 人気化しやすいテーマ(半導体・AI・宇宙・防衛)
function scheduleNextIPO(){
  state.nextIpoDay = state.day + randInt(280,365);
  state.pendingIpo = null;
}
function isRecentlyRetired(id){
  return state.retiredStockIds.some(r => r.id===id && state.day-r.day<300);
}
// 企業の人気度(0.15〜1.35程度)。人気テーマ・現在の市場テーマ一致・成長率で上昇する
function computeIpoPopularity(def){
  let score = 0.32;
  def.themeTags.forEach(t=>{ if(IPO_HOT_TAGS.includes(t)) score += 0.24; });
  if(state.theme.tags.some(t=>def.themeTags.includes(t))) score += 0.28;
  score += clamp(def.growth/100, 0, 0.35);
  return clamp(score, 0.15, 1.35);
}
// 当選確率: 人気が高いほど低くなる(応募が集中するため)
function ipoWinProbability(popularity){ return clamp(1 - popularity*0.55, 0.08, 0.92); }
function ipoPopularityRanking(defId){
  const scored = IPO_POOL.map(d=>({id:d.id, score:computeIpoPopularity(d)})).sort((a,b)=>b.score-a.score);
  const idx = scored.findIndex(s=>s.id===defId);
  return {rank: idx+1, total: scored.length};
}
function getIpoDef(){ return state.pendingIpo ? IPO_POOL.find(d=>d.id===state.pendingIpo.defId) : null; }

function checkIPOSchedule(){
  if(!state.nextIpoDay){ scheduleNextIPO(); return; }
  const ipo = state.pendingIpo;

  // 上場2週間前: IPO情報公開・購入予約(抽選申込)開始
  if(!ipo && state.day===state.nextIpoDay-14){
    announceIPO();
  }
  // 上場1週間前: 公開価格決定・抽選結果発表
  if(ipo && ipo.phase==="announced" && state.day===state.nextIpoDay-7){
    decidePricingAndLottery();
  }
  // 上場日: 初値形成
  if(state.pendingIpo && state.pendingIpo.phase==="priced" && state.day>=state.nextIpoDay){
    finalizeIPOListing();
  }
  // 候補切れなどでIPOが成立しなかった場合は次回の予定を組み直す
  if(!state.pendingIpo && state.day>=state.nextIpoDay){
    scheduleNextIPO();
  }
}

function announceIPO(){
  const usedIds = new Set(state.stocks.map(s=>s.id));
  const candidates = IPO_POOL.filter(c=>!usedIds.has(c.id) && !isRecentlyRetired(c.id));
  if(!candidates.length) return; // 候補が尽きている場合は今回のIPOはスキップされる
  const def = pick(candidates);
  const popularity = computeIpoPopularity(def);
  const assumedPrice = Math.round(def.basePrice*rand(0.92,1.08));
  const winProbability = ipoWinProbability(popularity);
  const applicationMultiplier = Math.max(1, Math.round(popularity*14 + rand(-2,3)));
  const offeredShares = Math.max(1000, Math.round(def.shares*0.08/100)*100);
  const applicantsCount = applicationMultiplier * offeredShares;
  const rank = ipoPopularityRanking(def.id);
  state.pendingIpo = {
    defId: def.id, phase:"announced",
    announceDay: state.day, priceDecisionDay: state.nextIpoDay-7, listDay: state.nextIpoDay,
    assumedPrice, popularity, winProbability, applicationMultiplier, applicantsCount, offeredShares,
    popularityRank: rank.rank, popularityTotal: rank.total,
    kariJoukenLow:null, kariJoukenHigh:null, publicPrice:null,
    playerApplied:false, playerQty:0, playerReservedCash:0,
    lotteryResult:null, allottedQty:0,
  };
  pushNews(`【IPO情報公開】${def.name}(${def.sector})が上場を予定。購入予約(抽選申込)が始まった(想定価格 ¥${fmtNum(assumedPrice)})`, {stars:4, kind:"confirmed", category:"ipo", type:"good"});
  state.ipoUnread = (state.ipoUnread||0) + 1;
  state.ipoJustAnnounced = true; // ゲームループ側で専用ポップアップを1回だけ出すためのフラグ
}

function applyForIPO(qty){
  const ipo = state.pendingIpo;
  if(!ipo || ipo.phase!=="announced") return {ok:false, msg:"現在申込を受け付けているIPOはありません"};
  if(ipo.playerApplied) return {ok:false, msg:"すでに申込済みです"};
  if(!qty || qty<100 || qty%100!==0) return {ok:false, msg:"100株単位で入力してください"};
  const estCost = ipo.assumedPrice*qty*1.15; // 公開価格未定のため、想定価格に余裕を持たせて仮確保する
  if(availableCash()<estCost) return {ok:false, msg:"利用可能な資金が不足しています"};
  ipo.playerApplied = true;
  ipo.playerQty = qty;
  ipo.playerReservedCash = estCost;
  state.reservedCash += estCost;
  const def = getIpoDef();
  pushNews(`${def.name}のIPO抽選に申し込んだ(希望${fmtNum(qty)}株)`, {stars:2, kind:"confirmed", category:"ipo", type:"flavor"});
  saveState();
  return {ok:true, msg:"申込が完了しました"};
}
function cancelIPOApplication(){
  const ipo = state.pendingIpo;
  if(!ipo || !ipo.playerApplied || ipo.phase!=="announced") return {ok:false, msg:"キャンセルできません"};
  state.reservedCash = Math.max(0, state.reservedCash-ipo.playerReservedCash);
  ipo.playerApplied=false; ipo.playerQty=0; ipo.playerReservedCash=0;
  saveState();
  return {ok:true, msg:"申込を取り消しました"};
}

function decidePricingAndLottery(){
  const ipo = state.pendingIpo;
  const def = getIpoDef();
  if(!def){ state.pendingIpo=null; return; }

  const low = Math.max(10, Math.round(ipo.assumedPrice*rand(0.90,0.98)/10)*10);
  const high = Math.max(low+10, Math.round(ipo.assumedPrice*rand(1.03,1.15)/10)*10);
  // 公開価格: 人気が高いほど仮条件レンジの上限寄りに決まりやすい
  const posInRange = clamp(0.15 + ipo.popularity*0.55 + rand(-0.1,0.1), 0.05, 0.98);
  const publicPrice = Math.max(10, Math.round((low + (high-low)*posInRange)/10)*10);
  ipo.kariJoukenLow = low; ipo.kariJoukenHigh = high; ipo.publicPrice = publicPrice;
  ipo.phase = "priced";
  pushNews(`【公開価格決定】${def.name}:仮条件¥${fmtNum(low)}〜¥${fmtNum(high)} → 公開価格¥${fmtNum(publicPrice)}に決定`, {stars:3, kind:"confirmed", category:"ipo", type:"good"});
  state.ipoUnread = (state.ipoUnread||0) + 1;

  if(ipo.playerApplied){
    state.reservedCash = Math.max(0, state.reservedCash-ipo.playerReservedCash);
    const roll = Math.random();
    if(roll < ipo.winProbability){ ipo.lotteryResult="win"; ipo.allottedQty=ipo.playerQty; }
    else if(roll < ipo.winProbability + (1-ipo.winProbability)*0.35){
      ipo.lotteryResult="partial";
      ipo.allottedQty = Math.max(100, Math.round(ipo.playerQty*rand(0.2,0.6)/100)*100);
    } else { ipo.lotteryResult="lose"; ipo.allottedQty=0; }
    if(ipo.lotteryResult==="win" || ipo.lotteryResult==="partial"){
      state.stats.ipoWins = (state.stats.ipoWins||0)+1;
    }

    if(ipo.allottedQty>0){
      const cost = publicPrice*ipo.allottedQty;
      ipo.playerReservedCash = cost;
      state.reservedCash += cost;
      pushNews(`【抽選結果】${def.name}のIPO抽選に${ipo.lotteryResult==="win"?"当選":"補欠当選"}した(${fmtNum(ipo.allottedQty)}株)`, {stars:4, kind:"confirmed", category:"ipo", type:"good"});
    } else {
      ipo.playerReservedCash = 0;
      pushNews(`【抽選結果】${def.name}のIPO抽選は落選だった`, {stars:2, kind:"confirmed", category:"ipo", type:"event"});
    }
  }
  saveState();
}

function finalizeIPOListing(){
  const ipo = state.pendingIpo;
  const def = getIpoDef();
  if(!def){ state.pendingIpo=null; scheduleNextIPO(); return; }

  // 初値の強さ = 企業の評価・人気・市場心理・相場サイクルを総合したスコア
  const strengthScore = (def.quality-0.5)*1.2 + (def.growth-10)/30 + (ipo.popularity-0.5)*0.6
    + (state.macro.sentiment/100)*0.4 + REGIME_DRIFT[state.marketRegime]*40;
  let mult, tier;
  if(strengthScore>0.8){ mult=rand(1.3,1.8); tier="strong"; }
  else if(strengthScore>0.3){ mult=rand(1.05,1.3); tier="normal"; }
  else if(strengthScore>-0.2){ mult=rand(0.92,1.05); tier="soft"; }
  else { mult=rand(0.75,0.92); tier="weak"; }

  const firstPrice = Math.max(10, Math.round(ipo.publicPrice*mult));
  const newStock = makeRuntimeStock({...def, basePrice:firstPrice}, state.day+1);
  newStock.ipoHypeDays = tier==="strong" ? 10 : (tier==="weak" ? 6 : 8);
  if(Math.random()<0.06) newStock.moonshotPotential = true;
  state.stocks.push(newStock);
  pushDisclosure(newStock, {label:"上場", text:`${newStock.name}が上場した(公開価格¥${fmtNum(ipo.publicPrice)})`, impactPct:null, type:"good", stars:5, internalCategory:"ipo"});

  if(ipo.allottedQty>0){
    state.reservedCash = Math.max(0, state.reservedCash-ipo.playerReservedCash);
    const cost = ipo.publicPrice*ipo.allottedQty;
    state.cash -= cost;
    state.portfolio[newStock.id] = {shares:ipo.allottedQty, avgCost:ipo.publicPrice};
    pushNews(`【上場】${newStock.name}が上場した。公開価格¥${fmtNum(ipo.publicPrice)}で当選分${fmtNum(ipo.allottedQty)}株を取得した`, {stars:3, kind:"confirmed", category:"ipo", stockId:newStock.id, type:"good"});
  }

  const changeLabel = tier==="strong" ? "初値高騰" : (tier==="weak" ? "公募割れ" : (mult>=1?"小幅上昇":"小幅下落"));
  const priceDiff = (firstPrice/ipo.publicPrice-1)*100;
  pushNews(`【初値形成】${newStock.name}:公開価格¥${fmtNum(ipo.publicPrice)} → 初値¥${fmtNum(firstPrice)}(${fmtPct(priceDiff)}、${changeLabel})`, {stars:5, kind:"confirmed", category:"ipo", stockId:newStock.id, type: mult>=1?"good":"event"});

  state.pendingIpo = null;
  scheduleNextIPO();
}

function computeHealthScore(st){
  const closes = st.history.slice(-20).map(c=>c.c);
  const trend = closes.length>=2 ? (closes[closes.length-1]/closes[0]-1) : 0;
  return clamp(st.quality*0.5 + clamp(st.growth/30,0,1)*0.3 + clamp(trend*2+0.5,0,1)*0.2, 0, 1);
}
// 企業状態(🟢〜⚠)を実際の財務データ(売上成長率・利益率・地力・既存の上場廃止パイプライン進行度)から判定する。ランダム判定は行わない
function computeCompanyHealthStatus(st){
  if(st.declineStage>=5) return {level:"bankruptcy_risk", label:"倒産リスク", emoji:"⚠"};
  if(st.declineStage>=3) return {level:"crisis", label:"経営危機", emoji:"🔴"};
  if(st.declineStage>=1) return {level:"distressed", label:"業績不振", emoji:"🟠"};
  const margin = st.revenue>0 ? st.profit/st.revenue : -1;
  const health = computeHealthScore(st);
  // 赤字・マイナス成長など、明確に悪い指標が複数重なった場合のみ警告を出す(通常運転の企業まで不振扱いにしない)
  let warnScore = 0;
  if(margin<0) warnScore += 2;
  else if(margin<0.03) warnScore += 1;
  if(st.growth<-5) warnScore += 2;
  else if(st.growth<0) warnScore += 1;
  if(health<0.25) warnScore += 1;
  if(warnScore===0) return {level:"stable", label:"安定企業", emoji:"🟢"};
  if(warnScore<=1) return {level:"declining", label:"業績悪化", emoji:"🟡"};
  if(warnScore<=3) return {level:"distressed", label:"業績不振", emoji:"🟠"};
  return {level:"crisis", label:"経営危機", emoji:"🔴"};
}
// 表示用の倒産リスク目安(実際の上場廃止判定は既存のupdateDeclinePipelineが管理しており、これはあくまで参考値)
function computeBankruptcyRiskDisplay(st){
  if(st.declineStage>=5) return 0.7;
  if(st.declineStage>=3) return 0.25;
  if(st.declineStage>=1) return 0.08;
  const health = computeHealthScore(st);
  return clamp((1-health)*0.15, 0, 0.5);
}
const DECLINE_STAGE_DEFS = [
  null,
  {label:"業績悪化",     text:(n)=>`${n}の業績悪化が明らかになった`,                       priceImpact:[-0.03,-0.08], qualityDelta:-0.05, growthDelta:-2},
  {label:"下方修正",     text:(n)=>`${n}が業績予想を下方修正した`,                         priceImpact:[-0.06,-0.15], qualityDelta:-0.06, growthDelta:-3},
  {label:"投資家離れ",   text:(n)=>`${n}から投資家の資金流出が続いている`,                 priceImpact:[-0.05,-0.12], qualityDelta:-0.05, growthDelta:-2},
  {label:"株価下落",     text:(n)=>`${n}の株価下落に歯止めがかからない`,                   priceImpact:[-0.06,-0.14], qualityDelta:-0.04, growthDelta:-1},
  {label:"監理銘柄指定", text:(n)=>`${n}が監理銘柄に指定された`,                           priceImpact:[-0.10,-0.22], qualityDelta:-0.05, growthDelta:-2},
  {label:"整理銘柄指定", text:(n)=>`${n}が整理銘柄に指定された。上場廃止が確実な情勢に`,   priceImpact:[-0.15,-0.30], qualityDelta:-0.05, growthDelta:-2},
];
function applyStagePriceImpact(st, stageDef){
  const [lo,hi] = stageDef.priceImpact;
  const pct = rand(lo,hi);
  st.prevPrice = st.price;
  st.price = Math.max(1, st.price*(1+pct));
  st.quality = clamp(st.quality+stageDef.qualityDelta, 0.02, 0.97);
  st.growth = clamp(st.growth+stageDef.growthDelta, -8, 40);
  const today = todayCandle(st);
  today.c = st.price; today.l = Math.min(today.l, st.price); today.h = Math.max(today.h, st.prevPrice);
}
function advanceDeclineStage(st){
  st.declineStage += 1;
  st.declineDayAtStage = state.day;
  const stageDef = DECLINE_STAGE_DEFS[st.declineStage];
  const [lo,hi] = stageDef.priceImpact;
  applyStagePriceImpact(st, stageDef);
  pushNews(stageDef.text(st.name), {stars: st.declineStage>=5?5:4, kind:"confirmed", category:"delisting", stockId:st.id, type:"event"});
  pushDisclosure(st, {label: st.declineStage>=5?"上場廃止関連":stageDef.label, text:stageDef.text(st.name), impactPct:(lo+hi)/2, type:"event", stars: st.declineStage>=5?5:4, internalCategory:"delisting"});
}
function finalizeDelisting(st){
  pushNews(`【上場廃止】${st.name}が上場廃止となった`, {stars:5, kind:"confirmed", category:"delisting", stockId:st.id, type:"event"});
  pushDisclosure(st, {label:"上場廃止関連", text:`${st.name}が上場廃止となった`, impactPct:null, type:"event", stars:5, internalCategory:"delisting"});
  const pos = state.portfolio[st.id];
  if(pos){
    const proceeds = st.price*pos.shares;
    state.cash += proceeds;
    const tradePnl = (st.price-pos.avgCost)*pos.shares;
    state.pendingRealizedPL += tradePnl;
    recordTradeStats(tradePnl, st.name);
    delete state.portfolio[st.id];
    pushNews(`保有していた${st.name}(${fmtNum(pos.shares)}株)が上場廃止に伴い${fmtYen(proceeds)}で強制決済された`, {stars:4, kind:"confirmed", category:"delisting", stockId:st.id, type:"event"});
  }
  state.pendingOrders.forEach(o=>{ if(o.stockId===st.id && o.side==="buy" && o.status==="pending") state.reservedCash=Math.max(0,state.reservedCash-o.reservedAmount); });
  state.pendingOrders = state.pendingOrders.filter(o=>o.stockId!==st.id);
  state.pendingRumors = state.pendingRumors.filter(r=>r.stockId!==st.id);
  state.retiredStockIds.push({id:st.id, day:state.day});
  if(state.retiredStockIds.length>40) state.retiredStockIds.shift();
  state.stocks = state.stocks.filter(s=>s.id!==st.id);
}
function updateDeclinePipeline(){
  const inProgress = state.stocks.find(s=>s.declineStage>0 && s.declineStage<6);
  if(inProgress){
    const elapsed = state.day - inProgress.declineDayAtStage;
    if(elapsed >= randInt(18,32)) advanceDeclineStage(inProgress);
    return;
  }
  const readyToDelist = state.stocks.find(s=>s.declineStage===6);
  if(readyToDelist){
    const elapsed = state.day - readyToDelist.declineDayAtStage;
    if(elapsed >= randInt(15,25)) finalizeDelisting(readyToDelist);
    return;
  }
  if(state.stocks.length >= MAX_LISTED_STOCKS){
    const eligible = state.stocks.filter(s => (state.day-(s.listedDay||1))>90 && s.declineStage===0);
    if(eligible.length){
      const weights = eligible.map(s=>Math.max(0.03, 1-computeHealthScore(s)));
      const totalW = weights.reduce((a,b)=>a+b,0);
      let r = Math.random()*totalW;
      let target = eligible[0];
      for(let i=0;i<eligible.length;i++){ r-=weights[i]; if(r<=0){ target=eligible[i]; break; } }
      target.declineStage = 1;
      target.declineDayAtStage = state.day;
      applyStagePriceImpact(target, DECLINE_STAGE_DEFS[1]);
      pushNews(DECLINE_STAGE_DEFS[1].text(target.name), {stars:3, kind:"confirmed", category:"delisting", stockId:target.id, type:"event"});
      const [lo1,hi1] = DECLINE_STAGE_DEFS[1].priceImpact;
      pushDisclosure(target, {label:DECLINE_STAGE_DEFS[1].label, text:DECLINE_STAGE_DEFS[1].text(target.name), impactPct:(lo1+hi1)/2, type:"event", stars:3, internalCategory:"delisting"});
    }
  }
}

/* ==========================================================================
   5. 株価エンジン(1日進める・値幅制限対応)
   ========================================================================== */
function advanceDay(){
  const nikkeiPct = updateMacroAndNikkei();
  state.theme.daysLeft -= 1;
  // 研究員在籍時: テーマ切り替わりの数日前に、次のテーマの兆候をうっすらと察知する
  if(bestResearcherLevel()>0 && state.theme.daysLeft>0 && state.theme.daysLeft<=4 && Math.random()<0.25){
    pushNews("【研究員レポート】次に注目されるテーマの兆候を調査中。市場のセクターローテーションに変化の気配がある。", {stars:2, kind:"rumor", category:"theme", type:"flavor"});
  }
  if(state.theme.daysLeft<=0) rotateTheme();

  let instEvent = null;
  if(Math.random()<0.12) instEvent = buildInstitutionalEvent();
  let materialEvent = null;
  if(Math.random()<0.12) materialEvent = buildMaterialNewsEvent();
  let macroNewsFired = false;
  if(Math.random()<0.10){ spawnMacroNews(); macroNewsFired = true; }

  let bestMover = null;
  for(const st of state.stocks){
    const dayOpen = st.price;
    const idiosyncraticDrift = (st.growth/365)/100;
    const nikkeiTerm = nikkeiPct*st.beta;
    const noise = (Math.random()+Math.random()+Math.random()-1.5)/1.5 * (st.volatility/100);
    let changePct = idiosyncraticDrift + nikkeiTerm + noise;

    // IPO直後は値動きが荒くなりやすい(初値高騰・急落・出来高急増につながる)
    if(st.ipoHypeDays>0){ changePct *= 1.7; st.ipoHypeDays -= 1; }

    // 支持線・抵抗線(直近の価格帯から算出)による日足ベースの値動き調整
    changePct = applySupportResistance(st, dayOpen, changePct);

    // 企業価値(EPS×PER)への収束力(異常な株価インフレを防ぐ)と、過熱後の調整局面
    changePct = applyFundamentalReversion(st, dayOpen, changePct);
    changePct += checkStockCorrection(st);

    // 市場インパクト: プレイヤーの大量注文による需給を、当日の終値形成に反映する(日中の値動きではなく1日単位の需給の結果として扱う)
    if(st.playerNetDemand){
      const avgVol = avg(st.history.slice(-20).map(c=>c.v||1)) || 10000;
      const volRatio = Math.abs(st.playerNetDemand) / avgVol; // 平均出来高に対する注文比率
      // 出来高比が大きいほど非線形に影響が強まる(小さい注文→軽微、出来高並み→大きい、出来高の5〜10倍→極めて大きい)
      const impactMag = clamp(Math.pow(volRatio, 0.85) * 0.05, 0, 0.35);
      const demandPressure = Math.sign(st.playerNetDemand) * impactMag;
      changePct += demandPressure;
      st.playerNetDemand = 0; // 当日の値動きに反映済みなのでリセットする
    }

    if(isThemeMatch(st)) changePct += (state.theme.flowPct/100)*0.005;
    // 投資家掲示板の市場心理: あくまで一要素として、ごく小さく株価に反映する(心理だけで株価は決まらない)
    changePct += computeStockSentiment(st) * 0.004;
    // TOB進行中は、成立期待の強さに応じて株価がTOB価格を意識して動く
    if(state.activeTob && state.activeTob.stockId===st.id && !state.activeTob.resolved){
      const tob = state.activeTob;
      const gapToTob = (tob.price - dayOpen)/dayOpen;
      const controlPct = ((state.portfolio[st.id]?state.portfolio[st.id].shares:0)+tob.appliedShares)/st.shares;
      const expectationStrength = clamp(controlPct*1.5, 0, 0.8); // 成立期待が高いほどTOB価格へ引き寄せられる
      changePct += gapToTob*expectationStrength*0.15;
    }
    if(instEvent && instEvent.stockId===st.id){
      changePct += instEvent.impactPct;
      if(instEvent.impactPct>0.02) changePct += shortSqueezeBoost(st); // 好材料×空売り比率の高さで踏み上げが発生する
    }
    if(materialEvent && materialEvent.stockId===st.id){
      changePct += materialEvent.impactPct;
      if(materialEvent.impactPct>0.02) changePct += shortSqueezeBoost(st);
    }

    // 決算
    st.daysUntilEarnings -= 1;
    let earningsFired = null;
    if(st.daysUntilEarnings===3) pushNews(`決算発表まであと3日:${st.name}`, {stars:2, kind:"confirmed", category:"earnings", stockId:st.id, type:"flavor"});
    if(st.daysUntilEarnings===1 && state.departments.info.level>=4){
      const hint = st.quality>=0.55 ? "決算に強気の見方が広がっている" : (st.quality<=0.45 ? "決算に弱含みとの観測も出ている" : "決算内容は五分五分との見方");
      pushNews(`【市場観測】${st.name}:${hint}`, {stars:2, kind:"rumor", category:"earnings", stockId:st.id, type:"flavor"});
    }
    if(st.daysUntilEarnings<=0){
      earningsFired = resolveEarnings(st);
      changePct += earningsFired.pct;
      if(earningsFired.pct>0.03) changePct += shortSqueezeBoost(st); // 好決算×空売り比率の高さで踏み上げが発生する
      st.earningsCycle = randInt(st.ecMin, st.ecMax);
      st.daysUntilEarnings = st.earningsCycle;
    }

    // 噂
    const rumor = state.pendingRumors.find(r=>r.stockId===st.id);
    let rumorResolved = null;
    if(rumor){
      changePct += rumor.direction==="up" ? 0.0018 : -0.0018;
      if(rumor.resolveDay<=state.day){
        const [lo,hi] = MAG_RANGES[rumor.magKey];
        if(rumor.trueOutcome){ const magPct=rand(lo,hi); changePct += rumor.direction==="up"?magPct:-magPct; rumorResolved={ok:true, magPct: rumor.direction==="up"?magPct:-magPct}; }
        else rumorResolved = {ok:false};
      }
    }

    // 前日の値幅制限で持ち越したモメンタム
    if(st.pendingMomentumPct){ changePct += st.pendingMomentumPct; }

    let rawClose = Math.max(10, dayOpen*(1+changePct));

    // 値幅制限(ストップ高・ストップ安)
    const band = getPriceLimitBand(dayOpen);
    const upperLimit = dayOpen+band;
    const lowerLimit = Math.max(1, dayOpen-band);
    const stopHigh = rawClose >= upperLimit;
    const stopLow = rawClose <= lowerLimit;
    const dayClose = clamp(rawClose, lowerLimit, upperLimit);

    if(stopHigh || stopLow){
      const rawChangePct = (rawClose-dayOpen)/dayOpen;
      const clampedChangePct = (dayClose-dayOpen)/dayOpen;
      st.pendingMomentumPct = clamp((rawChangePct-clampedChangePct)*0.5, -0.4, 0.4);
      st.stopStreak = (st.stopStreak>0 && stopHigh) || (st.stopStreak<0 && stopLow) ? st.stopStreak+(stopHigh?1:-1) : (stopHigh?1:-1);
      st.attentionBoostDays = 3;
    } else {
      st.pendingMomentumPct *= 0.3;
      st.stopStreak = 0;
    }

    st.prevPrice = dayOpen;
    st.price = dayClose;

    // 株価が高くなりすぎた場合、企業価値(=保有者の資産価値)を維持したまま株式分割を行い、単価を適正化する
    checkAutoStockSplit(st);

    // 信用建玉(買い残・売り残)を実際の値動きに応じて更新する(画面表示のたびのランダム生成ではなく、日々推移する実データ)
    {
      const chg = (dayClose-dayOpen)/dayOpen;
      const recentVol = avg(st.history.slice(-10).map(c=>c.v||1)) || (st.shares*0.002);
      st.marginBuyOutstanding = clamp((st.marginBuyOutstanding||0) + Math.round(recentVol*chg*2.2), 0, recentVol*8);
      st.marginSellOutstanding = clamp((st.marginSellOutstanding||0) - Math.round(recentVol*chg*1.6), 0, recentVol*6);
    }

    const bodyRange = Math.abs(dayClose-dayOpen);
    const wick = dayOpen*(st.volatility/100)*rand(0.15,0.55) + bodyRange*rand(0.15,0.45);
    const dayHigh = Math.min(upperLimit, Math.max(dayOpen,dayClose) + wick*Math.random());
    const dayLow = Math.max(lowerLimit, Math.min(dayOpen,dayClose) - wick*Math.random());
    const baseVol = st.shares*0.002;
    const moveBoost = 1+Math.abs(changePct)*8;
    const themeBoost = isThemeMatch(st) ? 1.3 : 1;
    const attentionBoost = st.attentionBoostDays>0 ? 1.6 : 1;
    const v = Math.round(baseVol * rand(0.6,1.5) * moveBoost * themeBoost * attentionBoost * (stopHigh||stopLow?2.2:1));
    st.history.push({o:dayOpen, h:dayHigh, l:dayLow, c:dayClose, day:state.day+1, v, stopHigh, stopLow});
    if(st.history.length>150) st.history.shift();
    if(st.attentionBoostDays>0) st.attentionBoostDays -= 1;

    if(Math.random()<0.01 && !earningsFired){
      st.revenue *= (1 + rand(-0.015,0.015) + st.growth/100/12);
    }

    const techNews = detectTechnicalSignals(st);

    if(earningsFired) pushNews(`【決算発表】${st.name}:${earningsFired.label}(${fmtPct(earningsFired.pct*100)})`, {stars:earningsFired.stars, kind:"confirmed", category:"earnings", stockId:st.id, type: earningsFired.pct>0.01?"good":(earningsFired.pct<-0.01?"event":"flavor"), impactPct:earningsFired.pct});
    if(earningsFired) pushDisclosure(st, {label:"決算", text:`${st.name}:${earningsFired.label}(営業損益${fmtPct(earningsFired.pct*100)})`, impactPct:earningsFired.pct, type: earningsFired.pct>0.01?"good":(earningsFired.pct<-0.01?"event":"flavor"), stars:earningsFired.stars, internalCategory:"earnings"});
    if(earningsFired && earningsFired.stars>=3) triggerNewsBoardBurst(st, earningsFired.pct>0, earningsFired.stars);
    if(rumorResolved){
      if(rumorResolved.ok) pushNews(`【確定情報】${st.name}、噂通りの${rumor.direction==="up"?"好材料":"悪材料"}が正式発表(${fmtPct(rumorResolved.magPct*100)})`, {stars:5, kind:"confirmed", category:"rumor-resolution", stockId:st.id, type: rumor.direction==="up"?"good":"event", impactPct:rumorResolved.magPct});
      else pushNews(`【真相判明】${st.name}に関する噂は事実無根だった`, {stars:2, kind:"confirmed", category:"rumor-resolution", stockId:st.id, type:"flavor"});
      state.pendingRumors = state.pendingRumors.filter(r=>r.id!==rumor.id);
      if(rumorResolved.ok) triggerNewsBoardBurst(st, rumor.direction==="up", 5);
    }
    techNews.forEach(t=>pushNews(t.text, t.opts));
    if(stopHigh) pushNews(`【ストップ高】${st.name}が値幅制限いっぱいまで買われる${st.stopStreak>1?`(${st.stopStreak}日連続)`:""}`, {stars:4, kind:"confirmed", category:"stop", stockId:st.id, type:"good"});
    if(stopLow) pushNews(`【ストップ安】${st.name}が値幅制限いっぱいまで売られる${st.stopStreak<-1?`(${-st.stopStreak}日連続)`:""}`, {stars:4, kind:"confirmed", category:"stop", stockId:st.id, type:"event"});
    if(stopHigh) triggerNewsBoardBurst(st, true, 4);
    if(stopLow) triggerNewsBoardBurst(st, false, 4);

    processPendingOrders(st);

    const pct = (st.price/st.prevPrice-1)*100;
    if(!bestMover || Math.abs(pct)>Math.abs(bestMover.pct)) bestMover = {name:st.name, pct};
  }

  if(instEvent) pushNews(instEvent.text, instEvent.opts);
  if(materialEvent){
    pushNews(materialEvent.text, {stars:materialEvent.stars, kind:"confirmed", category:"material", stockId:materialEvent.stockId, type:materialEvent.type, impactPct:materialEvent.impactPct});
    const matStock = state.stocks.find(s=>s.id===materialEvent.stockId);
    pushDisclosure(matStock, {label:materialEvent.label, text:materialEvent.text, impactPct:materialEvent.impactPct, type:materialEvent.type, stars:materialEvent.stars, internalCategory:"material"});
    if(matStock && materialEvent.stars>=3) triggerNewsBoardBurst(matStock, materialEvent.type==="good", materialEvent.stars);
  }
  if(Math.random()<0.07) spawnRumor();

  const salaryTotal = state.employees.reduce((s,e)=>s+e.salary,0);
  state.cash -= salaryTotal;

  let aiGain = 0;
  if(state.ai.unlocked && state.ai.level>0){ aiGain = totalHoldingsValue()*0.0006*state.ai.level*(0.5+Math.random()); state.cash += aiGain; }

  let feeIncome = 0;
  if(state.fund.active){
    const inflow = state.fund.reputation * rand(800,3200);
    const marketReturn = (state.macro.sentiment/100)*0.01 + rand(-0.006,0.006);
    state.fund.aum = Math.max(0, state.fund.aum*(1+marketReturn) + inflow);
    feeIncome = state.fund.aum*(0.015/365);
    state.cash += feeIncome;
  }

  const prevNW = state.netWorthHistory[state.netWorthHistory.length-1];
  const nw = netWorth();
  const dailyReturn = prevNW>0 ? (nw-prevNW)/prevNW : 0;
  state.fund.reputation = clamp(state.fund.reputation + dailyReturn*300 - 0.15 + bestFundManagerLevel()*0.05, 0, 100);
  state.netWorthHistory.push(nw);
  if(state.netWorthHistory.length>90) state.netWorthHistory.shift();

  // 投資家レベル・実績・証券会社(NPC顧客)の更新
  grantInvestorXP(Math.max(0, dailyReturn*4000) + Math.max(0, state.pendingRealizedPL/4000));
  updateAchievements(nw);
  updateBrokerage(dailyReturn);
  updateThemeFunds();
  checkCompanyFounded();
  checkScoutReport();
  updateVentures();
  checkVentureListings();
  updateRivals();
  updateActiveTob();
  updateMarginPositions();
  updateMarketSentiment();
  updateGlobalCompanies();
  checkLegendaryFeats();
  if(state.day % 10 === 0) checkRankingMilestones();

  state.employees.forEach(e=>{
    e.exp += 1;
    if(e.exp >= e.level*12){
      e.exp=0; e.level+=1;
      const growKey = pick(Object.keys(e.stats));
      e.stats[growKey] = clamp(e.stats[growKey]+randInt(2,5), 0, 99);
      e.salary = salaryFor(e);
      pushNews(`${e.name}(${roleDef(e.role).label})がレベル${e.level}に成長した。`, {stars:2, kind:"confirmed", category:"company", type:"good"});
    }
  });
  if(Math.random()<0.12) state.candidates = freshCandidates();

  const tradePL = state.pendingRealizedPL;
  state.pendingRealizedPL = 0;
  state.financeLog.push({day:state.day, salary:salaryTotal, aiGain, feeIncome, tradePL, net:aiGain+feeIncome+tradePL-salaryTotal});
  if(state.financeLog.length>60) state.financeLog.shift();

  checkMilestones();

  checkIPOSchedule();
  updateDeclinePipeline();

  state.day += 1;
  saveState();
}
function rotateTheme(){
  let next = pick(THEME_DEFS);
  let guard=0;
  while(next.key===state.theme.key && guard<10){ next=pick(THEME_DEFS); guard++; }
  const totalDays = randInt(18,30);
  state.theme = {key:next.key, name:next.name, tags:next.tags, flowPct:randInt(40,120), daysLeft:totalDays, totalDays};
  const sectorList = next.tags.map(t=>TAG_LABELS[t]||t).join("、");
  pushNews(`今月の市場テーマ:「${next.name}」市場への資金流入 +${state.theme.flowPct}%(関連セクター:${sectorList})`, {stars:5, kind:"confirmed", category:"theme", type:"good"});
}

/* ==========================================================================
   会社アクション(人材・AI研究部・IR部)
   ========================================================================== */
function hireEmployee(candId){
  const idx = state.candidates.findIndex(c=>c.id===candId);
  if(idx<0) return {ok:false, msg:"候補者が見つかりません"};
  const cand = state.candidates[idx];
  const hireCost = cand.salary*5;
  if(availableCash() < hireCost) return {ok:false, msg:"採用一時金が不足しています"};
  state.cash -= hireCost;
  state.employees.push(cand);
  state.candidates.splice(idx,1);
  const repl = makeCandidate(Math.random()<0.5?"analyst":"trader");
  repl.salary = salaryFor(repl);
  state.candidates.push(repl);
  pushNews(`${cand.name}を${roleDef(cand.role).label}として採用した。`, {stars:2, kind:"confirmed", category:"company", type:"good"});
  saveState();
  return {ok:true, msg:`${cand.name}を採用しました`};
}

const FUND_THEMES = [
  {key:"ai", label:"AIファンド", tags:["ai"]},
  {key:"semiconductor", label:"半導体ファンド", tags:["semiconductor"]},
  {key:"space", label:"宇宙ファンド", tags:["space"]},

const THEME_FUND_SETUP_COST = 2_000_000;
function themeFundDailyReturn(tags){
  const matching = state.stocks.filter(s=>s.themeTags.some(t=>tags.includes(t)));
  if(!matching.length) return 0;
  return avg(matching.map(s=>(s.price/s.prevPrice-1)));
}
function launchThemeFund(key){
  if(bestFundManagerLevel()<1) return {ok:false, msg:"ファンドマネージャーを採用してください"};
  if(!state.fund.active) return {ok:false, msg:"先に投資信託(基本ファンド)を設立してください"};
  const themeDef = FUND_THEMES.find(t=>t.key===key);
  if(!themeDef) return {ok:false, msg:"不正なテーマです"};
  if(state.themeFunds[key] && state.themeFunds[key].active) return {ok:false, msg:"すでに運用中です"};
  if(availableCash()<THEME_FUND_SETUP_COST) return {ok:false, msg:"資金が不足しています"};
  state.cash -= THEME_FUND_SETUP_COST;
  state.themeFunds[key] = {active:true, aum:1_000_000, reputation:55, feeIncome:0};
  pushNews(`${themeDef.label}を設立した。`, {stars:3, kind:"confirmed", category:"company", type:"good"});

  return {ok:true, msg:`${themeDef.label}を設立しました`};

function updateThemeFunds(){
  FUND_THEMES.forEach(themeDef=>{
    const tf = state.themeFunds[themeDef.key];
    if(!tf || !tf.active) return;
    const ret = themeFundDailyReturn(themeDef.tags);
    tf.reputation = clamp(tf.reputation + ret*500 - 0.1 + bestFundManagerLevel()*0.03, 0, 100);
    const growthFactor = (tf.reputation-50)/50;
    const inflow = Math.max(0, tf.aum*0.001*growthFactor) + rand(50000,300000)*(tf.reputation/50);
    tf.aum = Math.max(0, tf.aum*(1+ret) + inflow);
    const fee = tf.aum*(0.02/365);
    tf.feeIncome = fee;
    state.cash += fee;
  });
}
