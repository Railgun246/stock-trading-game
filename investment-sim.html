function getShareholderData(st){
  ensureShareholderRegistry(st);
  const unified = getUnifiedShareholders(st);
  const total = st.shares;
  const sumBy = (typeFilter)=> unified.filter(typeFilter).reduce((s,h)=>s+h.shares,0);
  const institutional = Math.round(sumBy(h=>h.type==="institutional")/total*100);
  const foreign = Math.round(sumBy(h=>h.type==="foreign")/total*100);
  const individual = Math.max(0, 100-institutional-foreign);

  const holders = unified.slice(0,4).map(h=>({
    name:h.name, shares:h.shares, pct:(h.shares/total*100).toFixed(1), isPlayer:h.type==="player"
  }));

  const pos = state.portfolio[st.id];
  const playerShares = pos ? pos.shares : 0;
  const playerPct = playerOwnershipPct(st);

  const marginBuy = Math.round(st.marginBuyOutstanding||0);
  const marginSell = Math.round(st.marginSellOutstanding||0);
  const shortRatio = st.shares>0 ? (marginSell/st.shares*100).toFixed(1) : "0.0";
  const sharesOutstanding = st.shares;
  const floatShareCount = floatShares(st);
  const majorHolderRatio = (100 - (floatShareCount/sharesOutstanding*100)).toFixed(1);
  return {institutional, foreign, individual, holders, marginBuy, marginSell, shortRatio, sharesOutstanding, floatShareCount, majorHolderRatio, playerPct: playerPct.toFixed(2)};
}
function getRiskFactors(st){
  const rng = mulberry32(hashStr(st.id+"_risk"));
  // 同じテーマタグを持つ他銘柄を「競合」として扱う(実在しない社名の生成を避け、世界観の一貫性を保つ)
  const competitors = state.stocks
    .filter(s=>s.id!==st.id && s.themeTags.some(t=>st.themeTags.includes(t)))
    .slice(0,3).map(s=>s.name);
  const competitorText = competitors.length ? competitors.join("、") : "同業大手各社";
  const financialRisk = st.equityRatio<0.35 ? RISK_TEMPLATES.financial[0] : (st.equityRatio>0.55 ? RISK_TEMPLATES.financial[1] : RISK_TEMPLATES.financial[2]);
  return {
    competitors: competitorText,
    industry: seededPick(RISK_TEMPLATES.industry, rng),
    financial: financialRisk,
    market: seededPick(RISK_TEMPLATES.market, rng),
  };
}
function get3YearTrend(st){
  const g = st.growth/100;
  const rev3 = [st.revenue/Math.pow(1+g,2.4), st.revenue/Math.pow(1+g,1.2), st.revenue];
  const prof3 = [st.profit/Math.pow(1+g*1.3,2.4), st.profit/Math.pow(1+g*1.3,1.2), st.profit];
  return {revenue:rev3, profit:prof3};
}

/* ==========================================================================
   7. 注文システムモジュール(成行/指値/逆指値/OCO)
   日本株と同様、売買単位は100株単位を基本とする。
   既存セーブの端株(100株未満・100株の倍数でない保有分)は売却のみ
   従来通り可能とし、後方互換性を維持する。
   ========================================================================== */
const TRADING_UNIT = 100;
// 発注数量が単元株制度に沿っているかを検証する
// 実績トラッキング(勝率・累計損益・最大利益/損失銘柄などの記録)
function recordTradeStats(pnl, stockName){
  if(!state.stats) return;
  state.stats.totalTrades = (state.stats.totalTrades||0)+1;
  if(pnl>=0){
    state.stats.winTrades = (state.stats.winTrades||0)+1;
    state.stats.realizedProfit = (state.stats.realizedProfit||0)+pnl;
    if(!state.stats.maxProfitTrade || pnl>state.stats.maxProfitTrade.pnl) state.stats.maxProfitTrade = {name:stockName, pnl};
  } else {
    state.stats.realizedLoss = (state.stats.realizedLoss||0)+Math.abs(pnl);
    if(!state.stats.maxLossTrade || pnl<state.stats.maxLossTrade.pnl) state.stats.maxLossTrade = {name:stockName, pnl};
  }
}
function floatShares(st){ return Math.max(TRADING_UNIT, Math.round(st.shares * (st.floatRatio||0.5))); }
// 流動性(発行済株式数・出来高)に基づく約定可能株数。大型株ほど大量注文が通りやすく、小型株は通りにくい
function computeFillableQty(st, qty){
  const recentVols = st.history.slice(-6).map(c=>c.v||1);
  const avgVol = avg(recentVols)||10000;
  const liquidityFactor = clamp(st.shares/3_000_000, 0.4, 3); // 発行済株式数が多い(大型株)ほど流動性が高い
  const capRaw = Math.max(TRADING_UNIT, Math.round(avgVol*0.5*liquidityFactor));
  const cap = Math.floor(capRaw/TRADING_UNIT)*TRADING_UNIT || TRADING_UNIT;
  return Math.min(qty, cap);
}
function validateOrderQty(stockId, side, qty){
  if(!qty || qty<=0) return {ok:false, msg:"数量が不正です"};
  if(side==="buy"){
    if(qty % TRADING_UNIT !== 0 || qty < TRADING_UNIT) return {ok:false, msg:`買い注文は${TRADING_UNIT}株単位で入力してください`};
    const st = state.stocks.find(s=>s.id===stockId);
    if(st){
      const pos = state.portfolio[stockId];
      const currentHeld = pos ? pos.shares : 0;
      const cap = floatShares(st);
      if(currentHeld+qty > cap) return {ok:false, msg:`流通株式数(${fmtNum(cap)}株)を超えて保有することはできません(保有中${fmtNum(currentHeld)}株)`};
    }
  } else {
    const maxQty = availableShares(stockId);
    const isFullClose = qty===maxQty; // 端株を含む保有分を全て売却する場合は例外的に許可(後方互換)
    if(!isFullClose && (qty % TRADING_UNIT !== 0 || qty < TRADING_UNIT)) return {ok:false, msg:`売り注文は${TRADING_UNIT}株単位で入力してください(全株売却の場合を除く)`};
  }
  return {ok:true};
}
function marketSlippage(st, qty){
  const recentVols = st.history.slice(-6).map(c=>c.v||1);
  const avgVol = avg(recentVols)||1;
  const sizeFactor = clamp(3_000_000/(st.shares||3_000_000), 0.5, 3); // 発行済株式数が少ない(小型株)ほど価格への影響が大きい
  const raw = clamp(qty/(avgVol*0.05), 0, 0.025) * sizeFactor;
  return raw * (1 - state.departments.trading.level*0.15 - bestRiskLevel()*0.03);
}

/* ==========================================================================
   信用取引(信用買い・信用売り/空売り)。現物取引とは独立したシステムとして実装する。
   委託保証金・建玉・保証金維持率・追証・金利・貸株料・強制決済・踏み上げを再現する。
   ========================================================================== */
const MARGIN_REQUIREMENT_RATE = 0.33; // 委託保証金率(取引額の約33%、実際の信用取引の最低水準に近い設定)
const MARGIN_CALL_THRESHOLD = 20; // 保証金維持率がこれ(%)を下回ると追証
const MARGIN_SAFE_THRESHOLD = 30; // これ以上で安全
const MARGIN_WARN_THRESHOLD = 25; // これを下回ると注意
const MARGIN_CALL_DEADLINE_DAYS = 3;

function canOpenMarginAccount(){
  const reasons = [];
  if(state.marginAccount && state.marginAccount.opened) reasons.push("すでに信用取引口座を開設しています");
  if(state.investorLevel<10) reasons.push("投資家レベル10以上が必要です");
  if(netWorth()<3_000_000) reasons.push("総資産300万円以上が必要です");
  if((state.stats.totalTrades||0)<10) reasons.push("現物取引の経験(10回以上の取引)が必要です");
  return {ok:reasons.length===0, reasons};
}
function openMarginAccount(){
  const check = canOpenMarginAccount();
  if(!check.ok) return {ok:false, msg:check.reasons.join(" / ")};
  state.marginAccount = {opened:true, openedDay:state.day};
  pushNews("信用取引口座を開設した。信用買い・空売りが可能になった。", {stars:3, kind:"confirmed", category:"company", type:"good"});
  saveState();
  return {ok:true, msg:"信用取引口座を開設しました"};
}
// 銘柄ごとの信用取引・貸借銘柄としての適格性(小型株・新規上場株は対象外とする)
function isMarginEligible(st){ return st.shares>=2_000_000 && (st.listedDay<=1 || (state.day-st.listedDay)>=60); }
function isShortSellEligible(st){ return isMarginEligible(st) && st.shares>=4_000_000 && !st.shortSaleRestricted; }

function marginBuy(stockId, qty){
  if(!state.marginAccount || !state.marginAccount.opened) return {ok:false, msg:"信用取引口座が未開設です"};
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  if(!isMarginEligible(st)) return {ok:false, msg:"この銘柄は信用取引の対象外です"};
  const qv = validateOrderQty(stockId, "buy", qty);
  if(!qv.ok) return qv;
  const fillable = computeFillableQty(st, qty);
  if(fillable<=0) return {ok:false, msg:"市場の流動性不足により約定しませんでした"};
  const execPrice = st.price*(1+marketSlippage(st, fillable));
  const positionValue = execPrice*fillable;
  const requiredMargin = positionValue*MARGIN_REQUIREMENT_RATE;
  if(availableCash()<requiredMargin) return {ok:false, msg:"委託保証金が不足しています"};
  state.cash -= requiredMargin;
  const status = fillable>=qty ? "filled" : "partial";
  const pos = {id:"mp"+Date.now()+randInt(0,999), stockId, side:"long", qty:fillable, entryPrice:execPrice, entryDay:state.day, marginUsed:requiredMargin, accruedInterest:0, accruedBorrowFee:0};
  state.marginPositions.push(pos);
  st.playerNetDemand = (st.playerNetDemand||0) + fillable;
  state.orderHistory.unshift({day:state.day, type:"margin_buy", orderType:"信用買い", stockId, name:st.name, qty:fillable, requestedQty:qty, status, price:execPrice, total:requiredMargin});
  if(state.orderHistory.length>80) state.orderHistory.pop();
  saveState();
  const statusMsg = status==="partial" ? `(一部約定:希望${fmtNum(qty)}株中${fmtNum(fillable)}株のみ)` : "";
  return {ok:true, msg:`信用買い成立:${st.name} ${fmtNum(fillable)}株(委託保証金 ${fmtYen(requiredMargin)})${statusMsg}`, filled:fillable, status};
}
function shortSell(stockId, qty){
  if(!state.marginAccount || !state.marginAccount.opened) return {ok:false, msg:"信用取引口座が未開設です"};
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  if(!isShortSellEligible(st)) return {ok:false, msg:"この銘柄は空売りの対象外です(貸借銘柄でない、または品貸料規制中)"};
  if(!qty || qty<=0 || qty%TRADING_UNIT!==0) return {ok:false, msg:`空売りは${TRADING_UNIT}株単位で入力してください`};
  const fillable = computeFillableQty(st, qty);
  if(fillable<=0) return {ok:false, msg:"市場の流動性不足により約定しませんでした"};
  const execPrice = st.price*(1-marketSlippage(st, fillable));
  const positionValue = execPrice*fillable;
  const requiredMargin = positionValue*MARGIN_REQUIREMENT_RATE;
  if(availableCash()<requiredMargin) return {ok:false, msg:"委託保証金が不足しています"};
  state.cash -= requiredMargin;
  const status = fillable>=qty ? "filled" : "partial";
  const pos = {id:"mp"+Date.now()+randInt(0,999), stockId, side:"short", qty:fillable, entryPrice:execPrice, entryDay:state.day, marginUsed:requiredMargin, accruedInterest:0, accruedBorrowFee:0};
  state.marginPositions.push(pos);
  st.playerNetDemand = (st.playerNetDemand||0) - fillable;
  state.orderHistory.unshift({day:state.day, type:"short_sell", orderType:"信用売り(空売り)", stockId, name:st.name, qty:fillable, requestedQty:qty, status, price:execPrice, total:requiredMargin});
  if(state.orderHistory.length>80) state.orderHistory.pop();
  saveState();
  const statusMsg = status==="partial" ? `(一部約定:希望${fmtNum(qty)}株中${fmtNum(fillable)}株のみ)` : "";
  return {ok:true, msg:`信用売り(空売り)成立:${st.name} ${fmtNum(fillable)}株(委託保証金 ${fmtYen(requiredMargin)})${statusMsg}`, filled:fillable, status};
}
// 返済売り(信用買いの決済)/返済買い(空売りの決済)。どちらもこの関数で扱う(pos.sideで自動判定)
function closeMarginPosition(positionId, qty){
  const pos = state.marginPositions.find(p=>p.id===positionId);
  if(!pos) return {ok:false, msg:"建玉が見つかりません"};
  const st = state.stocks.find(s=>s.id===pos.stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  const closeQty = Math.min(qty, pos.qty);
  const fillable = computeFillableQty(st, closeQty);
  if(fillable<=0) return {ok:false, msg:"市場の流動性不足により決済できませんでした"};
  const ratio = fillable/pos.qty;

  let execPrice, pnl;
  if(pos.side==="long"){
    execPrice = st.price*(1-marketSlippage(st, fillable));
    pnl = (execPrice-pos.entryPrice)*fillable;
    st.playerNetDemand = (st.playerNetDemand||0) - fillable;
  } else {
    execPrice = st.price*(1+marketSlippage(st, fillable));
    pnl = (pos.entryPrice-execPrice)*fillable;
    st.playerNetDemand = (st.playerNetDemand||0) + fillable;
  }
  const marginReturned = pos.marginUsed*ratio;
  const costs = pos.accruedInterest*ratio + pos.accruedBorrowFee*ratio;
  state.cash += marginReturned + pnl - costs;
  state.pendingRealizedPL += pnl - costs;
  recordTradeStats(pnl-costs, st.name);

  pos.marginUsed -= marginReturned;
  pos.accruedInterest -= pos.accruedInterest*ratio;
  pos.accruedBorrowFee -= pos.accruedBorrowFee*ratio;
  pos.qty -= fillable;
  if(pos.qty<=0) state.marginPositions = state.marginPositions.filter(p=>p.id!==positionId);
  state.orderHistory.unshift({day:state.day, type: pos.side==="long"?"margin_sell_close":"short_buy_close", orderType: pos.side==="long"?"信用返済売り":"信用返済買い", stockId:pos.stockId, name:st.name, qty:fillable, requestedQty:qty, status: fillable>=qty?"filled":"partial", price:execPrice, total:pnl-costs});
  if(state.orderHistory.length>80) state.orderHistory.pop();
  saveState();
  return {ok:true, msg:`決済完了:${st.name} ${fmtNum(fillable)}株、損益${pnl-costs>=0?'+':''}${fmtYen(pnl-costs)}`, pnl:pnl-costs};
}
// 保証金維持率をリアルタイムで計算する
function computeMaintenanceRatio(){
  if(!state.marginPositions.length) return null;
  let totalMargin=0, totalPositionValue=0, totalUnrealizedPL=0, totalCosts=0;
  state.marginPositions.forEach(pos=>{
    const st = state.stocks.find(s=>s.id===pos.stockId);
    if(!st) return;
    totalMargin += pos.marginUsed;
    totalPositionValue += st.price*pos.qty;
    totalUnrealizedPL += pos.side==="long" ? (st.price-pos.entryPrice)*pos.qty : (pos.entryPrice-st.price)*pos.qty;
    totalCosts += pos.accruedInterest + pos.accruedBorrowFee;
  });
  if(totalPositionValue<=0) return null;
  const ratio = (totalMargin+totalUnrealizedPL-totalCosts)/totalPositionValue*100;
  return {ratio, totalMargin, totalPositionValue, totalUnrealizedPL, totalCosts};
}
function marginRatioStatusLabel(ratio){
  if(ratio>=MARGIN_SAFE_THRESHOLD) return "安全";
  if(ratio>=MARGIN_WARN_THRESHOLD) return "注意";
  if(ratio>=MARGIN_CALL_THRESHOLD) return "追証警告";
  return "追証";
}
function checkMarginCall(){
  const m = computeMaintenanceRatio();
  if(!m){ state.marginCall=null; return; }
  if(m.ratio < MARGIN_CALL_THRESHOLD){
    if(!state.marginCall){
      const shortfall = Math.round((MARGIN_CALL_THRESHOLD - m.ratio)/100 * m.totalPositionValue);
      state.marginCall = {triggeredDay:state.day, deadline:state.day+MARGIN_CALL_DEADLINE_DAYS, shortfall};
      pushNews(`【追証発生】保証金維持率が${m.ratio.toFixed(1)}%まで低下しました。${MARGIN_CALL_DEADLINE_DAYS}日以内に${fmtYen(shortfall)}相当の保証金を追加するか、ポジションを減らしてください。`, {stars:5, kind:"confirmed", category:"margin", type:"event"});
    }
  } else if(state.marginCall){
    pushNews("保証金維持率が回復し、追証は解消されました。", {stars:3, kind:"confirmed", category:"margin", type:"good"});
    state.marginCall = null;
  }
}
function addMarginCollateral(amount){
  if(!state.marginCall) return {ok:false, msg:"現在追証は発生していません"};
  if(availableCash()<amount) return {ok:false, msg:"資金が不足しています"};
  state.cash -= amount;
  const totalMarginUsed = state.marginPositions.reduce((s,p)=>s+p.marginUsed,0)||1;
  state.marginPositions.forEach(p=>{ p.marginUsed += amount*(p.marginUsed/totalMarginUsed); });
  checkMarginCall();
  saveState();
  return {ok:true, msg:`保証金${fmtYen(amount)}を追加しました`};
}
// 追証未解消時の強制決済(評価損が大きいポジションから順に。パニック的な相場を想定し、通常より大きなスリッページを適用する)
function closeMarginPositionForced(positionId){
  const pos = state.marginPositions.find(p=>p.id===positionId);
  if(!pos) return;
  const st = state.stocks.find(s=>s.id===pos.stockId);
  if(!st){ state.marginPositions = state.marginPositions.filter(p=>p.id!==positionId); return; }
  const panicSlip = marketSlippage(st, pos.qty)*2.5;
  let execPrice, pnl;
  if(pos.side==="long"){ execPrice = st.price*(1-panicSlip); pnl=(execPrice-pos.entryPrice)*pos.qty; st.playerNetDemand=(st.playerNetDemand||0)-pos.qty; }
  else { execPrice = st.price*(1+panicSlip); pnl=(pos.entryPrice-execPrice)*pos.qty; st.playerNetDemand=(st.playerNetDemand||0)+pos.qty; }
  const costs = pos.accruedInterest+pos.accruedBorrowFee;
  state.cash += pos.marginUsed + pnl - costs;
  state.pendingRealizedPL += pnl - costs;
  recordTradeStats(pnl-costs, st.name);
  state.marginPositions = state.marginPositions.filter(p=>p.id!==positionId);
}
function resolveOverdueMarginCall(){
  if(!state.marginCall) return;
  if(state.day < state.marginCall.deadline) return;
  pushNews("【強制決済】追証が解消されなかったため、信用建玉を強制的に決済しました。", {stars:5, kind:"confirmed", category:"margin", type:"event"});
  const sortedIds = [...state.marginPositions].sort((a,b)=>{
    const stA=state.stocks.find(s=>s.id===a.stockId), stB=state.stocks.find(s=>s.id===b.stockId);
    const plA = stA ? (a.side==='long'?(stA.price-a.entryPrice)*a.qty:(a.entryPrice-stA.price)*a.qty) : 0;
    const plB = stB ? (b.side==='long'?(stB.price-b.entryPrice)*b.qty:(b.entryPrice-stB.price)*b.qty) : 0;
    return plA-plB;
  }).map(p=>p.id);
  for(const id of sortedIds){
    const m = computeMaintenanceRatio();
    if(!m || m.ratio>=MARGIN_CALL_THRESHOLD*1.3) break;
    closeMarginPositionForced(id);
  }
  state.marginCall = null;
  saveState();
}
// 信用建玉の日次コスト(信用買い金利・空売り貸株料)を計上する。金利は市場金利に連動し、貸株料は空売り人気度で上昇する
function updateMarginPositions(){
  if(!state.marginAccount || !state.marginAccount.opened || !state.marginPositions.length) return;
  const dailyRate = (state.macro.rate+1.5)/100/365;
  const dailyBorrowBaseRate = 1.1/100/365;
  state.marginPositions.forEach(pos=>{
    const st = state.stocks.find(s=>s.id===pos.stockId);
    if(!st) return;
    const notional = pos.marginUsed/MARGIN_REQUIREMENT_RATE;
    if(pos.side==="long"){
      pos.accruedInterest += notional*dailyRate;
    } else {
      const shortInterestRatio = clamp((st.marginSellOutstanding||0)/floatShares(st), 0, 3);
      const popularityPremium = clamp(shortInterestRatio*0.02, 0, 0.05);
      pos.accruedBorrowFee += notional*(dailyBorrowBaseRate+popularityPremium/365);
    }
  });
  checkMarginCall();
  resolveOverdueMarginCall();
}
// 踏み上げ(ショートスクイーズ): 空売り比率が高い銘柄が好材料に見舞われると、買い戻しにより上昇圧力が増幅される
function shortSqueezeBoost(st){
  if(!isShortSellEligible(st)) return 0;
  const shortRatio = clamp((st.marginSellOutstanding||0)/floatShares(st), 0, 3);
  if(shortRatio<0.15) return 0;
  return clamp(shortRatio*0.08, 0, 0.25);
}

function buyStock(stockId, qty){
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  const qv = validateOrderQty(stockId, "buy", qty);
  if(!qv.ok) return qv;
  const today = todayCandle(st);
  if(today.stopHigh) return {ok:false, msg:"ストップ高のため買い注文が成立していません(比例配分待ち)"};
  const fillable = computeFillableQty(st, qty);
  if(fillable<=0) return {ok:false, msg:"市場の流動性不足により約定しませんでした(未約定)"};
  const status = fillable>=qty ? "filled" : "partial";
  const slip = marketSlippage(st, fillable);
  const execPrice = st.price*(1+slip);
  const cost = execPrice*fillable;
  const fee = cost*feeRate();
  if(availableCash() < cost+fee) return {ok:false, msg:"利用可能な資金が不足しています"};
  state.cash -= (cost+fee);
  const pos = state.portfolio[stockId] || {shares:0, avgCost:0};
  const newShares = pos.shares+fillable;
  pos.avgCost = (pos.avgCost*pos.shares+cost)/newShares;
  pos.shares = newShares;
  state.portfolio[stockId] = pos;
  st.playerNetDemand = (st.playerNetDemand||0) + fillable;
  state.orderHistory.unshift({day:state.day, type:"buy", orderType:"成行", stockId, name:st.name, qty:fillable, requestedQty:qty, status, price:execPrice, total:cost+fee});
  if(state.orderHistory.length>80) state.orderHistory.pop();
  checkOwnershipDisclosure(st, pos.shares-fillable, pos.shares);
  saveState();
  const statusMsg = status==="partial" ? `(一部約定:希望${fmtNum(qty)}株中${fmtNum(fillable)}株のみ)` : "";
  return {ok:true, msg:`${st.name}を${fmtNum(fillable)}株購入(成行、手数料 ${fmtYen(fee)})${statusMsg}`, filled:fillable, requested:qty, status};
}
// 保有比率が開示基準(5/10/20/30/40/50%)を新たに超えた場合のみニュース化する(実データに基づく大株主化の開示)
function checkOwnershipDisclosure(st, sharesBefore, sharesAfter){
  const thresholds = [5,10,20,30,40,50];
  const pctBefore = st.shares>0 ? sharesBefore/st.shares*100 : 0;
  const pctAfter = st.shares>0 ? sharesAfter/st.shares*100 : 0;
  const pname = (state.playerName && state.playerName.trim()) || "投資家";
  thresholds.forEach(t=>{
    if(pctBefore<t && pctAfter>=t){
      let label;
      if(t>=50) label = `${pname}が${st.name}の株式の過半数を取得。経営権争いが本格化する可能性がある`;
      else if(t>=30) label = `${pname}の${st.name}保有比率が${t}%を突破。支配権争いの様相を呈している`;
      else if(t>=20) label = `${pname}の${st.name}保有比率が${t}%を突破。経営への影響力が増している`;
      else if(t>=10) label = `${pname}が${st.name}株の買収観測が浮上する水準まで買い増した(保有${t}%超)`;
      else label = `${pname}が${st.name}の大株主に浮上した(保有${t}%超)`;
      pushNews(`【大量保有】${label}`, {stars: t>=30?5:(t>=10?4:3), kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
    }
  });
}
function sellStock(stockId, qty){
  const st = state.stocks.find(s=>s.id===stockId);
  const pos = state.portfolio[stockId];
  if(!st || !pos) return {ok:false, msg:"保有していません"};
  const qv = validateOrderQty(stockId, "sell", qty);
  if(!qv.ok) return qv;
  const today = todayCandle(st);
  if(today.stopLow) return {ok:false, msg:"ストップ安のため売り注文が成立していません"};
  const maxQty = availableShares(stockId);
  if(qty>maxQty) return {ok:false, msg:"売却可能な株数を超えています(注文中の株数を除く)"};
  const fillable = Math.min(qty, computeFillableQty(st, qty));
  if(fillable<=0) return {ok:false, msg:"市場の流動性不足により約定しませんでした(未約定)"};
  const status = fillable>=qty ? "filled" : "partial";
  const slip = marketSlippage(st, fillable);
  const execPrice = st.price*(1-slip);
  const proceeds = execPrice*fillable;
  const fee = proceeds*feeRate();
  state.cash += (proceeds-fee);
  const tradePnl = (execPrice-pos.avgCost)*fillable - fee;
  state.pendingRealizedPL += tradePnl;
  recordTradeStats(tradePnl, st.name);
  pos.shares -= fillable;
  if(pos.shares<=0) delete state.portfolio[stockId];
  st.playerNetDemand = (st.playerNetDemand||0) - fillable;
  state.orderHistory.unshift({day:state.day, type:"sell", orderType:"成行", stockId, name:st.name, qty:fillable, requestedQty:qty, status, price:execPrice, total:proceeds-fee});
  if(state.orderHistory.length>80) state.orderHistory.pop();
  saveState();
  const statusMsg = status==="partial" ? `(一部約定:希望${fmtNum(qty)}株中${fmtNum(fillable)}株のみ)` : "";
  return {ok:true, msg:`${st.name}を${fmtNum(fillable)}株売却(成行、手数料 ${fmtYen(fee)})${statusMsg}`, filled:fillable, requested:qty, status};
}

// 指値/逆指値/OCO注文の発注
// 注文種別の表示ラベル
const ORDER_TYPE_LABELS = {market:"成行", limit:"指値", stop:"逆指値", oco:"OCO"};
function placeOrder(params){
  const {stockId, side, orderType, qty, limitPrice, stopPrice, ocoLimitPrice, ocoStopPrice, validityDays, tradeCategory, marginAction, positionId} = params;
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  const category = tradeCategory||"spot"; // "spot" | "margin"
  const action = marginAction||null; // "open" | "close" (信用取引のみ)

  if(category==="margin"){
    if(!state.marginAccount || !state.marginAccount.opened) return {ok:false, msg:"信用取引口座が未開設です"};
    if(action==="open" && !isMarginEligible(st)) return {ok:false, msg:"この銘柄は信用取引の対象外です"};
    if(action==="open" && side==="sell" && !isShortSellEligible(st)) return {ok:false, msg:"この銘柄は空売りの対象外です"};
    if(!qty || qty<=0 || qty%TRADING_UNIT!==0) return {ok:false, msg:`${TRADING_UNIT}株単位で入力してください`};
  } else {
    const qv = validateOrderQty(stockId, side, qty);
    if(!qv.ok) return qv;
  }
  if(orderType==="limit" && !canUseLimitOrders()) return {ok:false, msg:"トレード部を設立すると指値注文が利用できます"};
  if(orderType==="stop" && !canUseStopOrders()) return {ok:false, msg:"トレード部Lv.3で逆指値注文が解禁されます"};
  if(orderType==="oco" && !canUseOCOOrders()) return {ok:false, msg:"トレード部Lv.4でOCO注文が解禁されます"};

  const order = { id:"o"+Date.now()+randInt(0,9999), stockId, side, orderType, qty, filledQty:0, createdDay:state.day, validityDays: validityDays||30, status:"pending", reservedAmount:0, tradeCategory:category, marginAction:action, positionId:positionId||null };

  if(orderType==="limit") order.limitPrice = limitPrice;
  if(orderType==="stop") order.stopPrice = stopPrice;
  if(orderType==="oco"){
    if(side!=="sell") return {ok:false, msg:"OCO注文は保有株の利確/損切り設定(売り)専用です"};
    if(category==="margin") return {ok:false, msg:"OCO注文は現物取引のみ対応しています"};
    order.limitPrice = ocoLimitPrice; order.stopPrice = ocoStopPrice;
  }

  if(action==="close"){
    // 信用返済(売/買): 対象建玉の存在と数量を確認する
    const pos = state.marginPositions.find(p=>p.id===positionId);
    if(!pos) return {ok:false, msg:"対象の建玉が見つかりません"};
    if(qty>pos.qty) return {ok:false, msg:"建玉の数量を超えています"};
    if(orderType==="limit" && (!limitPrice||limitPrice<=0)) return {ok:false, msg:"価格を入力してください"};
    if(orderType==="stop" && (!stopPrice||stopPrice<=0)) return {ok:false, msg:"価格を入力してください"};
  } else if(side==="buy"){
    const refPrice = orderType==="limit" ? limitPrice : stopPrice;
    if(!refPrice || refPrice<=0) return {ok:false, msg:"価格を入力してください"};
    const estCost = category==="margin" ? refPrice*qty*MARGIN_REQUIREMENT_RATE : refPrice*qty*(1+feeRate());
    if(availableCash() < estCost) return {ok:false, msg: category==="margin" ? "委託保証金が不足しています" : "利用可能な資金が不足しています"};
    order.reservedAmount = estCost;
    state.reservedCash += estCost;
  } else {
    // 信用新規売(空売り)の新規建て
    if(orderType==="limit" && (!limitPrice||limitPrice<=0)) return {ok:false, msg:"価格を入力してください"};
    if(orderType==="stop" && (!stopPrice||stopPrice<=0)) return {ok:false, msg:"価格を入力してください"};
    if(category==="margin"){
      const refPrice = orderType==="limit" ? limitPrice : stopPrice;
      const estMargin = refPrice*qty*MARGIN_REQUIREMENT_RATE;
      if(availableCash() < estMargin) return {ok:false, msg:"委託保証金が不足しています"};
      order.reservedAmount = estMargin;
      state.reservedCash += estMargin;
    } else {
      const maxQty = availableShares(stockId);
      if(qty>maxQty) return {ok:false, msg:"売却可能な株数を超えています(他の注文分を除く)"};
      if(orderType==="oco" && (!ocoLimitPrice||!ocoStopPrice)) return {ok:false, msg:"利確・損切りの両方の価格を入力してください"};
    }
  }

  state.pendingOrders.push(order);
  saveState();
  return {ok:true, msg:"注文を発注しました", orderId:order.id};
}
// 未約定・一部約定の注文について、指値・逆指値価格や数量を変更する(取消して出し直すのではなく、同一注文として更新する)
function modifyOrder(orderId, changes){
  const order = state.pendingOrders.find(o=>o.id===orderId);
  if(!order) return {ok:false, msg:"注文が見つかりません"};
  if(order.status!=="pending") return {ok:false, msg:"約定済み・取消済みの注文は変更できません"};
  const st = state.stocks.find(s=>s.id===order.stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  const remaining = order.qty - (order.filledQty||0);
  const newQty = changes.qty!==undefined ? changes.qty : order.qty;
  if(newQty <= (order.filledQty||0)) return {ok:false, msg:"数量は約定済み数量より多く指定してください"};
  if(newQty%TRADING_UNIT!==0) return {ok:false, msg:`${TRADING_UNIT}株単位で入力してください`};

  // 売り注文の場合、保有数量・信用建玉数量の超過チェック
  if(order.side==="sell" && order.marginAction!=="close" && order.tradeCategory==="spot"){
    const maxQty = availableShares(order.stockId) + remaining; // 自分自身の未約定分は制約から除外する
    if(newQty-(order.filledQty||0) > maxQty) return {ok:false, msg:"売却可能な株数を超えています"};
  }
  if(order.marginAction==="close"){
    const pos = state.marginPositions.find(p=>p.id===order.positionId);
    if(pos && (newQty-(order.filledQty||0))>pos.qty) return {ok:false, msg:"建玉の数量を超えています"};
  }

  const newLimitPrice = changes.limitPrice!==undefined ? changes.limitPrice : order.limitPrice;
  const newStopPrice = changes.stopPrice!==undefined ? changes.stopPrice : order.stopPrice;

  // 資金拘束の再計算(買い注文・空売り新規建てのみ、価格・数量変更に応じて確保額を調整する)
  if(order.marginAction!=="close"){
    const refPrice = order.orderType==="limit" ? newLimitPrice : newStopPrice;
    if(order.side==="buy" || (order.side==="sell" && order.tradeCategory==="margin")){
      const rate = order.tradeCategory==="margin" ? MARGIN_REQUIREMENT_RATE : (1+feeRate());
      const newRemaining = newQty-(order.filledQty||0);
      const newReserved = refPrice*newRemaining*rate;
      if(availableCash()+order.reservedAmount < newReserved) return {ok:false, msg:"変更後の注文に必要な資金が不足しています"};
      state.reservedCash = Math.max(0, state.reservedCash-order.reservedAmount+newReserved);
      order.reservedAmount = newReserved;
    }
  }

  order.qty = newQty;
  if(order.orderType==="limit") order.limitPrice = newLimitPrice;
  if(order.orderType==="stop") order.stopPrice = newStopPrice;
  if(order.orderType==="oco"){
    if(changes.ocoLimitPrice!==undefined) order.limitPrice = changes.ocoLimitPrice;
    if(changes.ocoStopPrice!==undefined) order.stopPrice = changes.ocoStopPrice;
  }
  order.modifiedDay = state.day;
  saveState();
  return {ok:true, msg:"注文を変更しました"};
}

function cancelOrder(orderId){
  const order = state.pendingOrders.find(o=>o.id===orderId);
  if(!order) return {ok:false, msg:"注文が見つかりません"};
  if(order.status!=="pending") return {ok:false, msg:"すでに約定・取消済みの注文です"};
  if(order.side==="buy" || (order.side==="sell" && order.tradeCategory==="margin" && order.marginAction==="open")){
    state.reservedCash = Math.max(0, state.reservedCash-order.reservedAmount);
  }
  order.status = "cancelled";
  order.cancelledDay = state.day;
  saveState();
  return {ok:true, msg:"注文をキャンセルしました"};
}
// 1日分の株価が確定した後、条件を満たす注文を約定させる(日中高安値を使って判定)。
// 現物・信用(新規/返済)すべてこの関数で扱う。出来高に対して大きい注文は一部約定になる(市場の板・約定システムと共通の仕組みを使う)
function processPendingOrders(st){
  const today = todayCandle(st);
  const related = state.pendingOrders.filter(o=>o.stockId===st.id && o.status==="pending");
  if(!related.length) return;

  const fillOrder = (order, execPrice)=>{
    const remaining = order.qty - (order.filledQty||0);
    if(remaining<=0){ order.status="filled"; return; }
    const fillable = computeFillableQty(st, remaining);
    if(fillable<=0) return;
    const isOpen = order.tradeCategory==="margin" && order.marginAction==="open";
    const isClose = order.tradeCategory==="margin" && order.marginAction==="close";
    let recordTotal = 0;

    if(order.side==="buy"){
      if(today.stopHigh) return;
      if(isOpen){
        const cost = execPrice*fillable;
        const requiredMargin = cost*MARGIN_REQUIREMENT_RATE;
        const releaseAmount = order.reservedAmount*(fillable/order.qty);
        state.reservedCash = Math.max(0, state.reservedCash-releaseAmount);
        order.reservedAmount -= releaseAmount;
        state.cash -= requiredMargin;
        state.marginPositions.push({id:"mp"+Date.now()+randInt(0,999), stockId:st.id, side:"long", qty:fillable, entryPrice:execPrice, entryDay:state.day, marginUsed:requiredMargin, accruedInterest:0, accruedBorrowFee:0});
        st.playerNetDemand = (st.playerNetDemand||0)+fillable;
        recordTotal = requiredMargin;
      } else if(isClose){
        const pos = state.marginPositions.find(p=>p.id===order.positionId);
        if(!pos) return;
        const closeQty = Math.min(fillable, pos.qty);
        const ratio = closeQty/pos.qty;
        const pnl = (pos.entryPrice-execPrice)*closeQty;
        const marginReturned = pos.marginUsed*ratio;
        const costs = (pos.accruedInterest+pos.accruedBorrowFee)*ratio;
        state.cash += marginReturned+pnl-costs;
        state.pendingRealizedPL += pnl-costs;
        recordTradeStats(pnl-costs, st.name);
        pos.marginUsed -= marginReturned; pos.accruedInterest -= pos.accruedInterest*ratio; pos.accruedBorrowFee -= pos.accruedBorrowFee*ratio;
        pos.qty -= closeQty;
        if(pos.qty<=0) state.marginPositions = state.marginPositions.filter(p=>p.id!==pos.id);
        st.playerNetDemand = (st.playerNetDemand||0)+closeQty;
        recordTotal = pnl-costs;
      } else {
        const cost = execPrice*fillable;
        const fee = cost*feeRate();
        const releaseAmount = order.reservedAmount*(fillable/order.qty);
        state.reservedCash = Math.max(0, state.reservedCash-releaseAmount);
        order.reservedAmount -= releaseAmount;
        state.cash -= (cost+fee);
        const pos = state.portfolio[st.id] || {shares:0, avgCost:0};
        const newShares = pos.shares+fillable;
        pos.avgCost = (pos.avgCost*pos.shares+cost)/newShares;
        pos.shares = newShares;
        state.portfolio[st.id] = pos;
        st.playerNetDemand = (st.playerNetDemand||0)+fillable;
        recordTotal = cost+fee;
      }
    } else {
      if(today.stopLow) return;
      if(isOpen){
        const proceeds = execPrice*fillable;
        const requiredMargin = proceeds*MARGIN_REQUIREMENT_RATE;
        const releaseAmount = order.reservedAmount*(fillable/order.qty);
        state.reservedCash = Math.max(0, state.reservedCash-releaseAmount);
        order.reservedAmount -= releaseAmount;
        state.cash -= requiredMargin;
        state.marginPositions.push({id:"mp"+Date.now()+randInt(0,999), stockId:st.id, side:"short", qty:fillable, entryPrice:execPrice, entryDay:state.day, marginUsed:requiredMargin, accruedInterest:0, accruedBorrowFee:0});
        st.playerNetDemand = (st.playerNetDemand||0)-fillable;
        recordTotal = requiredMargin;
      } else if(isClose){
        const pos = state.marginPositions.find(p=>p.id===order.positionId);
        if(!pos) return;
        const closeQty = Math.min(fillable, pos.qty);
        const ratio = closeQty/pos.qty;
        const pnl = (execPrice-pos.entryPrice)*closeQty;
        const marginReturned = pos.marginUsed*ratio;
        const costs = (pos.accruedInterest+pos.accruedBorrowFee)*ratio;
        state.cash += marginReturned+pnl-costs;
        state.pendingRealizedPL += pnl-costs;
        recordTradeStats(pnl-costs, st.name);
        pos.marginUsed -= marginReturned; pos.accruedInterest -= pos.accruedInterest*ratio; pos.accruedBorrowFee -= pos.accruedBorrowFee*ratio;
        pos.qty -= closeQty;
        if(pos.qty<=0) state.marginPositions = state.marginPositions.filter(p=>p.id!==pos.id);
        st.playerNetDemand = (st.playerNetDemand||0)-closeQty;
        recordTotal = pnl-costs;
      } else {
        const proceeds = execPrice*fillable;
        const fee = proceeds*feeRate();
        const pos = state.portfolio[st.id];
        if(!pos || pos.shares<fillable) return;
        state.cash += (proceeds-fee);
        const tradePnl = (execPrice-pos.avgCost)*fillable - fee;
        state.pendingRealizedPL += tradePnl;
        recordTradeStats(tradePnl, st.name);
        pos.shares -= fillable;
        if(pos.shares<=0) delete state.portfolio[st.id];
        st.playerNetDemand = (st.playerNetDemand||0)-fillable;
        recordTotal = proceeds-fee;
      }
    }

    order.filledQty = (order.filledQty||0)+fillable;
    order.lastFillDay = state.day;
    const catLabel = order.tradeCategory==="margin" ? (isOpen ? (order.side==="buy"?"信用新規買":"信用新規売") : (order.side==="buy"?"信用返済買":"信用返済売")) : (order.side==="buy"?"買い":"売り");
    state.orderHistory.unshift({day:state.day, type: order.side, orderType: ORDER_TYPE_LABELS[order.orderType]||order.orderType, tradeCategory:order.tradeCategory, marginAction:order.marginAction, stockId:st.id, name:st.name, qty:fillable, price:execPrice, total:recordTotal});
    if(state.orderHistory.length>80) state.orderHistory.pop();
    if(order.filledQty>=order.qty){
      order.status="filled";
      pushNews(`【約定】${st.name} ${catLabel} ${order.qty}株 @¥${fmtNum(execPrice)}`, {stars:1, kind:"confirmed", category:"order", stockId:st.id, type: order.side==="buy"?"good":"flavor"});
    } else {
      pushNews(`【一部約定】${st.name} ${catLabel} ${fmtNum(fillable)}株(残り${fmtNum(order.qty-order.filledQty)}株) @¥${fmtNum(execPrice)}`, {stars:1, kind:"confirmed", category:"order", stockId:st.id, type:"flavor"});
    }
  };

  related.forEach(order=>{
    if(order.status!=="pending") return;
    // 有効期限切れ
    if(state.day - order.createdDay > order.validityDays){
      if(order.side==="buy" || (order.side==="sell" && order.tradeCategory==="margin" && order.marginAction==="open")){
        state.reservedCash = Math.max(0, state.reservedCash-order.reservedAmount);
      }
      order.status="expired";
      return;
    }
    if(order.orderType==="limit"){
      const cond = order.side==="buy" ? today.l<=order.limitPrice : today.h>=order.limitPrice;
      if(cond) fillOrder(order, order.limitPrice);
    } else if(order.orderType==="stop"){
      const cond = order.side==="buy" ? today.h>=order.stopPrice : today.l<=order.stopPrice;
      if(cond) fillOrder(order, order.stopPrice);
    } else if(order.orderType==="oco"){
      const limitHit = today.h>=order.limitPrice;
      const stopHit = today.l<=order.stopPrice;
      if(limitHit && stopHit){
        // 同日に両方到達した場合、始値から近い方が先に付いたとみなす
        const distLimit = Math.abs(order.limitPrice-today.o);
        const distStop = Math.abs(order.stopPrice-today.o);
        fillOrder(order, distLimit<=distStop ? order.limitPrice : order.stopPrice);
      } else if(limitHit){ fillOrder(order, order.limitPrice); }
      else if(stopHit){ fillOrder(order, order.stopPrice); }
    }
  });
  // 約定・取消・失効した注文は「注文管理」の履歴として一定期間保持し、古いものだけ間引く(無条件に消さない)
  state.pendingOrders = state.pendingOrders.filter(o=> o.status==="pending" || (state.day-(o.lastFillDay||o.cancelledDay||o.createdDay))<60);
}

/* ==========================================================================
   決算・噂・機関投資家フロー
   ========================================================================== */
function resolveEarnings(st){
  const qualityRoll = clamp(st.quality + rand(-0.35,0.35) + (isThemeMatch(st)?0.08:0), 0, 1);
  let pct, label, stars;
  if(qualityRoll>0.62){ pct=rand(0.08,0.32); label="市場予想を上回る好決算"; stars=5; }
  else if(qualityRoll<0.38){ pct=-rand(0.08,0.30); label="市場予想を下回る決算"; stars=5; }
  else { pct=rand(-0.05,0.05); label="市場予想通りの決算内容"; stars=3; }

  // 好決算でも株価が下落するケース(期待先行・高PER・材料出尽くし・将来予想が弱い)
  if(pct>0.10 && Math.random()<0.12){
    const per = st.price/(st.profit/st.shares);
    const reason = per>25 ? "高PERへの警戒感" : pick(["期待先行での材料出尽くし感","将来の業績見通しが市場予想より弱かったこと"]);
    pct = -rand(0.02,0.08);
    label = `好決算だが${reason}から株価は下落`;
  }

  // 業績自体も更新(四季報に反映)。ただし企業規模が大きくなるほど、同じ成長率を維持するのは難しくなる
  // (現実の企業と同様、売上・利益の絶対水準が大きいほど、さらなる比例成長には強い収穫逓減が働く)
  const profitScale = Math.abs(st.profit) / (Math.abs(st.baseProfit)||Math.abs(st.profit)||1);
  const scaleDamping = clamp(1 / Math.pow(1+Math.max(0,Math.log10(profitScale)), 2.3), 0.01, 1);
  st.revenue *= (1 + (pct*0.5 + st.growth/100/4) * scaleDamping);
  st.profit  *= (1 + (pct*1.1 + st.growth/100/4) * scaleDamping);
  // 創業時利益の数千倍程度を、超長期でも到達しうる現実的な上限の目安とする(それ以上は極めて稀な世界的大企業のみ)
  const profitCeiling = Math.abs(st.baseProfit||st.profit||1) * 4000;
  st.profit = clamp(st.profit, -profitCeiling*0.3, profitCeiling);
  st.revenue = clamp(st.revenue, 1e6, Math.abs(st.baseRevenue||st.revenue||1)*4000);
  st.equity  += st.profit*0.15;

  // 成長率のゆるやかな平均回帰: 高成長企業もいずれ成熟し、定常成長率(6%程度)に収束していく
  // (乖離が大きいほど強く引き戻すことで、数十年スケールでの利益の際限ない複利膨張を防ぐ)
  const growthTarget = 6;
  const meanReversionForce = (st.growth - growthTarget) * -0.035;
  st.growth = clamp(st.growth + rand(-1.2,1.2) + meanReversionForce, -8, 45);
  // 企業の「地力」も、極端な優位性が永続しないよう非常に緩やかに平均へ回帰する
  // (一時的な絶好調が過ぎれば、競合の追い上げや市場の成熟によって強みは徐々に希薄化するという現実の力学を表す)
  const qualityTarget = 0.60;
  const qualityReversion = (st.quality - qualityTarget) * -0.01;
  st.quality = clamp(st.quality + rand(-0.015,0.015) + qualityReversion, 0.05, 0.95);

  // 大化け企業の芽(隠しフラグ): 好決算が続くほど地力と成長率がじわじわ加速する(平均回帰に抗う、ごく低確率の例外)
  // ただし、質が高くなるほど「好決算が出やすくなる→さらに質が上がる」という際限のない自己強化ループに陥らないよう、
  // 上限に近づくほど伸び幅が小さくなる(逓減する)ようにする。成長ブースト自体も、上場から約5年で終了し、
  // その後は他の企業と同じ速度で成熟(平均回帰)していく
  if(st.moonshotPotential && (state.day - (st.listedDay||1)) < 1825){
    st.quality = clamp(st.quality + 0.012*(1-st.quality), 0, 0.9);
    if(pct>0 && Math.random()<0.6) st.growth = clamp(st.growth + rand(0.4,1.8), -8, 35);
  }

  if(!st.earningsLog) st.earningsLog=[];
  st.earningsLog.push({day:state.day, pct, label, revenue:st.revenue, profit:st.profit});
  if(st.earningsLog.length>8) st.earningsLog.shift();
  return {pct, label, stars};
}
function spawnRumor(){
  if(state.pendingRumors.length>=3) return;
  const candidates = state.stocks.filter(st=>!state.pendingRumors.find(r=>r.stockId===st.id));
  if(!candidates.length) return;
  const st = pick(candidates);
  const direction = Math.random()<0.5?"up":"down";
  const magKey = pick(["小幅","ある程度","大幅"]);
  const trueBias = direction==="up" ? (st.quality-0.5) : (0.5-st.quality);
  const trueOutcome = Math.random() < clamp(0.5+trueBias*0.4, 0.15, 0.85);
  const resolveDay = state.day + randInt(2,5);
  state.pendingRumors.push({id:"r"+state.day+st.id, stockId:st.id, direction, magKey, trueOutcome, resolveDay, confidence: clamp(0.5+trueBias*0.4,0.1,0.9)});
  const dirText = direction==="up" ? "好材料" : "悪材料";
  pushNews(`【市場の噂】${st.name}に関する${dirText}が浮上か(${magKey})`, {stars:randInt(2,4), kind:"rumor", category:"rumor", stockId:st.id, type:"flavor"});
}
function buildInstitutionalEvent(){
  const st = pick(state.stocks);
  const inst = pick(INSTITUTIONS);
  const buy = Math.random()<0.5;
  const sharesM = randInt(10,80);
  const impactPct = rand(0.003,0.012) * (buy?1:-1);
  let text = `${inst}が${st.name}を${sharesM}万株${buy?"買い増し":"売却"}`;
  if(state.departments.info.level>=2){
    text += buy ? "(まとまった買い需要を観測)" : "(ポジション調整との見方)";
  }
  return {stockId:st.id, impactPct, text, opts:{stars:randInt(2,3), kind:"confirmed", category:"institutional", stockId:st.id, type:buy?"good":"event"}};
}
function buildMaterialNewsEvent(){
  const st = pick(state.stocks);
  const def = pick(DISCLOSURE_DEFS);
  let mag = rand(def.mag[0], def.mag[1]);
  // 発表内容だけで株価が決まらないよう、市場環境(センチメント)と企業の評価(quality)で反応の強さを調整する
  const sentimentFactor = state.macro.sentiment/100; // -1..1
  const marketMult = def.good
    ? clamp(1 + sentimentFactor*0.3 + (isThemeMatch(st)?0.1:0), 0.6, 1.5)
    : clamp(1 - sentimentFactor*0.3 + (isThemeMatch(st)?0.05:0), 0.6, 1.6);
  const qualityMult = def.good ? clamp(0.8+st.quality*0.5, 0.8, 1.3) : clamp(1.3-st.quality*0.5, 0.8, 1.3);
  mag = mag * marketMult * qualityMult * (def.good?1:-1);

  // 増資・株式分割・自社株買いは発行済株式数などの構造的な変化を伴う
  applyCapitalStructureEvent(st, def.type);

  return {stockId:st.id, impactPct:mag, text:def.text(st.name), stars:def.stars, type:def.good?"good":"event", label:def.type};
}
// 資金調達イベント: 新株発行(希薄化)・株式分割(流動性向上)・自社株買い(EPS改善)による構造変化
function applyCapitalStructureEvent(st, type, explicitSplitRatio){
  if(state.activeTob && state.activeTob.stockId===st.id && !state.activeTob.resolved) return; // TOB進行中は株式数を変動させない(整合性を保つため)
  ensureShareholderRegistry(st);
  if(type==="増資"){
    const dilutionRatio = rand(0.08,0.20);
    const newShares = Math.round(st.shares*dilutionRatio);
    st.shares += newShares; // 発行済株式数の増加→EPS低下・持ち株比率低下として以降の計算に自然に反映される
    adjustShareholderRegistryForCapitalEvent(st, "増資", newShares);
  } else if(type==="株式分割"){
    const splitRatio = explicitSplitRatio || pick([2,3]);
    st.shares *= splitRatio;
    st.price = st.price/splitRatio;
    st.prevPrice = st.prevPrice/splitRatio;
    st.history.forEach(c=>{ c.o/=splitRatio; c.h/=splitRatio; c.l/=splitRatio; c.c/=splitRatio; });
    const pos = state.portfolio[st.id];
    if(pos){ pos.shares*=splitRatio; pos.avgCost/=splitRatio; }
    st.floatRatio = clamp((st.floatRatio||0.5)+0.03, 0.3, 0.85); // 分割により流動性が改善する
    adjustShareholderRegistryForCapitalEvent(st, "株式分割", splitRatio);
  } else if(type==="自社株買い"){
    const buybackRatio = rand(0.02,0.06);
    const retiredShares = Math.min(Math.round(st.shares*buybackRatio), st.shares-100000);
    st.shares = Math.max(100000, st.shares-retiredShares); // 発行済株式数の減少→EPS改善
    adjustShareholderRegistryForCapitalEvent(st, "自社株買い", retiredShares);
  }
  reconcileShareholderRegistry(st);
}
// 株価が高くなりすぎた場合、企業価値(プレイヤーの資産価値)を一切変えずに株式分割で単価を適正化する。
// 「強制的に下げる」のではなく、経営判断的な間隔でゆるやかに実施する(閾値超えの日すべてで即座には発動しない)
function checkAutoStockSplit(st){
  const threshold = 50000;
  if(st.price < threshold) return;
  if(state.activeTob && state.activeTob.stockId===st.id && !state.activeTob.resolved) return;
  if(Math.random() >= 0.025) return;
  const splitRatio = st.price >= 200000 ? 5 : (st.price >= 100000 ? 3 : 2);
  const before = st.price;
  applyCapitalStructureEvent(st, "株式分割", splitRatio);
  pushNews(`${st.name}が1:${splitRatio}の株式分割を実施した(¥${fmtNum(before)}→¥${fmtNum(st.price)})。投資家がより購入しやすい水準に単価が調整された。`, {stars:3, kind:"confirmed", category:"venture", stockId:st.id, type:"good"});
}

// 投資家レベル(Lv.1〜100)。XPは日々の運用成績・実現利益から緩やかに得る
const LEVEL_TITLES = [
  {lv:1,  title:"個人投資家"}, {lv:11, title:"専業投資家"}, {lv:31, title:"カリスマ投資家"},
  {lv:51, title:"機関投資家"}, {lv:81, title:"伝説の投資家"},
];
function xpForLevel(lv){ return Math.round(300*Math.pow(lv,1.7)); }
function levelFromXP(xp){ let lv=1; while(lv<100 && xpForLevel(lv+1)<=xp) lv++; return lv; }
function levelTitle(lv){ let t=LEVEL_TITLES[0].title; for(const e of LEVEL_TITLES) if(lv>=e.lv) t=e.title; return t; }
function xpProgress(){
  const cur = xpForLevel(state.investorLevel);
  const next = state.investorLevel<100 ? xpForLevel(state.investorLevel+1) : cur;
  const progress = next>cur ? clamp((state.investorXP-cur)/(next-cur)*100,0,100) : 100;
  return {cur, next, progress};
}
function grantInvestorXP(amount){
  state.investorXP += Math.max(0,amount);
  const newLevel = levelFromXP(state.investorXP);
  if(newLevel>state.investorLevel){
    state.investorLevel = newLevel;
    pushNews(`投資家レベルが${newLevel}に上昇した(${levelTitle(newLevel)})。`, {stars:3, kind:"confirmed", category:"company", type:"good"});
  }
}

// NPCライバル投資家(単純化したシミュレーションで緩やかに成長する)
// 投資スタイルの自動判定(実際の売買履歴・IPO・買収・企業育成の実績から分析する)
function detectInvestmentStyle(){
  const buys = state.orderHistory.filter(o=>o.type==="buy");
  const scores = {growth:0, value:0, dividend:0, ipo:0, ma:0, incubator:0};
  buys.forEach(o=>{
    const st = state.stocks.find(s=>s.id===o.stockId);
    if(!st) return;
    if(st.growth>=20) scores.growth++;
    const per = st.profit>0 ? st.price/(st.profit/st.shares) : 999;
    if(per>0 && per<12) scores.value++;
    const divYield = (st.profit*0.3/st.shares)/st.price*100;
    if(divYield>=3.5) scores.dividend++;
  });
  if((state.stats.ipoWins||0)>=3) scores.ipo += 6;
  if((state.stats.acquisitionCount||0)>=2) scores.ma += 6;
  const ventureActionCount = state.ventures.filter(v=>v.cumulativeInvestment>v.investedCapital).length;
  if(ventureActionCount>=2) scores.incubator += 6;

  const labels = {growth:"成長株投資家", value:"バリュー投資家", dividend:"高配当投資家", ipo:"IPO投資家", ma:"M&A投資家", incubator:"企業育成型投資家"};
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  if(!best || best[1]<=0) return null;
  return labels[best[0]];
}

// 世界企業時価総額ランキング(架空の海外企業+ゲーム内の日本企業+プレイヤーが育てた企業)
// 世界企業(理論企業価値ベースで評価する。単純なランダムウォークではなく、日本株側と同等の
// 「業績→成長率の平均回帰→理論価値への収束」構造を採用し、長期プレイでも天文学的な数値にならないようにする)
const GLOBAL_COMPANIES = [
  {id:"gc1", name:"Global Tech Holdings",       region:"アメリカ",   sector:"テクノロジー", baseRevenue:220e12, baseProfit:42e12, growth:9,  quality:0.72},
  {id:"gc2", name:"Next Future Industries",     region:"アメリカ",   sector:"テクノロジー", baseRevenue:190e12, baseProfit:34e12, growth:8,  quality:0.68},
  {id:"gc3", name:"Pinnacle Dynamics Corp",     region:"アメリカ",   sector:"製造業",       baseRevenue:160e12, baseProfit:26e12, growth:5,  quality:0.60},
  {id:"gc4", name:"Continental Engineering AG", region:"ヨーロッパ", sector:"素材",         baseRevenue:120e12, baseProfit:16e12, growth:3,  quality:0.55},
  {id:"gc5", name:"Nordic Quantum Systems",     region:"ヨーロッパ", sector:"次世代技術",   baseRevenue:60e12,  baseProfit:11e12, growth:12, quality:0.65},
  {id:"gc6", name:"Zhonghua Innovation Group",  region:"中国",       sector:"IT",           baseRevenue:150e12, baseProfit:24e12, growth:10, quality:0.62},
  {id:"gc7", name:"Dragon Cloud Technologies",  region:"中国",       sector:"AI",           baseRevenue:90e12,  baseProfit:15e12, growth:14, quality:0.63},
  {id:"gc8", name:"Bharat Digital Enterprises", region:"インド",     sector:"IT",           baseRevenue:55e12,  baseProfit:8e12,  growth:16, quality:0.58},
  {id:"gc9", name:"Mekong Growth Holdings",     region:"東南アジア", sector:"金融",         baseRevenue:20e12,  baseProfit:3e12,  growth:13, quality:0.50},
];
const GLOBAL_COMPANY_SECTORS = ["AI","半導体","宇宙","防衛","EV","ロボット","バイオ","エネルギー","金融","IT","食品","小売","素材","医療","次世代技術"];
const GLOBAL_COMPANY_NAME_PARTS = {base:["Nova","Apex","Vertex","Quantum","Horizon","Titan","Nexus","Prime","Stellar","Fusion","Orbit","Aurora"], suffix:["Systems","Holdings","Group","Industries","Technologies","Dynamics","Corp","Networks","Labs"]};
function initGlobalCompanyRuntime(def, bornDay){
  return {...def, revenue:def.baseRevenue, profit:def.baseProfit, growth:def.growth, quality:def.quality,
    stage:"growth", bornDay: bornDay||1, deathDay:null, capCurrent: Math.max(1e9, def.baseProfit*computeGlobalPER(def.growth, def.quality))};
}
function generateGlobalCompanies(){ return GLOBAL_COMPANIES.map(g=>initGlobalCompanyRuntime(g,1)); }
function computeGlobalPER(growth, quality){
  const growthPremium = clamp(growth/100, -0.15, 0.5);
  const qualityPremium = (quality-0.5)*0.5;
  return clamp(14*(1+growthPremium+qualityPremium), 4, 40);
}
// 理論企業価値(業績×妥当なPER)。実際の時価総額はこの理論値へ緩やかに収束する
function globalCompanyFairValue(g){ return Math.max(1e9, g.profit*computeGlobalPER(g.growth, g.quality)); }
function updateGlobalCompanies(){
  checkNewGlobalCompanyBirth();
  state.globalCompanies.forEach(g=>{
    if(g.stage==="dead") return;
    // 成長率は(日本株と同様に)緩やかに定常成長率へ収束する。巨大企業ほど低成長に落ち着く現実の力学を反映
    const growthTarget = 3.5;
    g.growth = clamp(g.growth + rand(-0.35,0.35) + (g.growth-growthTarget)*-0.006, -10, 35);
    g.quality = clamp(g.quality + rand(-0.004,0.004) + (g.quality-0.55)*-0.004, 0.1, 0.95);
    // 規模が大きくなるほど比例成長には収穫逓減が働く(日本株の仕組みと同一の考え方)
    const scale = Math.abs(g.profit)/(Math.abs(g.baseProfit)||Math.abs(g.profit)||1);
    const damping = clamp(1/Math.pow(1+Math.max(0,Math.log10(scale)),2.1), 0.02, 1);
    g.profit *= (1 + (g.growth/100/365)*damping);
    g.revenue *= (1 + (g.growth/100/365*0.7)*damping);
    g.profit = clamp(g.profit, -Math.abs(g.baseProfit)*3000, Math.abs(g.baseProfit)*3000);

    // 実際の時価総額は理論企業価値へ緩やかに収束しつつ、短期的な市場心理のノイズを伴う
    const fv = globalCompanyFairValue(g);
    const gapPct = (fv - g.capCurrent)/g.capCurrent;
    const reversion = gapPct<0 ? clamp(gapPct*0.02, -0.05, 0) : clamp(gapPct*0.01, 0, 0.03);
    g.capCurrent = Math.max(1e8, g.capCurrent*(1+reversion+rand(-0.006,0.006)));

    updateGlobalCompanyLifecycle(g);
  });
}
// 企業のライフサイクル(成長期→成熟期→衰退期→再建 or 消滅)。永遠に成長し続ける・上位に居座り続けることを防ぐ
function updateGlobalCompanyLifecycle(g){
  // 経営危機ショック(低確率): 競争激化・技術革新への対応遅れなどを想定し、業績が急激に悪化するきっかけを作る
  if((g.stage==="growth"||g.stage==="mature") && Math.random()<0.00008){
    g.growth = clamp(g.growth - rand(8,20), -15, g.growth);
    g.quality = clamp(g.quality - rand(0.1,0.25), 0.05, g.quality);
  }
  if(g.stage==="growth" && g.growth<3 && Math.random()<0.001) g.stage="mature";
  if(g.stage==="mature" && (g.growth<0 || g.quality<0.4) && Math.random()<0.0015) g.stage="decline";
  if(g.stage==="decline"){
    if(Math.random()<0.002){
      if(Math.random()<0.35){ g.stage="mature"; g.growth=clamp(g.growth+rand(4,10),1,15); g.quality=clamp(g.quality+rand(0.05,0.15),0,1); }
      else { g.stage="dead"; g.deathDay=state.day; }
    }
  }
}
// 新興企業の継続的な誕生(100年プレイしても最初の顔ぶれだけでランキングが固定化しないようにする)
function checkNewGlobalCompanyBirth(){
  const aliveCount = state.globalCompanies.filter(g=>g.stage!=="dead").length;
  if(aliveCount>=13) return;
  if(Math.random()>=0.0012) return;
  const name = `${pick(GLOBAL_COMPANY_NAME_PARTS.base)} ${pick(GLOBAL_COMPANY_NAME_PARTS.suffix)}`;
  const def = {
    id:"gc_new"+Date.now()+randInt(0,999), name, region:pick(["アメリカ","ヨーロッパ","中国","インド","東南アジア"]),
    sector:pick(GLOBAL_COMPANY_SECTORS), baseRevenue:rand(0.3,3)*1e9, baseProfit:rand(0.05,0.6)*1e9,
    growth:rand(15,45), quality:rand(0.3,0.6),
  };
  state.globalCompanies.push(initGlobalCompanyRuntime(def, state.day));
  // 消滅済み企業を間引く(記録として一定期間は残す)
  state.globalCompanies = state.globalCompanies.filter(g=>g.stage!=="dead" || (state.day-(g.deathDay||0))<1825);
}
function computeWorldRanking(){
  const entries = [];
  state.globalCompanies.filter(g=>g.stage!=="dead").forEach(g=> entries.push({name:g.name, region:g.region, cap:g.capCurrent, isPlayer:false}));
  state.stocks.forEach(st=>{
    const v = state.ventures.find(x=>x.listedStockId===st.id && x.stage==="listed");
    entries.push({name:st.name, region:"日本", cap:st.price*st.shares, isPlayer: !!v});
  });
  entries.sort((a,b)=>b.cap-a.cap);
  return entries;
}

function computeRankings(){
  const playerName = state.playerName || "あなた";
  const playerNW = netWorth();
  const playerLevel = state.investorLevel;
  const playerVentureValue = bestPlayerVentureValue();
  const playerIpoCount = state.ventures.filter(v=>v.stage==="listed").length;
  const playerTenbaggers = state.stats.tenBaggers||0;

  const rank = (metricFn)=>{
    const list = [...state.rivals.map(r=>({name:r.name, value:metricFn(r)})), {name:playerName, value:metricFn({isPlayer:true})}]
      .sort((a,b)=>b.value-a.value);
    return {list, rank: list.findIndex(x=>x.name===playerName)+1, total: list.length};
  };
  const worldList = computeWorldRanking();
  const playerWorldEntries = worldList.filter(e=>e.isPlayer);
  const bestWorldRank = playerWorldEntries.length ? worldList.findIndex(e=>e===playerWorldEntries[0])+1 : null;
  return {
    netWorth: rank(r=>r.isPlayer?playerNW:r.netWorthBase),
    level: rank(r=>r.isPlayer?playerLevel:r.levelBase),
    ventureValue: rank(r=>r.isPlayer?playerVentureValue:r.ventureValueBase),
    ipo: rank(r=>r.isPlayer?playerIpoCount:r.ipoCount),
    tenbagger: rank(r=>r.isPlayer?playerTenbaggers:r.tenbaggerCount),
    world: {list:worldList, rank:bestWorldRank, total:worldList.length},
  };
}

    queueCelebration("世界企業誕生!", `${pname}が育てた企業が世界的企業へと成長した。`);
  }
  if(!f.marketDominator){
    const rankings = computeRankings();
    const trillionaire = netWorth()>=1_000_000_000_000;
    const top5Cap = state.ventures.filter(v=>v.stage==="listed").filter(v=>{
      const sorted = [...state.stocks].sort((a,b)=>(b.price*b.shares)-(a.price*a.shares));
      const idx = sorted.findIndex(s=>s.id===v.listedStockId);
      return idx>=0 && idx<5;
    }).length>=1;
    const multiGroup = state.ventures.filter(v=>v.stage==="listed" && (v.subsidiaries||[]).length>0).length>=1;
    if(trillionaire || (top5Cap && multiGroup)){
      f.marketDominator = true;
      queueCelebration("市場の支配者", `${pname}は金融帝国を築き上げた。「市場の支配者」の称号を獲得した。`);
    }
  }
}

function themeMatches(themeDef, st){
  if(themeDef.tags.length) return st.themeTags.some(t=>themeDef.tags.includes(t));
  if(themeDef.key==="high_dividend") return ((st.profit*0.3/st.shares)/st.price*100)>=3.5;
  if(themeDef.key==="value") return (st.price/(st.profit/st.shares))<12;
  if(themeDef.key==="smallcap_growth") return st.price*st.shares<100e8 && st.growth>=15;
  return false;
}
function themeSpecializationModifier(st){
  if(!state.investmentTheme) return 0;
  const theme = INVESTMENT_THEMES.find(t=>t.key===state.investmentTheme);
  if(!theme) return 0;
  if(theme.key==="diversified") return -0.01; // 分散投資は全体にわずかなボーナス、ペナルティなし
  return themeMatches(theme, st) ? -0.03 : 0.02;
}
function setInvestmentTheme(key){

// 企業スカウト(月次レポート)。アナリスト系人材のレベルに応じて精度が変わる
function generateScoutReport(){
  const level = effectiveAnalystLevel();
  if(level<=0) return null;
  const smallCaps = state.stocks.filter(s=> s.price*s.shares<80e8 && s.declineStage===0);
  if(!smallCaps.length) return null;
  const scored = smallCaps.map(s=>({s, score: computeForecast(s).prob + (s.moonshotPotential?0.15:0) + rand(-0.1,0.1)}));
  scored.sort((a,b)=>b.score-a.score);
  const pickStock = scored[0].s;
  const revGrowth = Math.round(pickStock.growth + rand(-3,8));
  const profGrowth = Math.round(revGrowth*1.4 + rand(-5,10));
  const industryGrowth = Math.round(revGrowth*0.8 + rand(-3,3));
  const per = (pickStock.price/(pickStock.profit/pickStock.shares)).toFixed(1);
  let comment;
  if(level<5) comment = "成長企業の可能性があります。";
  else if(level<10) comment = "業績成長が加速しています。";
  else if(level<15) comment = "市場予想を上回る成長が期待されます。";
  else comment = "現在の株価は将来成長を十分に織り込んでいない可能性があります。";
  return { day:state.day, stockId:pickStock.id, name:pickStock.name, revGrowth, profGrowth, industryGrowth, per, comment };
}
function checkScoutReport(){
  const interval = clamp(30 - bestResearcherLevel()*2, 12, 30); // 研究員のレベルが高いほどレポート頻度が上がる
  if(state.day - state.lastScoutDay < interval) return;
  state.lastScoutDay = state.day;
  const report = generateScoutReport();
  if(!report) return;
  state.scoutReports.unshift(report);
  if(state.scoutReports.length>10) state.scoutReports.pop();
  pushNews(`【未発掘企業レポート】調査部より新しいレポートが届いた(${report.name}に注目)`, {stars:3, kind:"confirmed", category:"scout", stockId:report.stockId, type:"good"});
}

// 実績・発掘株トラッキング(10倍株・5倍株の発見、勝率、最大ドローダウン等)
function updateAchievements(nw){
  if(!state.stats) return;
  if(nw>state.stats.peakNetWorth) state.stats.peakNetWorth = nw;
  const drawdown = state.stats.peakNetWorth>0 ? (state.stats.peakNetWorth-nw)/state.stats.peakNetWorth*100 : 0;
  if(drawdown>state.stats.maxDrawdown) state.stats.maxDrawdown = drawdown;

  for(const id in state.portfolio){
    const pos = state.portfolio[id];
    const st = state.stocks.find(s=>s.id===id);
    if(!st) continue;
    const multiple = st.price/pos.avgCost;
    if(multiple>=10 && !pos.hit10x){
      pos.hit10x = true; pos.hit5x = true;
      state.stats.tenBaggers = (state.stats.tenBaggers||0)+1;
      state.discoveries.unshift({name:st.name, multiple:multiple.toFixed(1), day:state.day, type:"10x"});
      if(state.discoveries.length>30) state.discoveries.pop();
      grantInvestorXP(300);
      pushNews(`早期から注目していた${st.name}が10倍株に成長した!`, {stars:5, kind:"confirmed", category:"milestone", stockId:st.id, type:"good"});
      queueCelebration("★ テンバガー達成 ★", `${st.name}が10倍株になった!あなたが早期に発掘した企業が、市場から大きな評価を受けている。`);
    } else if(multiple>=5 && !pos.hit5x){
      pos.hit5x = true;
      state.stats.fiveBaggers = (state.stats.fiveBaggers||0)+1;
      state.discoveries.unshift({name:st.name, multiple:multiple.toFixed(1), day:state.day, type:"5x"});
      if(state.discoveries.length>30) state.discoveries.pop();
      grantInvestorXP(120);
      pushNews(`早期から注目していた${st.name}が5倍株に成長した!`, {stars:4, kind:"confirmed", category:"milestone", stockId:st.id, type:"good"});
    }
  }
}

function updateBrokerage(dailyReturn){
  if(!state.brokerage.unlocked) return;
  state.brokerage.reputation = clamp(state.brokerage.reputation + dailyReturn*200 - 0.1, 0, 100);
  const growthFactor = (state.brokerage.reputation-50)/50;
  const customerDelta = Math.round(state.brokerage.customers*0.002*growthFactor + rand(-1,3));
  state.brokerage.customers = Math.max(0, state.brokerage.customers+customerDelta);
  const inflow = state.brokerage.customers * rand(5000,20000);
  state.brokerage.brokerageAUM = Math.max(0, state.brokerage.brokerageAUM*(1+dailyReturn*0.5) + inflow);
  const fee = state.brokerage.brokerageAUM * (0.008/365);
  state.brokerage.feeIncome = fee;
  state.cash += fee;
}

// 資金調達の必要性(現金が少ない創業企業に外部資金が入り、プレイヤーの持株比率が希薄化することがある)
function checkFundraisingNeed(v){
  if(v.stage!=="private" || !v.isFounded) return;
  if((v.cashBalance||0) < 5_000_000 && Math.random()<0.10){
    const dilution = rand(0.05,0.15);
    const before = v.stake;
    v.stake = clamp(v.stake*(1-dilution), 0, 1);
    v.cashBalance = (v.cashBalance||0) + Math.max(5_000_000, Math.abs(v.baseProfit||v.cumulativeInvestment*0.1)*3);
    pushNews(`${v.name}が外部投資家から資金調達を実施した。持株比率が${(before*100).toFixed(0)}%→${(v.stake*100).toFixed(0)}%に希薄化した。`, {stars:2, kind:"confirmed", category:"venture", type:"event"});
    if(before>=0.5 && v.stake<0.5){
      pushNews(`${v.name}の経営権比率が過半数を割り込んだ。今後の経営方針には他の株主の意向も影響する。`, {stars:3, kind:"confirmed", category:"venture", type:"event"});
    }
  }
}

  if(v.stage!=="private") return;

    v.stage = "failed";
    v.failureReason = "成長停滞";

}

// 他の投資家が創業したスタートアップへの早期投資(少額出資、成功すれば大きなリターンが期待できる)
function investInStartup(startupId, amount){
  if(!canUnlockAcquisitions()) return {ok:false, msg:"投資の解放条件を満たしていません"};
  const def = NPC_STARTUP_POOL.find(d=>d.id===startupId);
  if(!def) return {ok:false, msg:"対象企業が見つかりません"};
  if(state.ventures.find(v=>v.defId===startupId && v.stage!=="failed")) return {ok:false, msg:"すでに出資済みです"};
  const minAmount = Math.round(def.requiredInvestment*0.1);
  if(amount<minAmount) return {ok:false, msg:`最低${fmtYen(minAmount)}からの出資が必要です`};
  if(availableCash()<amount) return {ok:false, msg:"資金が不足しています"};
  state.cash -= amount;
  const stake = clamp(amount/def.requiredInvestment*0.3, 0.01, 0.35);
  const venture = createVentureObject(def, "minority", amount, null);
  venture.stake = stake;
  venture.investedCapital = amount;
  venture.cumulativeInvestment = amount;
  state.ventures.push(venture);
  state.stats.acquisitionCount = (state.stats.acquisitionCount||0)+1;
  pushNews(`まだ無名の「${def.name}」に早期投資を行った。`, {stars:3, kind:"confirmed", category:"venture", type:"good"});
  saveState();
  return {ok:true, msg:"出資が完了しました"};
}

function createVentureObject(def, method, cost, parentVentureId){

// 買収交渉: 提案→経営陣の反応→主要株主の反応→価格交渉→成立/不成立、という流れを一括で解決する
function proposeAcquisition(companyId, method, offerPremium=0){
  if(!canUnlockAcquisitions()) return {ok:false, msg:"企業買収の解放条件を満たしていません"};
  const def = PRIVATE_COMPANY_POOL.find(d=>d.id===companyId);
  if(!def) return {ok:false, msg:"対象企業が見つかりません"};
  if(state.ventures.find(v=>v.defId===companyId && v.stage!=="failed")) return {ok:false, msg:"すでに出資済みです"};
  const m = ACQUISITION_METHODS[method];
  if(!m) return {ok:false, msg:"不正な買収方法です"};
  const baseCost = Math.round(def.requiredInvestment*m.costMult);
  const offerCost = Math.round(baseCost*(1+offerPremium));
  if(availableCash()<offerCost) return {ok:false, msg:"資金が不足しています"};

  const difficulty = computeBuyoutDifficulty(def);
  const successProb = clamp(0.30 + offerPremium*0.9 - difficulty*0.45 + (m.stake-0.5)*0.15, 0.05, 0.92);
  const execFriendly = Math.random() < clamp(0.55 - difficulty*0.3 + offerPremium*0.5, 0.1, 0.9);
  const holderFriendly = Math.random() < clamp(0.5 + offerPremium*0.6, 0.1, 0.9);
  const narrative = [
    `${def.name}へ買収を提案した(${m.label}、想定額の${Math.round((1+offerPremium)*100)}%相当 = ${fmtYen(offerCost)})。`,
    execFriendly ? "経営陣は前向きに検討する姿勢を示した。" : "経営陣は慎重な姿勢を崩さなかった。",
    holderFriendly ? "主要株主からも歓迎する声が上がっている。" : "一部株主からは価格面での不満の声も出ている。",
  ];

  const success = Math.random() < successProb;
  if(success){
    state.cash -= offerCost;
    const venture = createVentureObject({...def, requiredInvestment:offerCost}, method, offerCost, null);
    state.ventures.push(venture);
    state.stats.acquisitionCount = (state.stats.acquisitionCount||0)+1;
    narrative.push("価格交渉がまとまり、買収が成立した。");
    pushNews(`${def.name}の買収が成立した(${m.label})。`, {stars:4, kind:"confirmed", category:"venture", type:"good"});
    saveState();
    return {ok:true, msg:"買収が成立しました", narrative, success:true};
  } else {
    narrative.push("交渉は難航し、買収は不成立に終わった。");
    pushNews(`${def.name}への買収提案は不成立に終わった。`, {stars:2, kind:"confirmed", category:"venture", type:"event"});
    return {ok:false, msg:"買収交渉が不成立に終わりました", narrative, success:false};
  }
}
function acquireCompany(companyId, method){ return proposeAcquisition(companyId, method, 0); }

/* ==========================================================================
   敵対的買収・TOB(株式公開買付)システム
   すべて実際の株価・株主マスターデータ・プレイヤー資産から算出する(独立した数字は作らない)
   ========================================================================== */
const TOB_PERSONA_STYLES = {institutional:"機関投資家", foreign:"外国人投資家", individual:"個人投資家", company:"安定株主", player:"プレイヤー", mixed:"個人投資家"};
// 買収難易度(0〜1): 経営陣・安定株主比率、企業の質が高いほど困難になる
// 保有比率に応じた株主としての影響力の段階(現実の会社法の考え方を参考にした目安)
const SHAREHOLDER_INFLUENCE_TIERS = [
  {min:0.501, label:"実質的な経営支配", desc:"議決権の過半数を握り、経営を直接支配できる水準です。"},
  {min:0.334, label:"重要議案への拒否権", desc:"特別決議を単独で阻止できる水準です。"},
  {min:0.20,  label:"経営への影響力大", desc:"持分法適用など、経営への影響力が強い水準です。"},
  {min:0.10,  label:"主要株主", desc:"大量保有報告書の提出対象となる主要株主です。"},
  {min:0.05,  label:"大株主", desc:"5%以上を保有する大株主です。"},
];
function computeShareholderInfluenceTier(pct){
  const ratio = pct/100;
  for(const tier of SHAREHOLDER_INFLUENCE_TIERS){ if(ratio>=tier.min) return tier; }
  return null;
}
// 市場での買い集めにより過半数を保有した場合、TOBを経ずに直接経営に参画できるようにする
// (敵対的TOBは「防衛される側の抵抗を打ち破って奪う」ルート、こちらは「静かに買い集めて実質支配する」ルート)
function canTakeDirectManagementControl(st){
  const linkedVenture = state.ventures.find(v=>v.listedStockId===st.id && v.stage==="listed");
  if(linkedVenture) return false;
  const pos = state.portfolio[st.id];
  const pct = pos ? pos.shares/st.shares : 0;
  return pct>0.5 && canUnlockAcquisitions();
}
function takeDirectManagementControl(stockId){
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  if(!canTakeDirectManagementControl(st)) return {ok:false, msg:"議決権の過半数を保有していないか、条件を満たしていません"};
  const pos = state.portfolio[st.id];
  const stake = pos.shares/st.shares;
  const v = convertStockToVenture(st, stake, "market_accumulation");
  v.history = [{day:state.day, text:`市場での買い集めにより議決権の${(stake*100).toFixed(1)}%を取得し、経営に参画した`}];
  state.ventures.push(v);
  state.stats.acquisitionCount = (state.stats.acquisitionCount||0)+1;
  pushNews(`${st.name}の議決権の過半数を取得し、経営権を掌握した。`, {stars:5, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  queueCelebration("経営権取得", `${st.name}の経営に参画し、再建の舵取りを担うことになった。`);
  saveState();
  return {ok:true, msg:"経営権を取得しました", ventureId:v.id};
}
function computeTakeoverDifficultyForStock(st){
  const holders = getUnifiedShareholders(st);
  const stablePct = holders.filter(h=>h.isStable).reduce((s,h)=>s+h.shares,0)/st.shares;
  return clamp(0.2 + stablePct*0.5 + (st.quality-0.5)*0.3, 0.1, 0.9);
}
// 敵対的買収の各種指標をすべて実データから算出する(株主構成・保有比率・時価総額など)
function computeTakeoverMetrics(st){
  const holders = getUnifiedShareholders(st);
  const total = st.shares;
  const marketCap = st.price*st.shares;
  const playerPct = playerOwnershipPct(st);
  const topHolder = holders[0];
  const majorHolders = holders.filter(h=>h.isMajor);
  const managementPct = holders.filter(h=>h.isManagement).reduce((s,h)=>s+h.shares,0)/total*100;
  const stablePct = holders.filter(h=>h.isStable).reduce((s,h)=>s+h.shares,0)/total*100;
  const difficulty = computeTakeoverDifficultyForStock(st);
  const requiredPct = 50; // 経営権取得の目安ライン(過半数)
  const estCostAtMarket = Math.round(marketCap*(requiredPct/100 - playerPct/100 > 0 ? requiredPct/100 - playerPct/100 : 0.05) * 1.25);
  const boardResistance = clamp(0.3 + difficulty*0.5, 0.1, 0.9);
  const shareholderApproval = clamp(0.5 - difficulty*0.3 + (playerPct-20)/100, 0.05, 0.9);
  return {
    name:st.name, price:st.price, marketCap, sharesOutstanding:total, floatShareCount:floatShares(st),
    playerShares: state.portfolio[st.id]?state.portfolio[st.id].shares:0, playerPct,
    topHolder, majorHolders, managementPct, stablePct,
    difficulty, boardResistance, shareholderApproval, requiredPct, estCostAtMarket,
  };
}
// 敵対的買収の開始条件を判定する(不足している場合は具体的な理由を返す)
function canStartHostileTakeover(stockId){
  const st = state.stocks.find(s=>s.id===stockId);
  const reasons = [];
  if(!st) return {ok:false, reasons:["対象銘柄が見つかりません"]};
  if(state.ventures.some(v=>v.listedStockId===stockId && v.stage!=="failed")) reasons.push("すでに経営に参加しています");
  if(state.activeTob) reasons.push("すでに進行中のTOBがあります(同時に1件まで)");
  if(!canUnlockAcquisitions()) reasons.push("企業買収の解放条件を満たしていません");
  if(state.investorLevel<15) reasons.push("投資家レベル15以上が必要です");
  const metrics = computeTakeoverMetrics(st);
  if(metrics.playerPct<5) reasons.push(`株式保有比率が不足しています(現在${metrics.playerPct.toFixed(1)}%、目安5%以上)`);
  if(availableCash()<metrics.estCostAtMarket*0.3) reasons.push("資金が不足しています(TOB開始には概算買付資金の一部を用意する必要があります)");
  return {ok: reasons.length===0, reasons, metrics};
}
function startTOB(stockId, price, targetShares, periodDays){
  const check = canStartHostileTakeover(stockId);
  if(!check.ok) return {ok:false, msg:check.reasons.join(" / ")};
  const st = state.stocks.find(s=>s.id===stockId);
  const estCost = price*targetShares;
  if(availableCash()<estCost) return {ok:false, msg:"買付資金が不足しています"};
  state.reservedCash += estCost;
  const holders = ensureShareholderRegistry(st);
  const floatPool0 = holders.find(h=>h.id==="float_pool");
  state.activeTob = {
    stockId, price, targetShares, periodDays:Math.max(3,periodDays),
    startDay: state.day, endDay: state.day+Math.max(3,periodDays),
    appliedShares:0, resolved:false, reservedAmount:estCost,
    defenseTriggered:null, specialEvent:null, decidedHolderIds:[], appliedHolderIds:[],
    floatPoolUndecided: floatPool0 ? floatPool0.shares : 0, floatPoolApplied:0,
  };
  const premiumPct = ((price/st.price-1)*100).toFixed(1);
  pushNews(`【TOB開始】${state.playerName||"投資家"}が${st.name}へのTOB(株式公開買付)を開始した。買付価格¥${fmtNum(price)}(プレミアム${premiumPct}%)、買付予定${fmtNum(targetShares)}株。`, {stars:5, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  state.stats.tobStartedCount = (state.stats.tobStartedCount||0)+1;
  saveState();
  return {ok:true, msg:"TOBを開始しました"};
}
// NPC株主の投資スタイルに基づく応募判断(同じ条件でも株主によって判断が異なる)
function npcShareholderDecision(holder, st, tob){
  const premiumPct = (tob.price/st.price-1)*100;
  let score = 0;
  score += clamp(premiumPct/30, -0.35, 0.6);
  score += (st.quality<0.4 ? 0.2 : -0.1);
  score += (holder.style==="foreign" ? 0.15 : 0);
  score += (holder.style==="mixed" ? 0.15 : 0);
  score += (holder.isStable ? -0.45 : 0);
  score += (holder.isManagement ? -0.35 : 0);
  score += (holder.isFounder ? -0.4 : 0);
  score += rand(-0.2,0.2);
  return score>0;
}
function accumulateNpcApplications(st, tob){
  const holders = ensureShareholderRegistry(st);
  const dailyChance = 2/tob.periodDays;
  if(!tob.appliedHolderIds) tob.appliedHolderIds = [];
  if(tob.floatPoolApplied===undefined) tob.floatPoolApplied = 0;
  holders.forEach(h=>{
    if(h.id==="float_pool") return; // 市場流通分はプレイヤー以外の個人投資家の集合のため、応募判断は下記で別途扱う
    if(h.lockup) return; // ロックアップ中は応募不可
    if(state.activeTob.decidedHolderIds.includes(h.id)) return;
    if(Math.random()>dailyChance) return;
    state.activeTob.decidedHolderIds.push(h.id);
    if(npcShareholderDecision(h, st, tob)){ tob.appliedShares += h.shares; tob.appliedHolderIds.push(h.id); }
  });
  // 市場流通分(個人投資家)は、まだ判断していない残数から毎日一定割合が判断を下す(同じ株式が二重に判断されないようにする)
  if(tob.floatPoolUndecided===undefined){
    const floatPool = holders.find(h=>h.id==="float_pool");
    tob.floatPoolUndecided = floatPool ? floatPool.shares : 0;
  }
  if(tob.floatPoolUndecided>0){
    const portion = Math.min(tob.floatPoolUndecided, Math.round(tob.floatPoolUndecided * dailyChance * 0.6));
    if(portion>0){
      tob.floatPoolUndecided -= portion;
      if(npcShareholderDecision({isStable:false, style:"mixed"}, st, tob)){
        tob.appliedShares += portion;
        tob.floatPoolApplied += portion;
      }
    }
  }
}
// 買収防衛策(低確率で発動)
function triggerDefenseMeasure(st, tob){
  const measures = ["ホワイトナイト","第三者割当増資","自社株買い","新株予約権(ポイズンピル)","大株主への協力要請","株主還元強化","買収反対キャンペーン"];
  const measure = pick(measures);
  tob.defenseTriggered = measure;
  if(measure==="第三者割当増資"){
    applyCapitalStructureEvent(st, "増資");
    pushNews(`${st.name}がTOBへの対抗策として第三者割当増資を実施した。プレイヤーの持株比率が希薄化した。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  } else if(measure==="自社株買い"){
    applyCapitalStructureEvent(st, "自社株買い");
    pushNews(`${st.name}がTOBへの対抗策として自社株買いを実施した。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  } else if(measure==="ホワイトナイト"){
    pushNews(`${st.name}にホワイトナイト(友好的な買収者)が現れた。既存株主の一部が防衛に協力する構えを見せている。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  } else {
    pushNews(`${st.name}の経営陣がTOBに対する防衛策(${measure})を発表した。`, {stars:3, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  }
}
// TOB期間中の低確率な特殊イベント
function triggerTobSpecialEvent(st, tob){
  const events = ["対抗TOB出現","海外ファンド参入","経営陣辞任表明","大株主が買収を支持","思惑買いで株価急騰"];
  const ev = pick(events);
  tob.specialEvent = ev;
  if(ev==="大株主が買収を支持"){
    const holders = ensureShareholderRegistry(st);
    const stable = holders.filter(h=>h.isStable && !state.activeTob.decidedHolderIds.includes(h.id));
    if(stable.length){ const h=pick(stable); state.activeTob.decidedHolderIds.push(h.id); tob.appliedShares += h.shares; }
    pushNews(`${st.name}の大株主がTOBへの賛同を表明した。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"good"});
  } else if(ev==="思惑買いで株価急騰"){
    const band = getPriceLimitBand(st.price);
    st.prevPrice = st.price; st.price = Math.min(st.price+band, tob.price);
    pushNews(`${st.name}の株価がTOB思惑で急騰している。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"good"});
  } else {
    pushNews(`${st.name}のTOBを巡り「${ev}」の動きが観測されている。`, {stars:3, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  }
}
function updateActiveTob(){
  const tob = state.activeTob;
  if(!tob || tob.resolved) return;
  const st = state.stocks.find(s=>s.id===tob.stockId);
  if(!st){ state.reservedCash=Math.max(0,state.reservedCash-tob.reservedAmount); state.activeTob=null; return; }

  if(!tob.defenseTriggered && Math.random()<0.04) triggerDefenseMeasure(st, tob);
  if(!tob.specialEvent && Math.random()<0.015) triggerTobSpecialEvent(st, tob);
  accumulateNpcApplications(st, tob);

  if(state.day>=tob.endDay) resolveTOB(tob, st);
}
function resolveTOB(tob, st){
  tob.resolved = true;
  const pos = state.portfolio[st.id];
  const playerShares = pos ? pos.shares : 0;
  const totalControlled = playerShares + tob.appliedShares;
  const controlPct = totalControlled/st.shares*100;
  const difficulty = computeTakeoverDifficultyForStock(st);
  const boardResistance = clamp(0.3+difficulty*0.5 - (tob.defenseTriggered?0.15:0), 0.1, 0.85);
  const approvalProb = clamp(0.10 + (controlPct-30)/100*1.3 - boardResistance*0.3, 0.03, 0.93);
  const passesThreshold = controlPct>=34;
  const success = passesThreshold && Math.random()<approvalProb;

  state.reservedCash = Math.max(0, state.reservedCash-tob.reservedAmount);

  if(success){
    const actualCost = tob.price*tob.appliedShares;
    state.cash -= actualCost;
    if(tob.appliedShares>0){
      const holders = ensureShareholderRegistry(st); // まず現時点の実保有で登録簿を同期する
      if(pos){ pos.shares += tob.appliedShares; pos.avgCost = (pos.avgCost*playerShares + actualCost)/(playerShares+tob.appliedShares); }
      else state.portfolio[st.id] = {shares:tob.appliedShares, avgCost:tob.price};
      // 実際に応募した株主(個別株主)から株式を移転する(登録簿の合計は常に発行済株式数と一致させる)
      (tob.appliedHolderIds||[]).forEach(hid=>{
        const h = holders.find(x=>x.id===hid);
        if(h) h.shares = 0; // 応募した株主は全株をTOBに応じて手放す(簡易化)
      });
      const floatPool = holders.find(h=>h.id==="float_pool");
      if(floatPool) floatPool.shares = Math.max(0, floatPool.shares-(tob.floatPoolApplied||0));
      // プレイヤーの登録簿エントリを取得後の実保有株数に合わせて更新する(他エントリから移転した分をここで反映する)
      const playerEntry = holders.find(h=>h.id==="player");
      if(playerEntry) playerEntry.shares = state.portfolio[st.id].shares;
      else holders.push({id:"player", name:(state.playerName||"プレイヤー"), type:"player", shares:state.portfolio[st.id].shares, isMajor:true, isManagement:false, isFounder:false, isParent:false, isStable:false, lockup:false, isFloat:true, style:"player"});
    }
    const venture = convertStockToVenture(st, (playerShares+tob.appliedShares)/st.shares, "hostile_tob");
    state.ventures.push(venture);
    state.stats.acquisitionCount = (state.stats.acquisitionCount||0)+1;
    state.stats.tobSuccessCount = (state.stats.tobSuccessCount||0)+1;
    state.stats.maxTobPremium = Math.max(state.stats.maxTobPremium||0, (tob.price/st.prevPrice-1)*100);
    state.stats.maxTobCost = Math.max(state.stats.maxTobCost||0, actualCost);
    pushNews(`【TOB成立】${st.name}の経営権を取得した(応募${fmtNum(tob.appliedShares)}株、支配比率${controlPct.toFixed(1)}%)。`, {stars:5, kind:"confirmed", category:"venture", stockId:st.id, type:"good"});
    queueCelebration("敵対的買収成功!", `${st.name}のTOBが成立し、経営権を取得した。企業グループに加わった。`);
  } else {
    let reason;
    if(!passesThreshold) reason = "応募株数不足";
    else if(tob.defenseTriggered) reason = `${tob.defenseTriggered}による防衛成功`;
    else reason = "株主総会で否決";
    pushNews(`【TOB不成立】${st.name}へのTOBは不成立に終わった(${reason})。保有株式は大株主として維持される。`, {stars:4, kind:"confirmed", category:"venture", stockId:st.id, type:"event"});
  }
  reconcileShareholderRegistry(st); // 登録簿の合計が発行済株式数と厳密に一致するよう最終検算する
  state.activeTob = null;
  saveState();
}
// 旧仕様との互換用の簡易入口(即座に標準的なTOBを1回だけ試みる、UIからは基本的にstartTOBを使う)
function attemptHostileTakeover(stockId){
  const st = state.stocks.find(s=>s.id===stockId);
  if(!st) return {ok:false, msg:"銘柄が見つかりません"};
  return startTOB(stockId, Math.round(st.price*1.25), Math.max(TRADING_UNIT, Math.round(st.shares*0.15/100)*100), 14);
}

// 子会社化: 上場企業(持株会社)が非上場企業を傘下に収め、企業グループを形成する
function acquireSubsidiary(parentVentureId, companyId, method){
  const parent = state.ventures.find(x=>x.id===parentVentureId);
  if(!parent || parent.stage!=="listed") return {ok:false, msg:"上場企業のみ子会社を保有できます"};
  const def = PRIVATE_COMPANY_POOL.find(d=>d.id===companyId);
  if(!def) return {ok:false, msg:"対象企業が見つかりません"};
  if(state.ventures.find(v=>v.defId===companyId && v.stage!=="failed")) return {ok:false, msg:"すでに出資済みです"};
  const m = ACQUISITION_METHODS[method];
  if(!m) return {ok:false, msg:"不正な買収方法です"};
  const cost = Math.round(def.requiredInvestment*m.costMult);
  if(availableCash()<cost) return {ok:false, msg:"資金が不足しています"};
  state.cash -= cost;
  const sub = createVentureObject(def, method, cost, parent.id);
  state.ventures.push(sub);
  if(!parent.subsidiaries) parent.subsidiaries=[];
  parent.subsidiaries.push(sub.id);
  state.stats.acquisitionCount = (state.stats.acquisitionCount||0)+1;
  pushNews(`${parent.name}が${def.name}を子会社化した(${m.label})。企業グループが拡大している。`, {stars:4, kind:"confirmed", category:"venture", type:"good"});
  saveState();
  return {ok:true, msg:"子会社化が完了しました"};
}
